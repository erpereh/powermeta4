ev_mss.DescrCargaObj = Select the employee whose personal objectives you want to change or whose organizational and personal objectives you want to view.
ev_mss.DescrCargaObj2 = In this page you can assign new personal objectives to the selected employee. You can select an objective from the list or select particular objectives to define a new one. The objectives may be quantitative or qualitative (scale-based results). Qualitative objectives must be defined with a scale by the HR Department. See the objectives pending validation and the valid objectives assigned to the employee at the bottom of the form.
ev_mss.DescrObjPart = If you do not find the objective in this list you can create a particular objective for this employee.
ev_mss.DescrConsObj = Verify the objectives assigned to you and comment if you are in agreement with them.
ev_mss.DescriDeleg = Here you can delegate the appraisal
ev_mss.DescrConsSeg = View the open follow-up appraisal processes in which you are the appraiser. To evaluate a particular process, select the name of the employee.
ev_mss.DescrConsEv = View the open appraisal processes in which you are the appraiser. To evaluate a particular process, select the name of the appraisal.
ev_mss.DescrEv = Appraise the open appraisal processes in which you are the appraiser. To access the appraisal form, select the appraisee name.
ev_mss.DescrSeg = Appraise the open follow-up appraisal processes in which you are the appraiser. You can temporary save the results without Submitting.
ev_mss.DescrCritEv =View the open appraisal processes in which you are the appraiser. To change the appraisal criteria, select the appraisee name.
ev_mss.DescrCritEvdet =Use this page to change the appraisal criteria. You can modify or delete a criterion by clicking the icon to its right. Use the "Add New..." link to add new criteria. You can change the percentage of organizational or personal criteria for this employee by clicking each criteria group icon. When you finish changing the criteria, end your task by clicking the icon next to the process name.

