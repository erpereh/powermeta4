Title.sssp_g1_p6_001=Mis datos para el IRPF
Label.sssp_g1_p6_001_001=En esta pantalla puedes consultar tu situación para el IRPF vigente. Si tu situación ha cambiado en cualquiera de los bloques que aparecen a continuación, dirígete a la opción de menú Modificar mi situación IRPF. Adicionalmente, puedes consultar el Historial de modificaciones realizadas, y, en caso de que sea necesario, imprimir el Modelo 145.
Label.sssp_g1_p6_001_002=Información IRPF
Label.sssp_g1_p6_001_003=1. Datos perceptor
Label.sssp_g1_p6_001_004=2. Descendientes
Label.sssp_g1_p6_001_005=3. Ascendientes
Label.sssp_g1_p6_001_006=4. Pensiones
Label.sssp_g1_p6_001_007=5. Vivienda habitual
Label.sssp_g1_p6_001_008=Sin hijos y descendientes menores de 25, o mayores si son discapacitados
