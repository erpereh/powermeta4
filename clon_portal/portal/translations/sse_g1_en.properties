Title.sssp_g1_p6_002=Modificar mi situación para el IRPF
Label.sssp_g1_p6_002_001=En esta pantalla puedes modificar tu situación para el IRPF si ha cambiado en cualquiera de los bloques que aparecen a continuación.
Label.sssp_g1_p6_002_002=Eliminar
Title.sssp_g1_p6_003=Historial de modificaciones realizadas
Label.sssp_g1_p6_003_001=En esta pantalla puedes consultar las modificaciones que has realizado en tu situación IRPF y la fecha a partir de la cual tuvieron efecto.<br>Adicionalmente, dependiendo de tu tipo de IRPF (Estatal o Foral), podrás ver el estado del acuse de recibo del Modelo 145.
Label.sssp_g1_p6_003_nodata=Actualmente no tienes ninguna modificación realizada
Title.sssp_g1_p6_004=Imprimir Modelo 145
Label.sssp_g1_p6_004_001=En el siguiente enlace podrás imprimir el Modelo 145 correspondiente a tu situación actual.<BR>Recuerda que debes entregar este documento en el departamento de Recursos Humanos de tu empresa en el caso de que hayas realizado alguna modificación en tu situación.
Label.sssp_g1_p6_004_002 =Ver Modelo 145 cumplimentado

