Label.sssp_g1_p6_001_001=En esta pantalla puedes consultar tu situación para el IRPF vigente. Si tu situación ha cambiado en cualquiera de los bloques que aparecen a continuación, dirígete a la opción de menú Modificar mi situación IRPF. Adicionalmente, puedes consultar el Historial de modificaciones realizadas, y, en caso de que sea necesario, imprimir el Modelo 145.
