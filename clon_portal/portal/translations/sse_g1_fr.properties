Label.sssp_g1_p6_003_001=En esta pantalla puedes consultar las modificaciones que has realizado en tu situación IRPF y la fecha a partir de la cual tuvieron efecto.<br>Adicionalmente, dependiendo de tu tipo de IRPF (Estatal o Foral), podrás ver el estado del acuse de recibo del Modelo 145.
