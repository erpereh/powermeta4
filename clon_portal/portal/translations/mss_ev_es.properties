//********************************* Descripciones *******************************************************************

ev_mss.DescrCargaObj = Selecciona el empleado del quieres cambiar sus objetivos personales o consultar sus objetivos tanto organizativos como personales
ev_mss.DescrCargaObj2 = En esta p&aacute;gina puedes asignar nuevos objetivos personales para el empleado seleccionado. Puedes seleccionar un objetivo de la lista o seleccionar objetivos particulares para definir uno nuevo. Los objetivos pueden ser cuantitativos o cualitativos (resultados basados en una escala). Para que un objetivo sea cualitativo debe haber sido definido previamente por RRHH con una escala. Al final del formulario puedes consultar los objetivos pendientes de validar y los vigentes asignados al empleado
ev_mss.DescrObjPart = Si no encuentra el objetivo en esta lista puede crear un objetivo particular para este empleado.
ev_mss.DescrConsObj = Consulta los objetivos que te han asignado y comenta si est&aacute;s de acuerdo
ev_mss.DescriDeleg = Desde aqu&iacute; puedes delegar la evaluaci&oacute;n
ev_mss.DescrConsSeg = Consulta los procesos de evaluaci&oacute;n de seguimiento abiertos en los que t&uacute; eres el evaluador. Para evaluar un proceso de seguimiento determinado, sit&uacute;ate sobre el nombre del empleado.
ev_mss.DescrConsEv = Consulta los procesos de evaluaci&oacute;n abiertos en los que t&uacute; eres el evaluador. Para evaluar un proceso de selecci&oacute;n determinado, sit&uacute;ate sobre el nombre de la evaluaci&oacute;n.
ev_mss.DescrEv = Eval&uacute;a los procesos de evaluaci&oacute;n abiertos en los que t&uacute; eres el evaluador.Para acceder al formulario de evaluaci&oacute;n sit&uacute;ate sobre el nombre del evaluado.
ev_mss.DescrSeg = Eval&uacute;a los procesos de evaluaci&oacute;n de seguimiento abiertos en los que t&uacute; eres el evaluador. Puedes guardar temporalmente los resultados sin Enviar.
ev_mss.DescrCritEv =Consulta los procesos de  evaluaci&oacute;n abiertos en los que t&uacute; eres el evaluador. Para cambiar los criterios a evaluar sit&uacute;ate sobre el nombre del evaluado.
ev_mss.DescrCritEvdet =Desde esta p&aacute;gina puedes cambiar los criterios de la evaluaci&oacute;n. Para modificar o eliminar un criterio puedes acceder a trav&eacute;s de los iconos situados a la derecha de cada criterio. Si quieres añadir nuevos criterios accede por los enlaces "Agregar nuevo ..." .Si quieres modificar el porcentaje de criterios organizativos o personales que corresponde a este empleado puedes acceder al icono situado en cada grupo de criterios.Cuando termines de cambiar los criterios finaliza tu tarea pulsando el icono situado junto al nombre del proceso.

