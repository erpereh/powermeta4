ev_mss.DescrHistEvmss2 = Aqui pode ver os resultados globais das tr&ecirc;s &uacute;ltimas avalia&ccedil;&otilde;es e os dados da &uacute;ltima.
ev_mss.GrafGaussDesc = Nesta anal&iacute;tica pode ver como se tem decido que deve ser a distribui&ccedil;&atilde;o de resultados para este plano de avalia&ccedil;&atolde;o, isto é, qual é a percentagem de empregados esperados em cada n&iacute;vel do resultado final da avalia&ccedil;&atilde;o de conhecimentos. Na medida que for realizando as avalia&ccedil;&otilde;es poder&aacute; comparar a distribui&ccedil;&atilde;o recomendada com a distribui&ccedil;&atilde;o dos resultados dos seus avaliados
