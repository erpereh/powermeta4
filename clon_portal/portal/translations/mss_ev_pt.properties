//********************************* Descripciones *******************************************************************

ev_mss.DescrCargaObj = Selecciona o empregado de quem quer alterar seus objectivos pessoais ou consultar os seus objectivos tanto organizativos como pessoais
ev_mss.DescrCargaObj2 = Nesta p&aacute;gina pode atribuir novos objectivos pessoais para o empregado seleccionado. Pode seleccionar um objectivo da lista ou seleccionar objectivos particulares para definir um novo. Os objectivos podem ser quantitativos ou qualitativos (resultados baseados numa escala). Para que um objectivo seja qualitativo deve ter sido definido previamente por RH com uma escala. No final do formul&aacute;rio pode consultar os objectivos pendentes de validar e os vigentes atribuídos ao empregado
ev_mss.DescrObjPart = Se n&atilde;o encontra o objectivo nesta lista pode criar um objectivo particular para este empregado.
ev_mss.DescrConsObj = Consulte os objectivos que lhe t&ecirc;m atribuído e comente se concorda.
ev_mss.DescriDeleg = A partir daqui pode delegar a avalia&ccedil;&atilde;o
ev_mss.DescrConsSeg = Consulte os processos de avalia&ccedil;&atilde;o de acompanhamento abertos onde participa como avaliador. Para avaliar um processo de acompanhamento dado, coloque o ponteiro do rato sobre o nome do empregado
ev_mss.DescrConsEv = Consulte os processos de avalia&ccedil;&atilde;o abertos onde participa como avaliador. Para avaliar um dado processo de selec&ccedil;&atilde;o, coloque o ponteiro do rato sobre o nome da avalia&ccedil;&atilde;o.
ev_mss.DescrEv = Avalia os processos de avalia&ccedil;&atilde;o abertos nos qual &eacute; o avaliador. Para aceder ao formulário de avalia&ccedil;&atilde;o situe-se sobre o nome do avaliado.
ev_mss.DescrSeg = Avalie os processos de avalia&ccedil;&atilde;o de acompanhamento abertos onde participa como avaliador. Pode gravar temporariamente os resultados sem Enviar.
ev_mss.DescrCritEv =Consulte os processos de avalia&ccedil;&atilde;o abertos onde participa como avaliador. Para alterar os crit&eacute;rios a avaliar situe-se sobre o nome do avaliado.
ev_mss.DescrCritEvdet =Desde esta p&aacute;gina pode alterar os crit&eacute;rios da avalia&ccedil;&atilde;o. Para modificar ou eliminar um crit&eacute;rio pode aceder atrav&eacute;s dos &iacute;cones situados &agrave; direita de cada crit&eacute;rio. Se pretende adicionar novos crit&eacute;rios acede pelas hiperliga&ccedil;&otilde;es "Adicionar novo ..." .Se pretende modificar a percentagem de crit&eacute;rios organizativos ou pessoais que corresponde a este empregado pode aceder ao &iacute;cone situado em cada grupo de crit&eacute;rios. Quando termine de alterar os crit&eacute;rios finalize sua tarefa premendo o &iacute;cone situado junto ao nome do processo.

