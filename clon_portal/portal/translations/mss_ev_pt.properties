ev_mss.DataPref = Actualmente n&atilde;o h&aacute; qualquer dado do hist&oacute;rico de prefer&ecirc;ncias profissionais do seu empregado.
ev_mss.DescrSolEv = Consulte os resultados da avalia&ccedil;&atilde;o dos seus empregados. Al&eacute;m disso, em caso de ser necess&aacute;rio, pode solicitar forma&ccedil;&atilde;o para os Conhecimentos que n&atilde;o t&ecirc;m alcan&ccedil;ado o n&iacute;vel requerido, desde a hiperliga&ccedil;&atilde;o que h&atilde; sobre cada n&iacute;vel requerido.
