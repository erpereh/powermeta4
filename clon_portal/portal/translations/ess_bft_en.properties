//********************************* Descriptions *******************************************************************

bft_ess.DescBenefMenu       = Use this section to view your benefits, as well as to request a new one for you and your family members. You can also simulate new benefits and view how they affect your current salary.
bft_ess.DescBenefits        = This window displays all your current benefits, including all those you have requested as flexible retribution and those given by the company. If you want to request a new one or simulate new benefits, use the corresponding links.
bft_ess.DescHistBenefits    = This window displays the history of assigned benefits, including all those you have requested as flexible retribution and those given by the company.
bft_ess.DescSimulBenef      = Here you can chose the benefits you would like to request and run a simulation to obtain an Excel document with your new salary, as affected by the selected benefits.
bft_ess.DescSolicBenef      = Here you can choose the benefits you want to request.
bft_ess.BenefitsDepDesc     = Here you can request the health plan benefits for your family members.
bft_ess.BenefitsCancDesc    = Here you can cancel the requested benefit.
bft_ess.DescNoDataFound1    = You currently have no benefits.
bft_ess.DescNoDataFound2    = You currently have no benefits to select.
bft_ess.DescNoDataFound3    = There are currently no benefits pending approval.
bft_ess.DescNoDataFound4    = You currently have no family members to select.
bft_ess.DescNoDataFound5    = There are currently no benefits for family members pending approval.
bft_ess.DescNoDataFound6    = You currently have no benefits to cancel.
bft_ess.DescNoDataFound7    = There are currently no benefits pending cancellation.
bft_ess.DescPlan            = Here you can view the details of the desired benefit.
bft_ess.DescBenefitsSal     = This window displays your retribution package history, composed of monetary amounts, fixed salary and variable salary, and benefits. The latter includes both the flexible benefits and the benefits given by the company.
