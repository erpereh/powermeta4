ev_mss.DescrSolEv = Consultez les r&eacute;sultats de l'&eacute;valuation de vos collaborateurs. Au besoin, vous pouvez demander des formations pour les savoir-faire n'ayant pas atteint le niveau requis, en cliquant sur le lien correspondant.
