//********************************* Descriptions *******************************************************************

ev_mss.DescrCargaObj = S&eacute;lectionnez le collaborateur dont vous souhaitez changer les objectifs individuels ou consulter les objectifs (individuels et organisationnels).
ev_mss.DescrCargaObj2 = Cette page vous permet d'attribuer de nouveaux objectifs individuels au collaborateur s&eacute;lectionn&eacute;. Vous pouvez s&eacute;lectionner un objectif dans la liste ou bien d&eacute;finir un nouvel objectif particulier. Les objectifs peuvent &ecirc;tre quantitatifs ou qualitatifs (r&eacute;sultats bas&eacute;s sur une &eacute;chelle). Tout objectif qualitatif doit avoir &eacute;t&eacute; d&eacute;fini au pr&eacute;alable par le d&eacute;partement RH &agrave; l'aide d'une &eacute;chelle. La partie finale du formulaire vous permet de conna&icirc;tre les objectifs en attente de validation ainsi que les objectifs actuellement affect&eacute;s au collaborateur.
ev_mss.DescrObjPart = Si vous ne trouvez pas dans la liste l'objectif que vous recherchez, vous pouvez d&eacute;finir un objectif particulier pour le collaborateur.
ev_mss.DescrConsObj = Consultez les objectifs qui vous ont &eacute;t&eacute; attribu&eacute;s, puis dites si vous &ecirc;tes d'accord.
ev_mss.DescriDeleg = La fonctionnalité ci-dessous vous permet de d&eacute;l&eacute;guer une &eacute;valuation individuelle.
ev_mss.DescrConsSeg = Consultez les processus d'&eacute;valuation de suivi ouverts dont vous &ecirc;tes l'&eacute;valuateur. Pour s&eacute;lectionner un processus de suivi &agrave; &eacute;valuer, cliquez sur le nom du collaborateur correspondant.
ev_mss.DescrConsEv = Consultez les processus d'&eacute;valuation ouverts dont vous &ecirc;tes l'&eacute;valuateur. Pour s&eacute;lectionner un processus &agrave; &eacute;valuer, cliquez sur le nom du collaborateur correspondant.
ev_mss.DescrEv = &Eacute;valuez les processus d'&eacute;valuation ouverts dont vous &ecirc;tes l'&eacute;valuateur. En cliquant sur le nom d'une personne &agrave; &eacute;valuer, vous acc&eacute;dez au formulaire d'&eacute;valuation correspondant.
ev_mss.DescrSeg =&Eacute;valuez les processus d'&eacute;valuation de suivi ouverts dont vous &ecirc;tes l'&eacute;valuateur. Vous pouvez enregistrer temporairement les r&eacute;sultats, sans envoyer le formulaire.
ev_mss.DescrCritEv =Consultez les processus d'&eacute;valuation ouverts dont vous &ecirc;tes l'&eacute;valuateur. Pour changer les crit&egrave;res &agrave; &eacute;valuer, cliquez sur le nom de la personne &agrave; &eacute;valuer.
ev_mss.DescrCritEvdet =Cette page vous permet de modifier les crit&egrave;res d'&eacute;valuation. Pour modifier ou supprimer un crit&egrave;re, utilisez les icones situ&eacute;s &agrave; la droite de chaque crit&egrave;re. Utilisez le lien 'Ajouter nouveau...' pour ajouter des crit&egrave;res .Pour modifier la r&eacute;partition des crit&egrave;res individuels et organisationnels du collaborateur, utilisez l'icone situ&eacute; dans chaque groupe de crit&egrave;res. Une fois vos changements termin&eacute;s, cliquez sur l'icone situ&eacute; &agrave; c&ocirc;t&eacute; du libell&eacute; du processus d'&eacute;valuation.

