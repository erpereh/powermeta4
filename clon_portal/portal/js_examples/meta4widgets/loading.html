<!doctype html><!-- The DOCTYPE declaration above will set the     --><!-- browser's rendering engine into                --><!-- "Standards Mode". Replacing this declaration   --><!-- with a "Quirks Mode" doctype is not supported. --><html>	<head>		<meta http-equiv="content-type" content="text/html; charset=UTF-8">		<title>meta4.widget.loading</title>		<link rel="stylesheet" type="text/css" href="/js_examples/css/js_examples.css" />		<link type="text/css" rel="stylesheet" href="/js_examples/resources/syntax_highlighter/shCoreDefault.css" />				<!-- mootools -->		<script type="text/javascript" src="/js/mootools.js"></script>		<!-- m4jsapi -->		<script type="text/javascript" src="/m4jsapi/m4jsapi.nocache.js"></script>				<!-- meta4 -->		<script type="text/javascript" src="/js/data/data.js"></script>		<script type="text/javascript" src="/js/widget/widget.js"></script>							<!-- syntax highlighter -->		<script type="text/javascript" src="/js_examples/resources/syntax_highlighter/shCore.js"></script>		<script type="text/javascript" src="/js_examples/resources/syntax_highlighter/shBrushJScript.js"></script>						<!-- load example -->        <script type="text/javascript" src="/js_examples/resources/m4loadExample.js"></script>		<!-- load example -->		<script src="/js_examples/resources/ace_master/src-min-noconflict/ace.js"></script>		<script src="/js_examples/resources/ace_master/src-min-noconflict/ext-language_tools.js"></script>		<!-- load example -->		<script type="text/javascript" src="/js_examples/resources/m4loadExampleAce.js"></script>		<script>			var channelId = 'EXJSAPI_COMPONENT';			var nodeId = 'EXJSAPI_WIDGET_FORM';			var nodeAuxId = 'EXJSAPI_WIDGET_FORM_AUX';			var channel;			var objLoading;			function showExample1() {				var elem = document.getElementById("container");				objLoading1 = new meta4.widget.loading(elem);				//show layer loading				objLoading1.setTextLoading("Loading...");				objLoading1.show();			}			function hideExample1() {				objLoading1.hide();			}			function showExample2() {				objLoading2 = new meta4.widget.loading();				//show layer loading				objLoading2.setTextLoading("Press F5 to stop");				objLoading2.show();			}			function hideExample2() {				objLoading2.hide();			}						document.addEvent('meta4Ready', initTranslation);									function initTranslation() {												function loadlanguage(){					document.getElementById("maincontainer").style.visibility="visible";				}								meta4.widget.translate.loadLanguageFile(['examples_widgets_m4jsapi'], loadlanguage);			}								</script>	</head>		<body>	    <div id = 'maincontainer'>		<script>			SyntaxHighlighter.all();		</script>		<h1 data-m4trans="_WidgetsLoadingTitle"></h1>		<p data-m4trans="_WidgetsLoadingDescription"></p>		<h2 data-m4trans="_WidgetsLoadingSubtitle"></h2>		<pre class="brush: js;">    			&lt;script type="text/javascript" src="./js/mootools.js"&gt;&lt;/script&gt			&lt;script type="text/javascript" src="./js/meta4/data.js"&gt&lt;/script&gt    			&lt;script type="text/javascript" src="./js/meta4/widget.js"&gt&lt;/script&gt		</pre>				 <h2 data-m4trans="_WidgetsLoadingExample1Subtitle"></h2>		<br>		<h3 data-m4trans="_WidgetsLoadingExample1HTMLCodeTitle"></h3>		<pre class="brush: js;"> 		<div id="container" style="position:relative;"></div>		</pre>						<h3 data-m4trans="_WidgetsLoadingExample1JSCodeTitle"></h3>		<p data-m4trans="_WidgetsLoadingExample1JSCodeDescription"></p>		<script>			m4loadExample('showExample1');			m4loadExample('hideExample1');		</script>		<div id="container" style="height:100px;width:100px;position:relative;border:#808080 1px solid;margin-right: auto;margin-left: auto;"></div>		<p data-m4trans="_WidgetsLoadingExample1ExecuteText"></p>		<button onclick="showExample1()" data-m4trans="_WidgetsLoadingExample1ExecuteButtonShow">					</button>		<button onclick="hideExample1()" data-m4trans="_WidgetsLoadingExample1ExecuteButtonHide">					</button>		<h2 data-m4trans="_WidgetsLoadingExample2Subtitle"></h2>		<h3 data-m4trans="_WidgetsLoadingExample2JSCode"></h3>		<p data-m4trans="_WidgetsLoadingExample2JSCodeDescription"></p>		<script>			m4loadExample('showExample2');		</script>		<p data-m4trans="_WidgetsLoadingExample2ExecuteText"></p>		<button onclick="showExample2()" data-m4trans="_WidgetsLoadingExample2ExecuteButton">					</button>		</div>	</body></html>
