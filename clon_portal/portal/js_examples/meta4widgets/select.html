<!doctype html>
<!-- The DOCTYPE declaration above will set the     -->
<!-- browser's rendering engine into                -->
<!-- "Standards Mode". Replacing this declaration   -->
<!-- with a "Quirks Mode" doctype is not supported. -->

<html>
	<head>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">

		<title>meta4.widget.select</title>		
		
    	<link rel="stylesheet" type="text/css" href="/js_examples/css/js_examples.css" />
		<link type="text/css" rel="stylesheet" href="/js_examples/resources/syntax_highlighter/shCoreDefault.css" />
        
		<!-- mootools -->
		<script type="text/javascript" src="/js/mootools.js"></script>

		<!-- m4jsapi -->
		<script type="text/javascript" src="/m4jsapi/m4jsapi.nocache.js"></script>

        <!-- meta4 -->
        <script type="text/javascript" src="/js/data/data.js"></script>
        <script type="text/javascript" src="/js/widget/widget.js"></script>

      	<!-- load example -->
		<script src="/js_examples/resources/ace_master/src-min-noconflict/ace.js"></script>
		<script src="/js_examples/resources/ace_master/src-min-noconflict/ext-language_tools.js"></script>

		<!-- load example -->
		<script type="text/javascript" src="/js_examples/resources/m4loadExampleAce.js"></script>
	
		<script>
		function initTranslation() {
								
				function loadlanguage(){
					document.getElementById("maincontainer").style.visibility="visible";
				}
				
				meta4.widget.translate.loadLanguageFile(['examples_widgets_m4jsapi'], loadlanguage);
			}
						
			//event to inicialice program
			document.addEvent('meta4Ready', initTranslation);			
		</script>
	
		<script src="/examples/resources/trselect.js"></script>        
	</head>
	
	
	<body>
	    <div id = 'maincontainer'>
		<h1 data-m4trans="_WidgetsSelectTitle"></h1>
		<p data-m4trans="_WidgetsSelectDescription">			
		</p>
	
		<h2 data-m4trans="_WidgetsSelectSubtitle"></h2>
		<pre class="brush: js;">    
		  src="/js/mootools.js"
		  src="/js/data/data.js"    
		  src="/js/widget/widget.js"
		</pre>
		
		<p class="subTitlePage" data-m4trans="_WidgetsSelectMeta4ObjectText"></p>
		
		<p data-m4trans="_WidgetsSelectMeta4ObjectJSCode"></p>
		
		<script>
			m4loadExample('drawSelectByM4Object');
		</script>

        <div data-m4context="example" data-m4t3="SCH_LU_CREATION_TPS" style="text-align: center; position: relative; background-color: #DADEEA;">
            <select id="example" style="width: 200px; "></select>
            <a id="valueSelected"></a> 
        </div>
		<br>
        
        <button onclick="drawSelectByM4Object()" data-m4trans="_WidgetsSelectMeta4ObjectExecuteButton"></button>
        
        <p class="subTitlePage" data-m4trans="_WidgetsSelectArrayDescription"></p>
        
        <p data-m4trans="_WidgetsSelectArrayJSCode"></p>
        <script>
            m4loadExample('drawSelect');
        </script>

        <div  style="text-align: center; position: relative; background-color: #DADEEA;">
            <select id="byarray"></select>
        </div>
		<br>
        
        <button onclick="drawSelect()" data-m4trans="_WidgetsSelectArrayExecuteButton"></button>
    </div>
   </div>
</body>
</html>
