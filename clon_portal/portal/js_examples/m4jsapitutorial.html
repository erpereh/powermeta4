		<script>
			var m4Object = null;
			var example = {
				example1 : function() { 

					function onMetadataSuccess(request) {
						m4Object = new meta4.M4Object('EXJSAPI_COMPONENT');
						console.log('M4object created and loaded successfully');
					}

					function onMetadataFail(request) {
						console.log('Error in Meta4Object load metadata');
					}

					var ids = [];
					ids.push("EXJSAPI_COMPONENT");

					var executor = new meta4.M4Executor();
					executor.loadMetadata(ids, onMetadataSuccess, onMetadataFail);

				},
				example2 : function() {

					/**
					 *Function callback of success method
					 */
					function successMethod(request) {
						console.log('method successfully executed');
					}
					/**
					 *Function callback of fail method
					 */
					function failMethod(request) {
						console.log('method failed');
					}

					var request = new meta4.M4Request(m4Object, 'EXJSAPI_TUTORIAL', 'LOAD_PRG', null);
					
					var executor = new meta4.M4Executor();
					//execute request
					executor.execute(request, successMethod, failMethod);

				},
				example3 : function() {

					var i;
					var node = m4Object.getNode('EXJSAPI_TUTORIAL');
					
					if (node.count() === 0) {
						console.log('Charge method must be executed');
					}
					
					for ( i = 0; i < node.count(); i++) {
						m4Object.getNode('EXJSAPI_TUTORIAL').moveTo(i);
						
						var number = node.getValue('EX_NUMBER');

						console.log('Number: ' + number);

						//cadena
						var strg = node.getValue('EX_STRING');

						console.log('String: ' + strg);

					}
				},
				example4 : function() {
				    
                    var i;
                    var node = m4Object.getNode('EXJSAPI_TUTORIAL');
                    if (node.count() === 0) {
                        console.log('Charge method must be executed');
                        return 0;
                    }
                    
                    function onNodeCurrentChanged(context) {
                        console.log('Register is in position: ' + context.getNode().getCurrent());
                        //console.log('Register is in position: ' + context.getNode().getValue('EX_STRING'));
                    }
                    
                    node.register(meta4.M4EventTypes.getNodeCurrentChanged(), onNodeCurrentChanged, null);
                    
                    for ( i = 0; i < m4Object.getNode('EXJSAPI_TUTORIAL').count(); i++) {
                        m4Object.getNode('EXJSAPI_TUTORIAL').moveTo(i);
                    }
				},
				
				
				example5 : function() {

                    var m4ObjectFriend;
                    var ids = [];
                    ids.push("EXJSAPI_COMPONENT_FRIEND");
                    
                    function onMetadataFail(request) {
                        console.log('Error in Meta4Object load metadata');
                    }
                    
                    function onMetadataSuccess(request) {
                    	
                        //Function callback of success method
                    	function successCallFriend(request) {
                    		var nodeFriend = m4ObjectFriend.getNode('EXJSAPI_COMPONENT_FRIEND');
                    		var i;
                    		for ( i = 0; i < nodeFriend.count(); i++) {							
                    			nodeFriend.moveTo(i);
                    			var friendItemValue = nodeFriend.getValue('ITEM_CHANNEL_FRIEND');
                    			console.log("Item value from friend Meta4Object is: " + friendItemValue );
                    		}
                    	}
                    
                        //Function callback of fail method
                        function failMethod(request) {
                        }
                        
                    	//create m4Object friend
                    	m4ObjectFriend = new meta4.M4Object('EXJSAPI_COMPONENT_FRIEND');
                    
                    	//create request
                    	var request = new meta4.M4Request(m4Object, 'EXJSAPI_CHANNEL_FRIEND', 'CALL_FRIEND', null);
                    
                    	//add reference, same ALIAS in LN4¡¡¡¡
                    	request.addReference("EXJSAPI_COMPONENT_FRIEND", m4ObjectFriend);
                    
                    	var executor = new meta4.M4Executor();
                    	//execute request
                    	executor.execute(request, successCallFriend, failMethod);
                    }
                    
                    var executor = new meta4.M4Executor();
                    executor.loadMetadata(ids, onMetadataSuccess, onMetadataFail);		

				},
				example6 : function() {

                    var firstM4Object = null;
                    
					function onFirstSuccess(request) {

						function onSecondSuccess(request) {

							function onThirdSuccess(request) {
								var node = request.getObject().getNode('EXJSAPI_SYNC');
								var value = node.getValue('ITEM_SYNC');
								console.log("third Meta4Object " + value);
							}

							var node = request.getObject().getNode('EXJSAPI_SYNC');
							var value = node.getValue('ITEM_SYNC');
							console.log("second Meta4Object " + value);

							var thirdm4Object = new meta4.M4Object('EXJSAPI_COMPONENT', 'EXJSAPI_COMPONENT', true);
							var node = thirdm4Object.getNode('EXJSAPI_SYNC');
							//node.setValue('ITEM_SYNC', 'third set value');

							var request = new meta4.M4Request(thirdm4Object, 'EXJSAPI_SYNC', 'SYNC', null);	
							
							var executor = new meta4.M4Executor();
							//execute request
							executor.execute(request, onThirdSuccess, null);

						}

						var node = request.getObject().getNode('EXJSAPI_SYNC');;
						var value = node.getValue('ITEM_SYNC');
						console.log("first Meta4Object: " + value);

						var secondm4Object = new meta4.M4Object('EXJSAPI_COMPONENT', 'EXJSAPI_COMPONENT', false);
						
						var node = secondm4Object.getNode('EXJSAPI_SYNC');
                        
                        //This is an error
                        //node.setValue('ITEM_SYNC', 'second set value');
                        //var value = node.getValue('ITEM_SYNC');
                        
						var request = new meta4.M4Request(secondm4Object, 'EXJSAPI_SYNC', 'SYNC', null);
						
						var executor = new meta4.M4Executor();
						//execute request
						executor.execute(request, onSecondSuccess, null);
					}

					//create m4Object with alias EXJSAPI_COMPONENT
					firstM4Object = new meta4.M4Object('EXJSAPI_COMPONENT', 'EXJSAPI_COMPONENT', true);
					var node = firstM4Object.getNode('EXJSAPI_SYNC');
					var value = node.getValue('ITEM_SYNC');
					//Default Value
					console.log("first Meta4Object: " + value);

					node.setValue('ITEM_SYNC', 'first set value');
					var request = new meta4.M4Request(firstM4Object, 'EXJSAPI_SYNC', 'SYNC', null);
					
					var executor = new meta4.M4Executor();
					//execute request
					executor.execute(request, onFirstSuccess, null);
				}
			};

			function exampleExecutor(action) {
				if (m4Object != null) {
					action();
				} else {
					console.log('Metadata Meta4Object must be firstly loaded');
				}
			}

			function initTranslation() {

			}
						
			//event to inicialice program
			document.addEvent('meta4Ready', initTranslation);
