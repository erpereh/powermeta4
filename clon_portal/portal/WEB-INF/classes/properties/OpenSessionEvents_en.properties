INVALID_LOGIN_PARAMS=Server, user, password or language is missing.
OPEN_SESSION_ERROR=Error opening session.
STATE_ERR_BASE=Connection error: invalid or unreachable host or invalid port number. If this error persists, contact your administrator.
STATE_ERR_CREDENTIAL=Cannot access the application with this username and/or password. Make sure the Caps Lock key is not on. If this error persists, contact your administrator.
STATE_ERR_LOCKED=Cannot access the application with this username and/or password. Make sure the Caps Lock key is not on. If this error persists, contact your administrator.
STATE_WAR_EXPIRED=Expired password.
STATE_ERR_EXPIRED_CANNOT_CHANGE=Expired password. Contact your administrator.
STATE_WAR_DAYS_TO_EXPIRE=Password is about to expire.
STATE_WAR_ROLE=User has no default application role, or the default role is incorrect.
STATE_ERR_RSM=User has no default RSM, or the default RSM is incorrect.
STATE_ERR_NOROLES=The user has no valid application roles assigned or they are out of date.
STATE_ERR_KRB_TCK_UNEXPECTED=Authentication method unavailable. Access the login page and enter the username and password.
STATE_ERR_KRB_AUTHENTICATION=Error during authentication. If the error persists, contact the administrator.
STATE_ERR_IP_NOT_AUTHORIZED=The connection to the application from the following IP address is not authorized:
STATE_ERR_LOCKED_BY_INACTIVITY=The user account has been deactivated after exceeding the maximum period of inactivity.
STATE_ERR_APPLICATION_AVAIL=This application is not available to this user. Contact your administrator.
STATE_ERR_CONCURRENT_SESSION_EXCESS=The user is already connected to the application and is not authorized to access more times.
STATE_ERR_ACTIVATION_CONSENT=The user is not authorized to access the application. The account must be activated from the e-mail received, which includes the conditions of use.
UNKNOWN=Unknown error.
USER_BLANK=The user name is blank. Please enter your user name.
PASSWORD_BLANK=The password is blank. Please enter your password.
USER_PASSWORD_BLANK=The user name and password are blank. Please enter your user name and password.
