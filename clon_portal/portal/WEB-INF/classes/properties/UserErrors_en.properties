#-------------------------------------------------------------
rolenotallowed=The role [%1] is not allowed
noidtaskprovided=The task identifier provided is wrong
noidtaskfound=There are no tasks with identifier [%1]. If this error persists, please contact your administrator.
noroltoexec=You have no access to task [%1] with the current roles you have.
workingsm=You are working in SM, and you need to login again to execute this task
loginerror=Error logging in with credential [%1]
urlerror=Error loading the page. You must use the servlet CheckSecurity together with the task identifier.
sessionerror=Error creating user sessions. The maximum number of sessions has been reached or an error in session parameters has occurred.
logerror=Error creating the session.
fileuploaderror=Error loading file(s). The file(s) exceeded the maximum size allowed, or there was an error while parsing the request.

BAD_PARAMETERS = The parameters set are incorrect
NOT_PARAMETERS = There are undefined parameters.
NOT_PARENT = The parent node doesn't exist.
ERROR_SET_ROLE = The user lacks authorization to perform this action. Please contact your administrator.
