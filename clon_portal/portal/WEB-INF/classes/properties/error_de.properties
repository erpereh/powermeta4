#-------------------------------------------------------------
# blob upload servlet (no HTML)
#-------------------------------------------------------------
UPLOAD_BLOB_COULD_NOT_UPLOAD = The file could not be uploaded to the Web server. Please contact your administrator.
UPLOAD_BLOB_FORBIDDEN_EXT = The file extension is not permitted.
UPLOAD_BLOB_MISSING_FILE = The file that you attempted to send to the Web server is empty or could not be retrieved.
UPLOAD_BLOB_NOT_MULTIPART = The request type is invalid (multipart/form-data) or the content header (Content-Type) is null
UPLOAD_BLOB_SIZE_EXCEEDED = The file exceeds the size allowed.
