#-------------------------------------------------------------
# login servlet.
#-------------------------------------------------------------
LOGIN_INITIALIZATION_ERROR = Fehler der Meta4WebServices. Beim Initialisieren des Servlets f&uuml;r den Sitzungsstart ist ein Fehler aufgetreten. Wenden Sie sich an Ihren Administrator.
LOGIN_CONFIGURATION_ERROR = Fehler der Meta4WebServices. Bei der Konfiguration der Meta4WebServices ist ein Fehler aufgetreten. Wenden Sie sich an Ihren Administrator.
LOGIN_CREATING_M4SESSION = Fehler der Meta4WebServices. Beim Erstellen der Benutzersitzung ist ein Fehler aufgetreten. Wenden Sie sich an Ihren Administrator.
LOGIN_M4APPSERVER_LOGIN = Fehler der Meta4WebServices. Es kann keine Verbindung zum Anwendungsserver hergestellt werden. Wenden Sie sich an Ihren Administrator.
LOGIN_NO_AVAILABLE_APPLICATION_SERVERS = Fehler der Meta4WebServices. Es ist kein Anwendungsserver vorhanden. Wenden Sie sich an Ihren Administrator.
LOGIN_TWO_ACTIVE_SESSIONS= Fehler der Meta4WebServices. F&uuml;r diesen Browser ist noch eine Sitzung aktiv. Schlie&szlig;en Sie alle Browserfenster und versuchen Sie erneut, die Verbindung herzustellen.
LOGIN_INVALID_CREDENTIALS= Fehler der Meta4WebServices. Benutzernamen oder Kennwort sind ung&uuml;ltig. Wenn der Fehler fortbesteht, wenden Sie sich an Ihren Administrator.
LOGIN_CREATING_M4OPERATIONS = Fehler der Meta4WebServices. Beim Erstellen von Sitzungsobjekten ist ein Fehler aufgetreten. Wenden Sie sich an Ihren Administrator.
LOGIN_LOADING_USER_ROLES = Fehler der Meta4WebServices. Beim Laden der Liste der Benutzerrollen ist ein Fehler aufgetreten. Wenden Sie sich an Ihren Administrator.
LOGIN_NO_DEFAULT_ROLE = Fehler der Meta4WebServices. Dem Benutzer ist keine standardm&auml;&szlig;ige Anwendungsbesch&auml;ftigung zugeordnet oder die Standardbesch&auml;ftigung ist ung&uuml;ltig. Wenden Sie sich an Ihren Administrator.
LOGIN_CHANGE_SESSION_PAR = Fehler der Meta4WebServices. Beim &Auml;ndern der Besch&auml;ftigung oder der Gesellschaft ist ein Fehler aufgetreten. Wenn der Fehler fortbesteht, wenden Sie sich an Ihren Administrator.
LOGIN_CHANGE_SESSION_ROLE_ORGANIZATION = Fehler der Meta4WebServices. Besch&auml;ftigung oder Gesellschaft sind ung&uuml;ltig. Wenn der Fehler fortbesteht, wenden Sie sich an Ihren Administrator.
LOGIN_CHANGE_SESSION_ROLE = Fehler der Meta4WebServices. Besch&auml;ftg. ist ung&uuml;ltig Wenn der Fehler fortbesteht, wenden Sie sich an Ihren Administrator.
LOGIN_SESSION_ORGANIZATION_ANY_ROLE = Fehler der Meta4WebServices. Es sind keine Besch&auml;ftigungen f&uuml;r die Organisation vorhanden, oder die Organisation ist ung&uuml;ltig. Wenn der Fehler fortbesteht, wenden Sie sich an Ihren Administrator.
LOGIN_SESSION_ORGANIZATION_TWO_ROLE = Fehler der Meta4WebServices. F&uuml;r diese Gesellschaft sind zwei oder mehr Besch&auml;ftigungen vorhanden. Wenn der Fehler fortbesteht, wenden Sie sich an Ihren Administrator.
LOGIN_GENERAL_ERROR_NOREDIRECT = Diese Men&#252;option ist nicht verf&#252;gbar. Diese Men&#252;option ist derzeit nicht verf&#252;gbar. Versuchen Sie es sp&#228;ter erneut.	

