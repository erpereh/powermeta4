SAFEPAGEPROVIDER_ERR_CHANGING_SESSION_PAR= Fehler der Meta4WebServices. Beim &Auml;ndern der Besch&auml;ftigung oder der Gesellschaft ist ein Fehler aufgetreten. Wenn der Fehler fortbesteht, wenden Sie sich an Ihren Administrator.
SAFEPAGEPROVIDER_ERR_NO_DEFAULT_ROLE=Fehler der Meta4WebServices. Dem Benutzer ist keine standardm&auml;&szlig;ige Anwendungsbesch&auml;ftigung zugeordnet oder die Standardbesch&auml;ftigung ist ung&uuml;ltig. Wenden Sie sich an Ihren Administrator.
SAFEPAGEPROVIDER_ERR_CHANGING_SESSION_ROLE_ORGANIZATION=Fehler der Meta4WebServices.  Besch&auml;ftigung oder Gesellschaft sind ung&uuml;ltig. Wenn der Fehler fortbesteht, wenden Sie sich an Ihren Administrator.

