rolenotallowed=Die Besch&#228;ftigung [%1] ist nicht zul&#228;ssig.
noidtaskprovided=Es wurde nicht die korrekte ID der Aufgabe eingegeben.
noidtaskfound=Es existiert keine Aufgabe mit der ID [%1].
noroltoexec=Mit den Besch&#228;ftigungen, die er hat, kann der Benutzer die Aufgabe mit der ID [%1] nicht ausf&#252;hren.
workingsm=Befindet sich in SM. Um die Aufgabe auszuf&#252;hren, m&#252;ssen Sie die Sitzung in dieser Anwendung neu starten.
loginerror=Beim Starten der Sitzung mit den Anmeldeinformationen [%1] ist ein Fehler aufgetreten.
urlerror=Beim Laden der Seite ist ein Fehler aufgetreten. Sie m&#252;ssen das Servlet CheckSecurity und die ID der zugeordneten Aufgabe benutzen.
sessionerror=Fehler beim Erstellen der Sitzung: die H&#246;chstanzahl der Sitzungen wurde &#252;berschritten oder die Sitzungsparameter weisen einen Fehler auf.
logerror=Fehler beim Starten der Sitzung.
fileuploaderror=Beim Hochladen der Datei(en) ist ein Fehler aufgetreten. Die zul&#228;ssige Gr&#246;&#223;e wurde &#252;berschritten oder beim Verarbeiten der Anfrage ist ein Fehler aufgetreten.

BAD_PARAMETERS = Die eingegebenen Parameter sind ung&#252;ltig.
NOT_PARAMETERS= Sie haben die Parameter des Taglet nicht festgelegt. 
NOT_PARENT= Es existiert kein &#252;bergeordnetes Taglet-Element
ERROR_SET_ROLE= Der Benutzer hat keine Berechtigung, um diese Operation durchzuf&#252;hren. 
