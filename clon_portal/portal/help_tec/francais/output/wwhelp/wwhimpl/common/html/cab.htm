<script type="text/javascript">
  function callHelpTec(){  	 
     var sParentURL = window.parent.contenthelp.m4URLFrameswithLocale;
	 var sHelpURL = "";
	 if (typeof(sParentURL) != "undefined"){
	    var sHelpFolder = "/help/"; 
		var sHelpTecFolder = "/help_tec/";
	    var iHelpIndex = sParentURL.indexOf(sHelpFolder)
		if(iHelpIndex >0){ 		 
	  	   sHelpURL =  sParentURL.substr(0,iHelpIndex) + sHelpTecFolder + sParentURL.substring(iHelpIndex + sHelpFolder.length,sParentURL.length)
		}else{
		   iHelpIndex = sParentURL.indexOf(sHelpTecFolder)
  	 	   sHelpURL =  sParentURL.substr(0,iHelpIndex) + sHelpFolder + sParentURL.substring(iHelpIndex + sHelpTecFolder.length,sParentURL.length)
		}		 
		if (sHelpURL!=""){
     	   window.open(sHelpURL,'helpPress','width=765,height=500,resizable=no,toolbar=no,scrollbars=yes,copyhistory=no,directories=no,status=yes');
		}   
	}
  }
</script>
