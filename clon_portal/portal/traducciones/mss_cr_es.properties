msscr.Info1-12= Marca las casillas de selecci&oacute;n de las unidades organizativas con las que desee trabajar. Si cambia el tipo de Responsabilidad, puede cambiar la selecci&oacute;n, y por tanto, la poblaci&oacute;n de trabajo.</br>Para ver la lista de empleados asociados a alguna de las Unidades organizativas, por favor, pulsa sobre su identificador.</br>Para ver los detalles de la unidad organizativa, haz clic sobre su nombre. Esta &uacute;ltima operaci&oacute;n le permitir&aacute; ver los responsables de la unidad organizativa, as&iacute; como los empleados que trabajan en ella.</br>Tambi&eacute;n puede seleccionar o deshacer la selecci&oacute;n de una unidad organizativa y de todas sus hijas.<br>

