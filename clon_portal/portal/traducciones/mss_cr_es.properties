msscr.Info1= Este m&oacute;dulo te permite realizar las revisiones salariales de los empleados de cuyo salario eres responsable. Puedes ver todos los planes de compensaci&oacute;n de cada uno de tus empleados y seleccionar los que quieres revisar. Del mismo modo, puedes informarte sobre el estado de los aumentos salariales que has recomendado y que el departamento de RRHH procesa por petici&oacute;n tuya.

msscr.Titulo2= Revisa el salario de tus empleados

msscr.Info2= En esta secci&oacute;n puedes seleccionar los empleados y los planes de compensaci&oacute;n que deseas revisar y despu&eacute;s enviar al departamento de RRHH tus recomendaciones de aumentos salariales.

msscr.Link1= Revisi&oacute;n salarial de los empleados

msscr.Pop1= Revisi&oacute;n salarial de los empleados

msscr.Titulo3= Estado de tus recomendaciones de aumento salarial

msscr.Info3= En esta secci&oacute;n puedes comprobar si el departamento de RRHH ha validado tus recomendaciones de aumento salarial. Aqu&iacute; se detallan todos los empleados cuyos planes de compensaci&oacute;n has revisado y las recomendaciones hechas.

msscr.Info3_bis = Analiza los empleados que han sido revisados por ti o por alguno de tus responsables delegados de revisi&oacute;n. Puedes consultar la informaci&oacute;n totalizada por Planes de Compensaci&oacute;n y agrupada por cada una de la Unidades Organizativas que est&aacute;n bajo tu responsabilidad

msscr.Link2= Estado de tus recomendaciones de aumento salarial

msscr.Pop2= Estado de tus recomendaciones de aumento salarial

msscr.Titulo4= Analiza tus revisiones salariales

msscr.Titulo5= En este m&oacute;dulo puedes revisar la remuneraci&oacute;n de tus empleados. Para ello, selecciona tanto a los empleados que deseas revisar como los planes de remuneraci&oacute;n correpondientes. Asimismo, puedes consultar las directrices tomadas por el departamento de RRHH con respecto a tus &uacute;ltimas recomendaciones de aumentos salariales.

msscr.Info4= En esta secci&oacute;n, puedes analizar los resultados de tus  revisiones salariales. En este informe se presentan todos los empleados que han sido revisados por ti o por alguno de tus responsables delegados de revisi&oacute;n. Puedes consultar la informaci&oacute;n totalizada por Planes de Compensaci&oacute;n y agrupada por cada una de la Unidades Organizativas que est&aacute;n bajo tu responsabilidad.

