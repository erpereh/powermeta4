msscr.Aviso-11= El valor real anterior de este plan no est&aacute; disponible, de modo que no se le puede aplicar una cantidad o un porcentaje de aumento. En este caso, cualquier aumento que se consigne se considerar&aacute; como el valor total. S&oacute;lo si se dispone del salario base actual y del valor anterior real del plan, se pueden mostrar en pantalla los porcentajes asociados. En caso contrario, no se ver&aacute;n esos datos.

msscr.Aviso2-11= Todos los planes de compensaci&oacute;n seleccionados para su revisi&oacute;n en este momento tendr&aacute;n el mismo periodo de validez. Ten esto presente a la hora de seleccionar el periodo de validez para la revisi&oacute;n. Por defecto, dicho periodo se ajusta a un a&ntilde;o natural partiendo del d&iacute;a de hoy, pero puedes modificarlo a tu voluntad.

