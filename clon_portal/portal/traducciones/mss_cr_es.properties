msscr.help1-3= Ayuda

msscr.Titulo2-3= Explicaci&oacute;n general:

msscr.Info1-3= Haz clic sobre el icono Individual o Masiva de la unidad organizativa con la que quieres trabajar.<br>Para ver los detalles de la unidad organizativa, haz clic sobre su nombre. Adem&aacute;s, esta &uacute;ltima opci&oacute;n te permite delegar la responsabilidad de revisar los salarios de la unidad organizativa seleccionada.

msscr.Info2-3= En esta ventana puedes ver la lista de empleados que pertenecen a la unidad organizativa seleccionada y cuyo identificador aparece resaltado. Puedes seleccionar todos los empleados a los que quieras revisar el salario (siempre y cuando est&eacute;n disponibles).

msscr.Info3-3= En esta ventana puedes ver la lista de planes de compensaci&oacute;n que tiene cada uno de los empleados seleccionados. Las ventanas que constituyen el proceso de revisi&oacute;n salarial se suceden tantas veces como empleados hayas seleccionado para revisar, pero cada vez se muestra &uacute;nicamente la inf&oacute;rmaci&oacute;n del empleado correspondiente. Puedes seleccionar los planes de compensaci&oacute;n que quieres revisar de cada empleado.

msscr.Info4-3= En esta ventana puedes hacer la revisi&oacute;n salarial de todos los planes del empleado seleccionados en el paso anterior. La ventana consta de una serie de bloques de datos. El primer bloque contiene los datos necesarios para efectuar la revisi&oacute;n del salario BASE del empleado. Si en el paso anterior seleccionaste uno o varios planes de compensaci&oacute;n de tipo variable, a continuaci&oacute;n aparecer&aacute; un bloque funcional con los datos necesarios para efectuar la revisi&oacute;n de cada plan. Por &uacute;ltimo, el tercer bloque contiene toda la informaci&oacute;n de las decisiones que has ido tomando en esta ventana.

msscr.Tabla1-3= Elemento

msscr.Tabla2-3= Descripci&oacute;n del elemento

msscr.Tabla3-3= Tipo de elemento

msscr.Tabla4-3= Descripci&oacute;n

msscr.ID1-3= ID Unidad organizativa

msscr.ID2-3= Enlace

msscr.ID2-4= Mensaje Informativo

msscr.Info5-3= En esta columna aparecen todas las unidades organizativas de las cuales es responsable de revisar salarios. Por favor, es necesario notar que las unidades organizativas guardan una relaci&oacute;n jer&aacute;rquica entre ellas, relaci&oacute;n que se representa de manara figurada, en forma de &aacute;rbol. Se mostraran todas aquellas unidades organizativas para las cuales es responsable directo de revisi&oacute;n de salarios, as&iacute; como aquellas unidades organizativas dependientes de estas en la jerarqu&iacute;a, que no tengan asociado ning&uacute;n responsable de revisi&oacute;n de salarios de manera directa. De la misma manera, y solo si se diera el caso, en esta lista de unidades organizativas, tambi&eacute;n aparecer&iacute;an aquellas para las cuales se hubiera delegado en ti la responsabilidad de revisar (consulta el elemento <b>Tipo de responsable</b> para m&aacute;s informaci&oacute;n).<br>Al hacer clic sobre la unidad organizativa concreta, se abre una ventana con la siguiente informaci&oacute;n b&aacute;sica: identificador, nombre, tipo y descripci&oacute;n de la unidad organizativa y la lista de todos los responsables, de cualquier tipo, que tenga asignados. De la lista de responsables, puedes seleccionar uno para delegar en &eacute;l la responsabilidad de revisar los salarios de los empleados de la unidad organizativa cuyos detalles se est&aacute;n visualizando. Esto es posible si eres el responsable directo de revisi&oacute;n salarial de dicha unidad organizativa. Si eres responsable delegado, no podr&aacute;s a tu vez, delegar la responsabilidad en otra persona. Una vez seleccionado el responsable en el que quieras delegar, haz clic en el bot&oacute;n Continuar para enviarle un correo electr&oacute;nico y avisarle de tus intenciones.

msscr.ID3-3= Nombre unidad organizativa

msscr.Info6-3= Al hacer clic sobre la unidad organizativa concreta, se abre una ventana con la siguiente informaci&oacute;n b&aacute;sica: identificador, nombre, tipo y descripci&oacute;n de la unidad organizativa y la lista de todos los responsables, de cualquier tipo, que tenga asignados. De la lista de responsables, puedes seleccionar uno para delegar en &eacute;l la responsabilidad de revisar los salarios de los empleados de la unidad organizativa cuyos detalles se est&aacute;n visualizando. Esto es posible si eres el responsable directo de revisi&oacute;n salarial de dicha unidad organizativa. Si eres responsable delegado, no podr&aacute;s a tu vez, delegar la responsabilidad en otra persona. Una vez seleccionado el responsable en el que quieras delegar, haz clic en el bot&oacute;n Continuar para enviarle un correo electr&oacute;nico y avisarle de tus intenciones.

msscr.ID4-3= Tipo de responsable

msscr.ID5-3= Lista de valores

msscr.Info7-3= Junto a cada una de las unidades organizativas de la lista est&aacute; indicado qu&eacute; tipo de responsable de revisi&oacute;n salarial eres para sus empleados. Los dos valores posibles para este campo son 'Responsable de revisi&oacute;n salarial' y 'Responsable delegado de revisi&oacute;n salarial'. En el primer caso, eres el responsable directo de la revisi&oacute;n salarial de los empleados que pertenecen a esa unidad organizativa y tienes la facultad, si as&iacute; lo deseas, de delegar dicha responsabilidad en cualquier otro responsable de la unidad organizativa (consulta el elemento

msscr.Info7-2-3=  para m&aacute;s detalles). Sin embargo, si eres responsable delegado de revisi&oacute;n salarial, no tendr&aacute;s esa facultad

msscr.ID6-3= Empleado

msscr.ID7-3= Lista de valores

msscr.Info8-3= Permite ver la lista de empleados que pertenecen a la unidad organizativa seleccionada. Cada valor de lista est&aacute; compuesto por el identificador y el nombre del empleado. Cada uno de estos valores, representa a su vez un link que permite visualizar el hist&oacute;rico de revisiones salariales del empleado. Una vez que se pulsa el link, se aparece una peque&ntilde;a pantalla en la que podemos ver todas las revisiones salariales que el empleado ha tenido, para cada uno de los planes de salario y que hayan sido aprobadas.

msscr.Info8-4 = Una vez seleccionada la Unidad Organizativa que se quiere revisar, el proceso de revisi&oacute;n permite visualizar todos los empleados que tienes que revisar. Sin embargo, es posible que alguno de ellos no puedan ser revisados por diferentes motivos. Si en el proceso de carga de empleados se detecta alguna incoherencia o falta de datos necesarios para el proceso de revisi&oacute;n salarial, aparecer&aacute; este s&iacute;mbolo de admiraci&oacute;n. Pulsando sobre &eacute;l, se puede ver cual es el motivo por el cual el empleado no puede ser visado. Alguna de las causas pueden ser:<br/>1.- Que el empleado no tenga un tipo de salario adecuado para poder ser revisado<br/>2.- Que el empleado no tenga moneda de proceso asociada<br/>3.- Que el empleado no tenga asignada ninguna estructura de salario<br/>4.- Que el empleado no tenga asociado ning&uacute;n plan se revisi&oacute;n base<br/>

msscr.Info8-2-3= junto al identificador del empleado. Al hacer clic sobre &eacute;l se abre una ventana informativa en la que se describen los errores producidos.

msscr.ID8-3= Rol

msscr.Info9-3= Este elemento muestra el nombre del rol que desempe&ntilde;a cada empleado dentro de la unidad organizativa seleccionada. En caso de no estar disponible dicho nombre, se indicar&aacute; con el valor 'No disponible'.

msscr.ID9-3= Puesto

msscr.Info10-3= Se muestra el identificador y el nombre del puesto que ocupa cada empleado dentro de la unidad organizativa. Si no est&aacute; disponible el nombre del puesto, aparece el mensaje 'No Disponible'.

msscr.ID10-3= Grado

msscr.Info11-3= Se muestra el identificador del grado/banda/zona de cada empleado dentro de su estructura salarial. La estructura salarial del empleado se determina en funci&oacute;n del pa&iacute;s de la entidad legal a la que pertenece y del grupo de puestos en el que se incluye su puesto. Dentro de esta estrucura salarial, se fija el grado/banda/zona correspondiente en funci&oacute;n del puesto que desempe&ntilde;a el empleado en la unidad organizativa seleccionada.

msscr.ID11-3= Fijo revisado

msscr.Info12-3= para cada empleado se muestra el valor y la moneda correspondiente a la &uacute;ltima revisi&oacute;n salarial

msscr.Info12-2-3= realizada. Si es la primera vez que se revisa el salario del empleado, este valor no estar&aacute; disponible. Adem&aacute;s, si la revisi&oacute;n est&aacute; pendiente de aprobaci&oacute;n por parte del departamento de RRHH, aparecer&aacute; el mensaje 'Pendiente de aprobaci&oacute;n'.

msscr.ID12-3= Revisar

msscr.ID13-3= Campo de selecci&oacute;n

msscr.Info13-3= Este campo permite seleccionar los empleados que se desea revisar. Aparece deshabilitado si existe alg&uacute;n error o faltan datos del empleado. Los errores que no pueden producirse, porque impiden la correcta ejecuci&oacute;n del proceso de revisi&oacute;n, son los siguientes:</br><b>1.-</b> Ausencia de moneda asociada al empleado. Para el proceso se utiliza la misma moneda en la que se calcula la n&oacute;mina del empleado. </br><b>2.-</b> Ausencia de estructura salarial del empleado</br><b>3.-</b> Ausencia de grado/banda/zona dentro de la estructura salarial del empleado</br><b>4.-</b> Ausencia de planes de compensaci&oacute;n asignados al empleado.</br>Cuando se produce alguno de estos errores, aparece el s&iacute;mbolo

msscr.Info13-2-3= junto al identificador del empleado (v&eacute;ase el elemento 'Empleado' para m&aacute;s detalles).

msscr.ID14-3= Bot&oacute;n de proceso

msscr.Info14-3= Al hacer clic en este bot&oacute;n se retrocede a la p&aacute;gina anterior, en la que aparec&iacute;a la lista de las unidades organizativas de cuya revisi&oacute;n salarial eres responsable (directo o delegado).

msscr.Info15-3= Al hacer clic en este bot&oacute;n comienza la sucesi&oacute;n de ventanas de las que consta el proceso de revisi&oacute;n salarial. Esta sucesi&oacute;n de ventanas se repetir&aacute; tantas veces como empleados hayas seleccionado para revisar. El bot&oacute;n no te dejar&aacute; continuar si no has selccionado ning&uacute;n empleado.

msscr.Info16-3= Al hacer clic sobre el grado/banda/zona del empleado, se abre a una ventana de informaci&oacute en la que se muestran los siguientes datos: identificador y nombre de la estructura salarial y del grado/banda/zona del empleado; salario m&aacute;ximo, m&iacute;nimo y punto medio del grado/banda/zona; compa-ratio y grado de penetraci&oacute;n del empleado dentro de su grado/banda/zona y los percentiles 25% y 75% de todos los empleados que pertenecen a la unidad organizativa seleccionada y que est&aacute;n dentro del mismo grado/banda/zona y en la misma estructura salarial que el empleado.

msscr.ID15-3= Salario base

msscr.Info17-3= Este campo indica cu&aacute;l es el salario base actual del empleado. Normalmente, coincide con el valor fijado en la &uacute;ltima revisi&oacute;n del salario base del empleado. No obstante, es posible que desde la &uacute;ltima revisi&oacute;n, se hayan producido modificaciones, por lo que se informa de cu&aacute;l es el valor que est&aacute; siendo utilizado actualmente como salario base para el c&aacute;lculo de la n&oacute;mina del empleado. A todos los efectos, este valor es el que se utiliza para las revisiones salariales, ya que es el valor real correspondiente al salario base del empleado.

msscr.ID16-3= Plan de compensaci&oacute;n

msscr.NOHTML_ID16-3= Plan de compensación

msscr.ID17-3= Enlace-Lista de valores

msscr.Info18-3= Este campo muestra todos los planes de compensaci&oacute;n que tiene asignados el empleado seleccionado. Cada valor est&aacute; compuesto por el identificador y el nombre del plan de compensaci&oacute;n. Al hacer clic sobre un plan de compensaci&oacute;n, se abre una ventana en la que puede ver los detalles del plan: identificador, nombre, tipo, descripci&oacute;n, moneda y periodicidad del plan, junto con la metodolog&iacute;a que se utiliza para proponer aumentos salariales. Adem&aacute;s, indica cu&aacute;l es la tabla concreta que contiene los valores propuestos para los aumentos salariales de los empleados con este plan y ofrece una descripci&oacute;n y valores concretos de dicha tabla. Por &uacute;ltimo, si el plan de compensaci&oacute;n no es de tipo BASE, se presentan propiedades adicionales para estos planes como son el rendimiento y la antig&uuml;edad m&iacute;nimos para poder participar en este plan, junto con el porcentaje m&aacute;ximo de aumento referente al salario base del empleado y si depende o no directamente del plan de compensaci&oacute;n de tipo BASE asociado.

msscr.ID18-3= Tipo

msscr.Info19-3= Este campo muestra el tipo de cada uno de los planes de compensaci&oacute;n del empleado seleccionado. Puede contener valores como 'Valor Base', 'Valor Variable', etc.

msscr.ID19-3= Cantidad última revisión

msscr.Info20-3= Este campo muestra el valor monetario actual de cada plan de compensaci&oacute;n del empleado seleccionado. El valor monetario va acompa&ntilde;ado de la moneda correspondiente. Todos los valores que se muestran en pantalla est&aacute;n convertidos a la moneda de c&aacute;lculo de n&oacute;mina del empleado, por lo que los valores siempre se muestran en una &uacute;nica moneda. Se presentan los siguientes casos especiales</br><b>1.- </b>Si no existe valor actual para un plan en concreto, aparecer&aacute; el mensaje 'No Disponible'</br><b>2.- </b>En caso de que el valor para el plan de compensaci&oacute;n est&eacute; siendo revisado, es decir, si se ha hecho una propuesta de aumento para este plan y &eacute;sta est&eacute; pendiente de aprobaci&aacute;n, aparecer&aacute; el mensaje 'En aprobaci&oacute;n'</br><b>3.-</b> En caso de que, aun habiendo sido asignado el plan de compensaci&oacute;n al empleado, exista alguna restricci&oacute;n por la cual no pueda ser revisado, aparecer&aacute; el mensaje 'Plan No Revisable'.

msscr.ID20-3= Fecha de revisi&oacute;n

msscr.Info21-3= Este campo muestra la fecha en la que se revis&oacute; cada plan de compensaci&oacute;n del empleado y se fij&oacute; el valor monetario que aparece en pantalla (siempre y cuando el plan tenga un valor actual).

msscr.ID21-3= Revisar

msscr.Info22-3= Si est&aacute; habilitado, este campo permite seleccionar el plan de compensaci&oacute;n del empleado que se va a revisar. Puedes seleccionar uno o varios planes. Para poder continuar el proceso de revisi&oacute;n salarial para este empleado, es necesario seleccionar, al menos, un plan de compensaci&oacute;n. Si escoges un plan de compensaci&oacute;n que depende del plan de compensaci&oacute;n de tipo BASE, &eacute;ste &uacute;ltimo se selecciona autom&aacute;ticamente debido a la obligatoriedad de revisar al mismo tiempo los planes de compensaci&oacute;n relacionados.Es decir, los planes de compensaci&oacute;n que sirven para revisar el salario base del empleado, pueden ser revisados en cualquier momento, de manera individual. Sin embargo, los planes de compensaci&oacute;n que sirven para revisar los variables del empleado, pueden tener los siguientes condicionantes<br/>1.- Que el un plan de compensaci&oacute;n para revisar un variable determinado, est&eacute; ligado al plan de compensaci&oacute;n para revisar el salario base  . Esto implica la necesidad de, cuando se desea revisar un plan de compensaci&oacute;n variable, se deba seleccionar el plan de compensaci&oacute;n base para revisarlos al mismo tiempo. <br/>2.- Que el plan de compensaci&oacute;n pra revisar un salario variable del empleado, no sea dependiente del base, por lo que podr&aacute; ser revisado sin ning&uacute;n tipo de restricci&oacute;n, en cualquier momento del empleado. <br/>. Como acabamos de ver, existe la posibilidad de encontrar planes de compensaci&oacute;n que se tiene que revisar al mismo tiempo. Sin embargo, esto tiene una salvedad. Esta salvedad se presenta cuando un plan de compensaci&oacute;n variable ha sido revisado junto al plan de compensaci&oacute;n base correspondiente y ambas revisiones, fueron enviadas al departamento de RRHH. Existe la posibilidad de que RRHH hubiera aceptado la revisi&oacute;n propuesta por ti para el base, pero denegada la revisi&oacute;n propuesta para el variable. En este caso, cuando vuelvas a esta pantalla, para el empleado en cuesti&oacute;n, es posible revisar el salario variable dependiente de manera individual, es decir, sin tener que revisar de nuevo el base asociado. Para ello simplemente ser&aacute; necesario que chequees para revisar el plan de compensaci&oacute;n variable. En ese momento te aparecer&aacute; un mensaje inform&aacute;ndote de la situaci&oacute;n y podr&aacute;s decidir qu&eacute; hacer. 

msscr.ID22-3= Evaluaci&oacute;n del rendimiento

msscr.ID23-3= Lista de valores posibles

msscr.Info23-3= Las metodolog&iacute;s de aumento que se utilizan para proponer aumentos salariales para un empleado dependen del rendimiento alcanzado por &eacute;ste. Por ese motivo, es necesario seleccionar un rendimiento del empleado, que utilizar&aacute; el sistema para proponer aumentos salariales en ventanas sucesivas. La evaluaci&oacute;n del rendimiento ser&aacute; necesario seleccionarla siempre y cuando alguno de los planes de compensaci&oacute;n marcados para revisar, hagan necesaria esta selecci&oacute;n. No obstante, en el momento de pulsar el bot&oacute;n para continuar el proceso, se te informar&aacute; que debes seleccionar una evaluaci&oacute;n del rendimiento, siempre y cuando sea necesario y no lo hayas hecho previamente.

msscr.Info24-3= Haciendo clic sobre este bot&oacute;n se retrocede a la ventana de selecci&oacute;n de empleados. Si se ejecuta este proceso, se perder&aacute;n todas las revisiones que no se hayan enviado hasta el momento al departamento de RRHH. A todos los efectos, al hacer clic en ese bot&oacute;n se inicia de nuevo el proceso de revisi&oacute;n salarial.

msscr.Info25-3= Este bot&oacute;n permite continuar con el proceso de revisi&oacute;n para el empleado que est&aacute; en pantalla. No se podr&aacute; continuar con dicho proceso si no se ha seleccionado, al menos, un plan de compensaci&oacute;n de la lista de planes de compensaci&oacute;n del empleado.

msscr.Info26-3= Este bot&oacute;n permite saltar el empleado que se est&aacute; revisando y eliminarlo del proceso de revisi&oacute;n. En caso de que existan empleados pendientes de revisar que fueron seleccionados en pasos previos, el proceso presentar&aacute; en pantalla los datos del siguiente empleado que se debe revisar. Si no existen m&aacute;s empleados pendientes de revisar, pero hay revisiones anteriores que no han sido enviadas al departamento de RRHH, el proceso abre la ventana desde la que se env&iacute;an las recomendaciones de aumentos salariales a RRHH. Si no quedan empleados por revisar y tampoco revisiones pendientes de enviar, el proceso dar&aacute; acceso directo de nuevo a la ventana que contiene la lista de empleados de la unidad organizativa seleccionada al comienzo de la revisi&oacute;n.

msscr.Info27-3= Este bot&oacute; es similar al anterior excepto en que no salta al siguiente empleado que hay que revisar en caso de que exista, sino que salta todos los empleados que quedan pendientes de revisar y accede a la ventana que permite enviar recomendaciones de aumento al departamento de RRHH.

msscr.ID24-3= Revisi&oacute;n del salario base

msscr.ID25-3= Bloque de datos

msscr.Info28-3= Este bloque contiene toda la informaci&oacute;n necesaria para realizar la revisi&oacute;n del salario base para el empleado que aparece en pantalla. A continuaci&oacute;n se detallan todos los campos incluidos en este bloque de datos.

msscr.ID26-3= &Uacute;ltima revisi&oacute;n (Cantidad)

msscr.ID27-3= Campo informativo

msscr.Info29-3= Este campo indica el valor fijado en la &uacute;ltima revisi&oacute;n del salario base del empleado. Si el valor no est&aacute; disponible porque no existe una revisi&oacute;n previa, en el campo aparecer&aacute; un cero (0).

msscr.ID28-3= &Uacute;ltima revisi&oacute;n (% aumento)

msscr.ID29-3= Campo informativo

msscr.Info30-3= Este campo indica el porcentaje de aumento de la &uacute;ltima revisi&oacute;n del salario base del empleado. En caso de no estar disponible este valor por no existir una revisi&oacute;n previa, en el campo aparecer&aacute; un cero (0).

msscr.ID30-3= &Uacute;ltima revisi&oacute;n (Posici&oacute;n)

msscr.Info31-3= Este campo indica cu&aacute;l es la posici&oacute;n dentro del grado/banda/zona salarial, de acuerdo con el valor fijado como salario base en la &uacute;ltima revisi&oacute;n del empleado. La posici&oacute;n dentro del rango refleja el grado de penetraci&oacute; del salario base del empleado dentro del grado/banda/zona salarial de su estructura salarial. Para el c&aacute;lculo de esta posici&oacute;n, se considera el salario m&iacute;nimo del grado/banda/zona como el 0% de penetraci&oacute;n y el salario  m&aacute;ximo del grado/banda/zona como el 100% de penetraci&oacute;n. Los salarios por debajo del salario m&iacute;nimo dar&aacute;n como resultado un porcentaje de penetraci&oacute;n negativo y los salarios superiores al salario m&aacute;ximo dar&aacute;n como resultado un porcentaje de penetraci&oacute;n mayor del 100%.

msscr.ID31-3= &Uacute;ltima revisi&oacute;n (Compa-ratio)

msscr.Info32-3= A diferencia del grado de penetraci&oacute;n del salario del empleado dentro de su grado/banda/zona o posici&oacute;n explicado anteriormente, la compa-ratio indica la ratio de penetraci&oacute;n del salario teniendo en cuenta que el punto medio del grado/banda/zona corresponde a una ratio del 100%. Por lo tanto, los salarios por debajo del punto medio dar&aacute;n como resultado una compa-ratio por debajo del 100%, y superior al 100% en caso contrario.

msscr.ID32-3= Aumento propuesto (Cantidad)

msscr.Info33-3= Este campo es an&aacute;logo al campo &Uacute;ltima resi&oacute;n explicado anteriormente, con la diferencia de que para la presentaci&oacute;n de valores en pantalla tiene en cuenta el salario base del empleado y los porcentajes de aumento que resultan de aplicar el grado de rendimiento del empleado a la metodolog&iacute; de aumento utilizada por el plan de compensaci&oacute;n.

msscr.ID33-3= Aumento propuesto (% aumento)

msscr.Info34-3= An&aacute;logo al campo &Uacute;ltima resi&oacute;n explicado anteriormente, con la diferencia de que para la presentaci&oacute;n de valores en pantalla tiene en cuenta el salario base del empleado y los porcentajes de aumento que resultan de aplicar el grado de rendimiento del empleado a la metodolog&iacute; de aumento utilizada por el plan de compensaci&oacute;n.

msscr.ID34-3= Aumento propuesto (Posici&oacute;n)

msscr.ID35-3= Aumento recomendado (Cantidad)

msscr.ID36-3= Campo editable

msscr.Info35-3= An&aacute;logo al campo Aumento propuesto explicado anteriormente, con la diferencia de que para la presentaci&oacute;n de valores en pantalla tiene en cuenta el aumento sobre el salario base actual que decide el responsable bas&aacute;ndose en los campos anteriores correspondientes a la propuesta que hace el propio sistema. <u><b>Es importante destacar que, si no est&aacute; disponible el salario base actual del empleado, el valor que se consigne en este campo no se considerar&aacute; como un aumento sobre el salario base, sino como el nuevo salario base total recomendado por el responsable.</b></u>

msscr.ID37-3= Aumento recomendado (% aumento)

msscr.Info36-3= An&aacute;logo al campo Aumento propuesto explicado anteriormente, con la diferencia de que para la presentaci&oacute;n de valores en pantalla tiene en cuenta el aumento sobre el salario salario base actual que decide el responsable bas&aacute;ndose en los campos anteriores correspondientes a la propuesta que hace el propio sistema. Si no est&aacute; disponible el salario base actual del empleado, este campo no se podr&aacute; modificar, ya que no es posible consignar porcentajes de aumento sobre un valor que no existe.

msscr.ID38-3= Aumento recomendado (Posici&oacute;n)

msscr.Info37-3= An&aacute;logo al campo Aumento propuesto explicado anteriormente, con la diferencia de que para la presentaci&oacute;n de valores en pantalla tiene en cuenta el nuevo salario base, resultado de aplicar al salario base actual el aumento recomendado por el responsable.

msscr.ID39-3= Aumento recomendado (Compa-ratio)

msscr.ID40-3= Salario base total (Cantidad)

msscr.Info38-3= Teniendo en cuenta las recomendaciones hechas por el responsable, este campo muestra el valor total correspondiente al nuevo salario base del empleado.

msscr.ID41-3= Planes de compensaci&oacute;n variables

msscr.ID42-3= Aumento actual

msscr.ID43-3= Variable propuesto (Cantidad total)

msscr.ID44-3= Variable propuesto (% Fijo)

msscr.ID45-3= Variable propuesto (Cantidad de aumento)

msscr.ID46-3= Variable propuesto (% aumento)

msscr.ID47-3= Variable recomendado (Cantidad total)

msscr.ID48-3=  Variable recomendado (% Fijo)

msscr.ID49-3=  Variable recomendado (Cantidad de aumento)

msscr.ID50-3=  Variable recomendado (% aumento)

msscr.ID51-3=  Totales

msscr.ID52-3=  Aumento total recomendado

msscr.ID53-3=  Cantidad por encima/por debajo

msscr.ID54-3=  Porcentaje de cambio

msscr.ID55-3=  Proceso de evaluaci&oacute;n

msscr.Info39-3= Este bloque contiene toda la informaci&oacute;n necesaria para revisar los planes de compensaci&oacute;n variables seleccionados para el empleado. Por cada uno de estos planes de compensaci&oacute;n, existe un bloque de datos diferente. Cada plan se identifica inicialmente por su nombre, su cantidad actual y el porcentaje de aumento que supuso dicha cantidad en la &uacute;ltima revisi&oacute;n. Estos dos &uacute;ltimos valores aparecer&aacute;n en pantalla siempre que est&eacute;n disponibles, ya que es posible que no exista una revisi&oacute;n anterior para este empleado en dicho plan. En ese caso, se habilitar&aacute; un comentario informativo que se podr&aacute; consultar. A continuaci&oacute;n se detallan todos los campos de este bloque de datos.

msscr.Info40-3= Esta cantidad viene expresada en la moneda del empleado. Representa la cantidad monetaria que es propuesta como aumento salarial para el empleado objeto de estudio, dentro del Plan de compensaci&oacute;n correspondiente. Esta cantidad se calcula al aplicar los porcentajes de aumento recomendados por la metodolog&iacute;a asociada al Plan de compensaci&oacute;n al salario base actual del empleado.

msscr.Info41-3= La cantidad correspondiente a este plan de compensaci&oacute;n, representa un cierto porcentaje del salario fijo del empleado. En esta columna podemos ver qu&eacute; porcentaje del salario del empleado representa el salario para el plan de compensaci&oacute;n objeto de estudio.

msscr.Info42-3= Esta campo almacena una cantidad monetaria, expresada en la moneda del empleado. En este campo se puede visualizar la cantidad de aumento para este plan de compensaci&oacute;n con respecto a la &uacute;ltima revisi&oacute;n que se hizo del mismo para el empleado que est&aacute; siendo revisado.

msscr.Info43-3= Este campo almacena el porcentaje de aumento con respecto a la revisi&oacute;n anterior que se hizo para el empleado en el plan de compensaci&oacute;n objeto de estudio.

msscr.Info44-3= Este es un campo editable o bien calculado dependiendo de las acciones del manager. En &eacute; se se debe introducir una cantidad monetaria expresada en la moneda del empleado, que se especifica junto al mismo. El manager puede introducir en este campo el valor correspondiente al nuevo salario para este plan de compensaci&oacute;n, para el empleado que est&aacute; siendo revisado. La cantidad introducida en este campo se entiende como salario total (salario correspondiente al plan de compensaci&oacute;n objeto de estudio).

msscr.Info45-3= Este es un campo editable o bien calculado dependiendo de las acciones del manager. El manager puede asignar de manera directa un porcentaje del salario base para fijar, de esta manera, el nuevo salario para el plan de compensaci&oacute;n objeto de estudio. Si el manager introduce un porcentaje en esta columna, el resto de campos de esta fila es autom&aacute;ticamente recalculado teniendo para ello en cuenta, el porcentaje que el manager acaba de introducir.

msscr.Info46-3= Este es un campo editable o bien calculado dependiendo de las acciones del manager. El manager puede asignar de manera directa una cantidad de aumento, expresada en la moneda del empleado que aparece junto al mismo. Esta cantidad de aumento es respecto al salario actual correspondiente al plan de compensaci&oacute;n objeto de estudio. Si el manager introduce una cantidad monetaria en esta columna, el resto de campos de esta fila es autom&aacute;ticamente recalculado teniendo para ello en cuenta, la cantidad que el manager acaba de introducir.

msscr.Info47-3= Este es un campo editable o bien calculado dependiendo de las acciones del manager. El manager puede asignar de manera directa un porcentaje de aumento sobre la &uacute;ltima revisi&oacute;n o valor actual para este plan salaria, para fijar, de esta manera, el nuevo salario para el plan de compensaci&oacute;n objeto de estudio. Si el manager introduce un porcentaje en esta columna, el resto de campos de esta fila es autom&aacute;ticamente recalculado teniendo para ello en cuenta, el porcentaje que el manager acaba de introducir. <b>Nota importante:</b> Aquellos planes de compensaci&oacute;n que se est&eacute;n revisando, cuyas metodolog&iacute;as de aumento se rijan por reglas que tienen en consideraci&oacute;n la evaluaci&oacute;n del desempe&ntilde;o, no tomar&aacute;n en cuenta este dato a la hora de proponer un aumento de salario.

msscr.Info48-3= En esta secci&oacute;n se especifican y calculan una serie de datos monetario y porcentajes totales, que son resultado de las acciones que el manager a tomado al revisar el plan de compensaci&oacute;n al empleado, juntando total la informaci&oacute;n aportada por cada uno de los planes de compensaci&oacute;n para los que el empleado ha sido revisado. Veamos cuales son los campos que contiene este bloque.

msscr.Info49-3= Esta columna contiene el sumatorio de todas las cantidades monetarias de aumento propuestas por el manager. Cada uno de los planes de compensaci&oacute;n, en alguna de las casillas explicadas anteriormente, contiene la cantidad de aumento final para ese plan de compensaci&oacute;n. Esta columna totaliza todas estas cantidades parciales de tal manera que se ofrece una informaci&oacute;n totalizada, resultado de sumar todos y cada uno de los planes de compensaci&oacute;n.

msscr.Info50-3= Esta columna almacena una cantidad monetaria, expresada en la moneda del empleado pero, a diferencia de contener la suma de todos los aumentos propuestos por el manager, contiene la suma de todos los aumentos propuestos por las metodolog&iacute;as de cada uno de los planes de compensaci&oacute;n en los que se ha revisado al empleado objeto de estudio.

msscr.Info51-3= Esta columna contiene una cantidad monetaria expresado en la moneda del empleado, como resultado de restar la cantidad total propuesta por las metodolog&iacute;as de aumento y la cantidad total propuesta por el manager. Es una cantidad orientativa que permite saber al manager cuanto se aleja de las propuestas realizadas por las metodolog&iacute;as de aumento en total.

msscr.Info52-3= Esta columna expresa en forma de porcentaje, la desviaci&oacute;n existente entre la cantidad total de aumento propuesta por las metodolog&iacute;as de aumento y la cantidad total de aumento propuesta por el manager.

msscr.Info53-3= Pulsando sobre este bot&oacute;n se accede a la p&aacute;gina anterior, es decir, a la p&aacute;gina que nos permite seleccionar los planes de compensaci&oacute;n que queremos revisar para el empleado. Este puede resultar de utilidad cuando se quiera rectificar los planes de compensaci&oacute;n que se tiene seleccionados en este momento. Las acciones realizadas en esta pantalla se perder&aacute;n.

msscr.Info54-3= Pulsando sobre esta bot&oacute;n, se accede a la pantalla siguiente. La pantalla siguiente puede ser diferente dependiendo del momento dentro del flujo de ejecuci&oacute;n en el que nos encontremos. La pantalla siguiente puede ser una de las siguientes:<br><b>1.- </b>Pantalla que nos permite revisar al siguiente empleado, siempre y cuando exista empleado siguiente para revisar.<br><b>2.- </b>La pantalla de resumen de todas las revisiones salariales realizadas hasta el momento, en el caso de que existan revisiones salariales efectuadas para uno o varios empleados (contando tambi&eacute;n el empleado que estamos revisando en este momento). <br><b>3.- </b>La pantalla que contiene la lista de los empleados pertenecientes a la Unidad Organizativa sobre la que se est&aacute; ejecutando el proceso de revisi&oacute;n salarial en el caso de no haber ejecutado la revisi&oacute;n salarial para ninguno de los empleados.

msscr.Info55-3= Esta pantalla te permite ver, en forma de resumen, todas las acciones que se han tomado en el proceso de revisi&oacute;n salarial para todos los empleados revisados dentro del proceso. En esta pantalla se pueden comprobar cuales son los totales de aumento para cada uno de los empleados, tanto para su salario fijo, como para su salario variable. Esta pantalla tambi&eacute;n permite seleccionar de entre todos aquellos empleados que hemos revisado, cuales son los que definitivamente queremos mandar notificaci&oacute;n al departamento de RRHH para que valide y apruebe en su caso, las recomendaciones de aumento de salario efectuadas.

msscr.Info56-3 = En esta columna aparecen los nombres y apellidos de todos los empleados para los que se ha completado el proceso de revisi&oacute;n salarial.

msscr.Info57-3 = En esta columna aparece el nivel de rendimiento consignado para cada uno de los empleados, siempre y cuando haya sido necesario introducir este dato. Recordemos que este dato ser&aacute; necesario introducirlo siempre y cuando el empleado haya sido revisado en alg&uacute;n o varios planes de compensaci&oacute;n, que necesiten esta informaci&oacute;n para poder proponer subidas salariales, caso por ejemplo de todos los planes de compensaci&oacute;n que tienen asociada una metodolog&iacute;a de aumento diferente a Presupuesto. La evaluaci&oacute;n del rendimiento aparecer&aacute;, siempre y cuando, haya sido necesario, en pantallas anteriores, seleccionar este dato para poder revisar los planes de compensaci&oacute;n del empleado.

msscr.Info58-3 = En esta columna aparecen dos cantidades; el salario fijo del empleado propuesto por la metodolog&iacute;a de aumento correspondiente, y el recomendado por el manager. Es una forma de poder ver, de una manera sencilla y previamente al env&iacute;o de los datos al departamento de RRHH, las desviaciones entre los propuesto y lo recomendado.

msscr.Info59-3 = En esta columna aparecen dos cantidades; el salario variable del empleado propuesto por la metodolog&iacute;a de aumento correspondiente, y el recomendado por el manager. Es una forma de poder ver, de una manera sencilla y previamente al env&iacute;o de los datos al departamento de RRHH, las desviaciones entre los propuesto y lo recomendado.

msscr.Info60-3 = En esta columna podemos ver dos cantidades; el salario total (fijo m&aacute;s variable) propuesto por las metodolog&iacute;as de aumento y el salario total (fijo m&aacute;s variable) recomendado por el manager.

msscr.Info61-3 = Es esta columna recordamos al manager cual es la posici&oacute;n actual del salario del empleado dentro del rango salarial correspondiente al grado/banda/zona a la que pertenece el empleado. Recordar que el compa-ratio es la posici&oacute;n dentro de un rango salarial, teniendo presente que el punto medio del rango representa el 100%.

msscr.Info62-3 = Esta columna permite seleccionar los empleados que se desean enviar directamente al departamento de RRHH junto con la informaci&oacute;n relativa a su revisi&oacute;n salarial. Los empleados que no sean seleccionados no ser&aacute;n enviados y sus revisiones salariales se perder&aacute;n.

msscr.Info63-3 = La pulsaci&oacute;n de este bot&oacute;n permite hacer efectivo el env&iacute;o al departamento de RRHH de todos los empleados seleccionados, junto con sus revisiones salariales.

msscr.Info64-3 = FIJO

msscr.Info65-3 = Esta pantalla permite ver el estado de todas las peticiones de aumento salarial que han sido enviadas al departamento de RRHH. Por cada uno de los empleados que haya sido enviado, aparece un bloque conteniendo informaci&oacute;n sobre cual ha sido la revisi&oacute;n efectuada en cada uno de los planes de compensaci&oacute;n. Los tres estados posibles en los que puede estar una revisi&oacute;n salarial son: <br/>1.- <b>Pendiente:</b> El departamento de RRHH todav&iacute;a no se ha pronunciado sobre la revisi&oacute;n salarial en cuesti&oacute;n<br/>2.-<b>Aceptada:</b> El Departamento de RRHH ha aceptado la recomendaci&oacute;n del manager con respecto a la revisi&oacute;n salarial para un determinado empleado, dentro de un determinado plan de compensaci&oacute;n. <br/>3.-<b>Denegada:</b> El Departamento de RRHH ha denegado la recomendaci&oacute;n del manager con respecto a la revisi&oacute;n salarial para un determinado empleado, dentro de un determinado plan de compensaci&oacute;n.

msscr.Info66-3 = En esta columna ponemos encontrar informaci&oacute;n sobre el empleado. Cada uno de los bloques que podemos ver en pantalla, pertenecen a las revisiones salariales enviadas al departamento e RRHH para un empleado. Esta columna nos da el nombre, apellido y nombre del role del empleado.

msscr.Info67-3 = Esta columna contiene la informaci&oacute;n (nombre y tipo de plan de compensaci&oacute;n) para cada uno de los planes de compensaci&oacute;n que estamos visualizando para el empleado.

msscr.Info68-3 = Esta columna contiene una cantidad monetaria expresada en la moneda del empleado. La cantidad que contiene esta columna se corresponde con la cantidad total recomendada por el manager como aumento para el plan de compensaci&oacute;n objeto de estudio.

msscr.Info69-3 = Esta columna contiene una cantidad monetaria expresada en la moneda del empleado. La cantidad que contiene esta columna se corresponde con la cantidad total anterior que el empleado pose&iacute;a en el plan de compensaci&oacute;n objeto de estudio.

msscr.Info70-3 = Esta columna contiene una cantidad monetaria expresada en la moneda del empleado. La cantidad que contiene esta columna se corresponde con la diferencia entre las dos columnas anteriores, es decir, contiene el valor real de aumento propuesto por el manager, calculado como diferencia entre el valor total propuesto y el valor anterior, previo a la revisi&oacute;n salarial.

msscr.Info71-3 = Esta columna contiene el valor mismo valor explicado en la columna anterior, pero expresado en porcentaje en lugar de expresado en cantidad monetaria.

msscr.Info72-3 = Este link permite acceso a una pantalla en la que se pueden visualizar todos los mensajes que el proceso de revisi&oacute;n salarial ha generado. Los mensajes pueden provenir de dos fuentes diferentes; por un lado, el manager cuando hace la revisi&oacute;n salarial, est&aacute; facultado para introducir mensajes cuyo destinatario es el departamento de RRHH y que son notas que pueden aclarar el porque de sus recomendaciones de aumento salarial. Por otro lado, cuando el departamento de RRHH interactua con las peticiones enviados por los manager, est&aacute; facultado a su vez, a introducir mensajes, bien contestando a aquellos que introdujo el manager, bien para introducir nueva informaci&oacute;n relevante que pueda explicar el por qu&eacute; de sus decisiones.

msscr.Info73-3= Este informe permite realizar los resultados globales de los Compensation Review aprobados. Los datos que presenta el report son los pertenecientes a Procesos de Revisi&oacute;n realizados en el periodo comprendido entre las fechas seleccionadas. Ninguno de estos filtros es obligatorio, por lo que, en el caso de que no se aplique ning&uacute;n criterio de selecci&oacute;n, el informe presentar&aacute; todos los datos disponibles.

msscr.Info74-3= Fin

msscr.Info75-3=Fecha inicio plan de compensaci&oacute;n

msscr.Info76-3=Fecha fin plan de compensaci&oacute;n

msscr.Info77-3=Este filtro permite elegir de una lista el formato de la fecha de fin y de inicio del plan de remuneraci&oacute;n.

msscr.Info78-3=Esta columna permite eligir el formato del informe del plan de remuneraci&oacute;n

msscr.Info79-3= Este informe permite analizar los resultados globales de los Compensation Review Porcess aprobados.<br> <b>Grupos</b><br>La informaci&oacute;n que se muestra presenta tres niveles de agrupaci&oacute;n de acuerdo con el siguiente orden:<br> * Compensation Plan<br> * Unidad Organizativa<br> * Manager(Compensation Review Responsible)<br> <b>Totales</b><br> As&iacute; mismo, los resultados del informe se presentan totalizados por: * Manager (Compensation Review Responsible)<br> * Unidad Organizativa<br>* Compensation Plan<br> * Total report (en euros)<br> <b>Cabecera</b><br> Adem&aacute;s de esta informaci&oacute;n, los datos de cabecera nos muestran el Increase Methodology Type y la Increase Table asociada a cada uno de los Compensation Plans.<br> <b>Filtros en ejecuci&oacute;n</b><br> En la ejecuci&oacute;n de este report, el usuario puede realizar un filtro de acuerdo con los siguientes criterios:<br> * Fecha de Revisi&oacute;n. Los datos que presenta el report son los pertenecientes a Procesos de Revisi&oacute;n realizados en el periodo comprendido entre las fechas seleccionadas.<br> * Fecha de Inicio / Fecha Fin Plan de Compensaci&oacute;n.<br> * Manager (Compensation Review Responsible)<br> * Unidad Organizativa<br> * Currency (Euro por defecto)<br> <b>Columnas del informe</b><br> * HR ID<br> * HR Name<br> * Previous Salary<br> * Revised Salary (Nuevo salario aprobado)<br> * % Raised (porcentaje de aumento)<br> * % Methodology (aumento medio propuesto en el Compensation Plan)

msscr.Info80-3= Esta lista de posibles valores, presenta el identificador y el nombre de los empleados para los cuales se est&aacute; visualizando el estado de sus peticiones. Esta lista permite seleccionar un empleado para filtrar por &eacute;l. De esta manera, si se selecciona un empleado de la lista, pulsando el bot&oacute;n de filtrar, se visualizan en pantalla &uacute;nicamente el estado de las revisiones salariales para el empleado seleccionado. Pulsando el bot&oacute;n de anular filtro, se vuelve a visualizar de nuevo la lista completa de estado de revisi&oacute;n para sus empleados revisados.

