msscr.Info1-4= Permite revisar los salarios, empleado por empleado y directamente desde la conexi&oacute;n a la aplicaci&oacute;n.
msscr.Info1-5= Permite revisar los salarios de todos los empleados a trav&eacute;s de una hoja de c&aacute;lculo, no requiriendo, en un primer momento, conexi&oacute;n a la aplicaci&oacute;n.

msscr.Info8m-1 = En esta ventana puedes ver la lista de planes de compensaci&oacute;n asociados a la unidad organizativa seleccionada. Para cada plan salarial, puedes exportar los datos salariales de los empleados a una hoja de c&aacute;lculo para proceder a su revisi&oacute;n y posteriormente importarlos para actualizar los datos en la aplicaci&oacute;n de forma masiva. Si existen empleados pertenecientes a la unidad organizativa cuya revisi&oacute;n salarial no puede llevarse a cabo por diferentes motivos, se relacionan antes que la lista de planes.
msscr.Info8m-2 = Permite ver la lista de empleados que pertenecen a la unidad organizativa seleccionada. Cada valor de lista est&aacute; compuesto por el identificador y el nombre del empleado. Cada uno de estos valores, representa a su vez un link que permite visualizar el hist&oacute;rico de revisiones salariales del empleado. Una vez que se pulsa el link, se aparece una peque&ntilde;a pantalla en la que podemos ver todas las revisiones salariales que el empleado ha tenido, para cada uno de los planes de salario y que hayan sido aprobadas.
msscr.Info8m-3 = Una vez seleccionada la Unidad Organizativa que se quiere revisar, el proceso de revisi&oacute;n permite visualizar todos los planes de compensaci&oacute;n que tienes que revisar. Sin embargo, es posible que, alguno de los empleados pertenecientes a la unidad organizativa, no puedan ser revisados por diferentes motivos. Si en el proceso de carga de empleados se detecta alguna incoherencia o falta de datos necesarios para el proceso de revisi&oacute;n salarial, aparecer&aacute; este s&iacute;mbolo de admiraci&oacute;n. Pulsando sobre &eacute;l, se puede ver cual es el motivo por el cual el empleado no puede ser visado. Alguna de las causas pueden ser:<br>1.- Que el empleado no tenga un tipo de salario adecuado para poder ser revisado<br>2.- Que el empleado no tenga moneda de proceso asociada<br>3.- Que el empleado no tenga asignada ninguna estructura de salario<br>4.- Que el empleado no tenga asociado ning&uacute;n plan de revisi&oacute;n base
msscr.Info8m-4 = Este elemento muestra el nombre del rol que desempe&ntilde;a cada empleado dentro de la unidad organizativa seleccionada. En caso de no estar disponible dicho nombre, se indicar&aacute; con el valor 'No disponible'.
msscr.Info8m-5 = Se muestra el identificador y el nombre del puesto que ocupa cada empleado dentro de la unidad organizativa. Si no est&aacute; disponible el nombre del puesto, aparece el mensaje 'No Disponible'.
msscr.Info8m-6 = Se muestra el identificador del grado/banda/zona de cada empleado dentro de su estructura salarial. La estructura salarial del empleado se determina en funci&oacute;n del pa&iacute;s de la entidad legal a la que pertenece y del grupo de puestos en el que se incluye su puesto. Dentro de esta estructura salarial, se fija el grado/banda/zona correspondiente en funci&oacute;n del puesto que desempe&ntilde;a el empleado en la unidad organizativa seleccionada.
msscr.Info8m-7 = Para cada empleado se muestra el valor y la moneda correspondiente a la &uacute;ltima revisi&oacute;n salarial FIJO realizada. Si es la primera vez que se revisa el salario del empleado, este valor no estar&aacute; disponible. Adem&aacute;s, si la revisi&oacute;n est&aacute; pendiente de aprobaci&oacute;n por parte del departamento de RRHH, aparecer&aacute; el mensaje 'Pendiente de aprobaci&oacute;n'.
msscr.Info8m-8 = Listado de grupos de planes de compensaci&oacute;n asociados a la Unidad Organizativa con la que trabajas. Se muestra una l&iacute;nea por cada grupo, unificando aquellos planes variables que dependen de otros (en la l&iacute;nea del plan del que dependen). Es decir, los grupos pueden formarse por: un plan base y todos los planes variables que dependen de &eacute;l, un plan salarial base sin dependencias o bien un plan variable que no depende de ning&uacute;n plan base.
msscr.Info8m-9 = Al hacer clic en este bot&oacute;n, para cada grupo de planes de compensaci&oacute;n, se genera un fichero excel con todos los empleados afectados por dicho grupo. La hoja excel muestra para cada empleado informaci&oacute;n que te ayudar&aacute; a tomar una decisi&oacute;n sobre la revisi&oacute;n salarial: &uacute;ltima revisi&oacute;n salarial practicada al empleado, aumento propuesto, aumento recomendado, etc&eacute;tera.<br>Indique en la columna Revisi&oacute;n el importe de subida. Al informar este dato se calcula autom&aacute;ticamente el nuevo salario, los campos agrupados en Aumento recomendado y los totales del plan (total de salario actual, total de salario tras la revisi&oacute;n, total del aumento).<br>Si el grupo de planes, tiene varias planes, en la hoja de c&aacute;lculo se muestran los empleados agrupados en cada uno de sus planes.<br>Una vez que has concluido todas las revisiones puedes grabar los datos y a continuaci&oacute;n proceder a importar las revisiones salariales en la aplicaci&oacute;n.
msscr.Info8m-10 = Al hacer clic en este bot&oacute;n, puedes trasladar las revisiones salariales practicadas desde la hoja de c&aacute;lculo a la aplicaci&oacute;n, de forma autom&aacute;tica. La aplicaci&oacute;n comprueba que la hoja de c&aacute;lculo indicada contiene los datos correctos del plan de compensaci&oacute;n que vas a revisar. Si existiera alg&uacute;n error, la aplicaci&oacute;n le advierte de esta situaci&oacute;n.<br>Tras la indicaci&oacute;n de la hoja excel que contiene las revisiones, la aplicaci&oacute;n te muestra la p&aacute;gina Revisi&oacute;n salarial de los empleados, con el resumen de todas las revisiones informadas pudiendo enviar a RRHH aquellas revisiones realizadas hasta el momento que considere v&aacute;lidas.
msscr.Info8m-11 = Al hacer clic en este bot&oacute;n se retrocede a la p&aacute;gina anterior, en la que aparec&iacute;a la lista de las unidades organizativas de cuya revisi&oacute;n salarial eres responsable (directo o delegado).


