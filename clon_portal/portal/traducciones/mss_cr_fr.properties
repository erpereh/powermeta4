msscr.Info1-3= Cliquez sur un des icones (Individuellement ou En masse) correspondant &agrave; l'unit&eacute; de travail dont vous souhaitez r&eacute;viser la r&eacute;mun&eacute;ration des collaborateurs.</br>Cliquez sur le nom de l'unit&eacute; pour en afficher les d&eacute;tails. Cette action vous permet &eacute;galement de d&eacute;l&eacute;guer la responsabilit&eacute; de la r&eacute;vision de la r&eacute;mun&eacute;ration de l'unit&eacute; de travail correspondante.

msscr.Info2-3= Cette fen&ecirc;tre pr&eacute;sente la liste des collaborateurs qui appartiennent &agrave; l'unit&eacute; de travail s&eacute;lectionn&eacute;e et dont le code se d&eacute;gage. Vous pouvez s&eacute;lectionner les collaborateurs dont vous souhaitez r&eacute;viser la r&eacute;mun&eacute;ration (&agrave; condition qu'ils soient disponibles).

msscr.Info3-3= Cette fen&ecirc;tre pr&eacute;sente la liste des plans de r&eacute;mun&eacute;ration correspondant &agrave; chaque collaborateur s&eacute;lectionn&eacute;. Les fen&ecirc;tres qui composent le processus de r&eacute;vision se succ&egrave;dent autant de fois que de collaborateurs s&eacute;lectionn&eacute;s pour r&eacute;vision. Toutefois, chaque fen&ecirc;tre n'affiche que les informations relatives au collaborateur en cours. Vous s&eacute;lectionnez les plans de r&eacute;mun&eacute;ration de chaque collaborateur que vous souhaitez r&eacute;viser.

msscr.Info4-3= Dans cette fen&ecirc;tre, vous pouvez r&eacute;viser tous les plans de r&eacute;mun&eacute;ration s&eacute;lectionn&eacute;s lors de l'&eacute;tape pr&eacute;c&eacute;dente pour le collaborateur en cours. La fen&ecirc;tre comporte une s&eacute;rie de blocs de donn&eacute;es. Le premier contient les donn&eacute;es n&eacute;cessaires &agrave; la r&eacute;vision de la r&eacute;mun&eacute;ration de base du collaborateur. Si vous avez s&eacute;lectionn&eacute; &agrave; l'&eacute;tape pr&eacute;c&eacute;dente un ou plusieurs plans de r&eacute;mun&eacute;ration de type R&eacute;mun&eacute;ration variable, un bloc fonctionnel appara&icirc;t avec les donn&eacute;es n&eacute;cessaires &agrave; la r&eacute;vision de chaque plan. Enfin, un troisi&egrave;me bloc reprend l'ensemble des informations relatives aux d&eacute;cisions que vous avez prises dans la fen&ecirc;tre.

msscr.Tabla1-3= &Eacute;l&eacute;ment

msscr.Tabla2-3= Explication de l'&eacute;l&eacute;ment

msscr.Tabla3-3= Type d'&eacute;l&eacute;ment

msscr.Tabla4-3= Description

msscr.ID1-3= Code de l'unit&eacute; de travail

msscr.ID2-3= Lien

msscr.ID2-4= Message d'information

msscr.Info5-3= Cette colonne affiche toutes les unit&eacute;s de travail dont vous &ecirc;tes responsable de la r&eacute;vision de la r&eacute;mun&eacute;ration. Notez que les unit&eacute;s de travail pr&eacute;sentent entre elles une relation hi&eacute;rarchique pr&eacute;sent&eacute;e de mani&egrave;re figur&eacute;e sous forme arborescente. La page affiche toutes les unit&eacute;s de travail dont vous &ecirc;tes responsable direct de la r&eacute;vision ainsi que les unit&eacute;s qui d&eacute;pendent de celles-ci et pour lesquelles aucun responsable direct de r&eacute;vision n'a &eacute;t&eacute; d&eacute;sign&eacute;. Le cas &eacute;ch&eacute;ant, figurent aussi dans cette liste les unit&eacute;s de travail pour lesquelles la r&eacute;vision vous a &eacute;t&eacute; d&eacute;l&eacute;gu&eacute;e (pour en savoir plus, reportez-vous &agrave; l'&eacute;l&eacute;ment <b>Type de responsable</b>).<br>Cliquez sur l'unit&eacute; de travail de votre choix pour acc&eacute;der &agrave; une fen&circ;tre qui contient les informations &eacute;l&eacute;mentaires suivantes&nbsp;: code, libell&eacute;, type et description de l'unit&eacute; de travail ainsi que la liste de tous les responsables, quel que soit leur type, affect&eacute;s &agrave; l'unit&eacute; de travail. Dans cette liste, vous pouvez, si vous le souhaitez, s&eacute;lectionner un responsable pour lui d&eacute;l&eacute;guer la responsabilit&eacute; de r&eacute;viser la r&eacute;mun&eacute;ration des collaborateurs de l'unit&eacute; de travail dont les d&eacute;tails sont affich&eacute;s &agrave; l'&eacute;cran. Vous ne pouvez le faire que si vous &ecirc;tes le responsable direct de la r&eacute;vision de la r&eacute;mun&eacute;ration dans cette unit&eacute; de travail. Dans les cas o&ugrave; vous &ecirc;tes responsable d&eacute;l&eacute;gu&eacute;(e), vous ne pouvez pas d&eacute;l&eacute;guer &agrave; votre tour la r&eacute;vision &agrave; une autre personne. Une fois que vous avez s&eacute;lectionn&eacute; le responsable &agrave; qui vous souhaitez d&eacute;l&eacute;guer la r&eacute;vision, cliquez sur le bouton Continuer pour envoyer un courriel &agrave; celui-ci afin de l'informer de vos intentions.

msscr.ID3-3= Libell&eacute; de l'unit&eacute; de travail

msscr.Info6-3= Cliquez sur l'unit&eacute; de travail de votre choix pour acc&eacute;der &agrave; une fen&circ;tre qui contient les informations &eacute;l&eacute;mentaires suivantes&nbsp;: code, libell&eacute;, type et description de l'unit&eacute; de travail ainsi que la liste de tous les responsables, quel que soit leur type, affect&eacute;s &agrave; l'unit&eacute; de travail. Dans cette liste, vous pouvez, si vous le souhaitez, s&eacute;lectionner un responsable pour lui d&eacute;l&eacute;guer la responsabilit&eacute; de r&eacute;viser la r&eacute;mun&eacute;ration des collaborateurs de l'unit&eacute; de travail dont les d&eacute;tails sont affich&eacute;s &agrave; l'&eacute;cran. Vous ne pouvez le faire que si vous &ecirc;tes le responsable direct de la r&eacute;vision de la r&eacute;mun&eacute;ration dans cette unit&eacute; de travail. Dans les cas o&ugrave; vous &ecirc;tes responsable d&eacute;l&eacute;gu&eacute;(e), vous ne pouvez pas d&eacute;l&eacute;guer &agrave; votre tour la r&eacute;vision &agrave; une autre personne. Une fois que vous avez s&eacute;lectionn&eacute; le responsable &agrave; qui vous souhaitez d&eacute;l&eacute;guer la r&eacute;vision, cliquez sur le bouton Continuer pour envoyer un courriel &agrave; celui-ci afin de l'informer de vos intentions.

msscr.ID4-3= Type de responsable

msscr.ID5-3= Liste de valeurs

msscr.Info7-3= Chaque unit&eacute; de travail de la liste comporte l'information du type de responsable que vous constituez pour la r&eacute;vision des r&eacute;mun&eacute;rations dans l'unit&eacute; de travail. Ce champ peut prendre deux valeurs possibles&nbsp;: &quot;&nbsp;Responsable de r&eacute;vision&nbsp;&quot; et &quot;&nbsp;Responsable d&eacute;l&eacute;gu&eacute; de r&eacute;vision&nbsp;&quot;. Dans le premier cas, vous &ecirc;tes responsable direct de la r&eacute;vision de la r&eacute;mun&eacute;ration des membres de l'unit&eacute; de travail concern&eacute;e et vous avez la facult&eacute;, si vous le souhaitez, de d&eacute;l&eacute;guer cette responsabilit&eacute; &agrave; n'importe quel autre responsable de l'unit&eacute; de travail (reportez-vous &agrave; l'&eacute;l&eacute;ment

msscr.Info7-2-3= pour en savoir plus). En revanche, dans le second cas, vous avez &eacute;t&eacute; d&eacute;l&eacute;gu&eacute;(e) pour la r&eacute;vision de la r&eacute;mun&eacute;ration et vous ne jouissez donc pas de cette facult&eacute;.

msscr.ID6-3= Collaborateur

msscr.ID7-3= Liste de valeurs

msscr.Info8-3= Elle affiche la liste des collaborateurs qui appartiennent &agrave; l'unit&eacute; de travail s&eacute;lectionn&eacute;e. Chaque &eacute;l&eacute;ment de la liste est compos&eacute; du code et du nom du collaborateur. Il constitue en outre un lien permettant de prendre connaissance des r&eacute;visions successives de la r&eacute;mun&eacute;ration du collaborateur. Cliquez sur le lien pour ouvrir une fen&ecirc;tre pr&eacute;sentant l'ensemble des r&eacute;visions de la r&eacute;mun&eacute;ration du collaborateur, approuv&eacute;es &agrave; ce jour pour chacun de ses plans de r&eacute;mun&eacute;ration.

msscr.Info8-4 = Une fois s&eacute;lectionn&eacute;e l'unit&eacute; de travail que vous souhaitez r&eacute;viser, le processus affiche l'ensemble des collaborateurs &agrave; r&eacute;viser dans l'unit&eacute;. Toutefois, il peut arriver que certains d'entre eux ne puissent pas &ecirc;tre r&eacute;vis&eacute;s pour une raison donn&eacute;e. Dans ces cas-l&agrave;, si, lors du processus de chargement des collaborateurs, des incoh&eacute;rences ou encore l'absence de donn&eacute;es n&eacute;cessaires &agrave; la r&eacute;vision ont &eacute;t&eacute; d&eacute;tect&eacute;es, un point d'exclamation appara&icirc;t. Cliquer sur celui-ci permet de conna&icirc;tre le motif pour lequel le collaborateur ne peut pas &ecirc;tre vis&eacute;. Parmi les motifs possibles, citons&nbsp;:<br/>1.- Le collaborateur n'a pas un type de r&eacute;mun&eacute;ration appropri&eacute;.<br/>2.- Aucune devise n'est associ&eacute;e au collaborateur.<br/>3.- Aucune structure de r&eacute;mun&eacute;ration n'est associ&eacute;e au collaborateur.<br/>4.- Aucune plan de r&eacute;mun&eacute;ration de base n'est associ&eacute; au collaborateur.<br/>

msscr.Info8-2-3= appara&icirc;t &agrave; c&ocirc;t&eacute; du code du collaborateur. Si vous cliquez sur lui, une fen&ecirc;tre d'information descriptive des erreurs qui se sont produites appara&icirc;t.

msscr.ID8-3= R&ocirc;le

msscr.Info9-3= Cet &eacute;l&eacute;ment affiche le libell&eacute; du r&ocirc;le occup&eacute; par chaque collaborateur au sein de l'unit&eacute; de travail s&eacute;lectionn&eacute;e. Dans les cas o&ugrave; le libell&eacute; n'est pas disponible, la valeur &quot;&nbsp;Non disponible&nbsp;&quot; appara&icirc;t &agrave; sa place.

msscr.ID9-3= Emploi

msscr.Info10-3= Cette zone affiche le code et le libell&eacute; du r&ocirc;le occup&eacute; par chaque collaborateur au sein de l'unit&eacute; de travail. Dans les cas o&ugrave; le libell&eacute; de l'emploi n'est pas disponible, le message &quot;&nbsp;Non disponible&nbsp;&quot; appara&icirc;t.

msscr.ID10-3= &Eacute;chelon

msscr.Info11-3= Cette zone affiche le code de l'&eacute;chelon/fourchette/zone de chaque collaborateur &agrave; l'int&eacute;rieur de sa structure de r&eacute;mun&eacute;ration. La structure de r&eacute;mun&eacute;ration est d&eacute;termin&eacute;e en fonction de l'entit&eacute; juridique &agrave; laquelle le collaborateur appartient et du groupe d'emplois auquel l'emploi du collaborateur appartient. Ensuite, &agrave; l'int&eacute;rieur de la structure de r&eacute;mun&eacute;ration, l'&eacute;chelon/fourchette/zone correspondant est d&eacute;termin&eacute; en fonction de l'emploi occup&eacute; par le collaborateur au sein de l'unit&eacute; de travail s&eacute;lectionn&eacute;e.

msscr.ID11-3= Fixe r&eacute;vis&eacute;

msscr.Info12-3= Pour chaque collaborateur, sont affich&eacute;es la valeur et la devise correspondant &agrave; la derni&egrave;re r&eacute;vision de r&eacute;mun&eacute;ration

msscr.Info12-2-3= r&eacute;alis&eacute;e. Dans les cas o&ugrave; la r&eacute;vision a lieu pour la premi&egrave;re fois, cette valeur n'est pas disponible. Dans les cas o&ugrave; la r&eacute;vision se trouve en attente d'approbation de la part du d&eacute;partement des RH, le message &quot;&nbsp;En attente d'approbation&nbsp;&quot; appara&icirc;t.

msscr.ID12-3= R&eacute;viser

msscr.ID13-3= Champ de s&eacute;lection

msscr.Info13-3= Ce champ vous permet de s&eacute;lectionner les collaborateurs que vous souhaitez r&eacute;viser. Il appara&icirc;t d&eacute;sactiv&eacute; lorsqu'une erreur se produit ou qu'une donn&eacute;e est manquante pour le collaborateur. Les erreurs emp&ecirc;chant l'ex&eacute;cution du processus de r&eacute;vision sont les suivantes&nbsp;:</br><b>1.-</b> Absence de devise associ&eacute;e &agrave; l'emploi. La devise dans laquelle la paie du collaborateur est calcul&eacute;e est alors utilis&eacute;e pour le processus. </br><b>2.-</b> Absence de structure de r&eacute;mun&eacute;ration du collaborateur.</br><b>3.-</b> Absence d'&eacute;chelon/fourchette/zone &agrave; l'int&eacute;rieur de la structure de r&eacute;mun&eacute;ration du collaborateur.</br><b>4.-</b> Absence de plan de r&eacute;mun&eacute;ration associ&eacute; au collaborateur.</br>Lorsque l'une des erreurs pr&eacute;c&eacute;dentes se produit, le symbole

msscr.Info13-2-3= appara&icirc;t &agrave; c&ocirc;t&eacute; du code du collaborateur (pour en savoir plus, reportez-vous &agrave; l'&eacute;l&eacute;ment &quot;&nbsp;Collaborateur&nbsp;&quot;).

msscr.ID14-3= Bouton de processus

msscr.Info14-3= Cliquez sur ce bouton pour revenir &agrave; la page pr&eacute;c&eacute;dente qui affiche la liste des unit&eacute;s de travail dont vous &ecirc;tes le responsable (direct ou par d&eacute;l&eacute;gation) de r&eacute;vision de r&eacute;mun&eacute;ration.

msscr.Info15-3= Cliquez sur ce bouton pour acc&eacute;der aux fen&ecirc;tres successives qui composent le processus de r&eacute;vision. La succession des fen&ecirc;tres se r&eacute;p&eacute;tera autant de fois que de collaborateurs s&eacute;lectionn&eacute;s pour r&eacute;vision. Ce bouton ne vous permettra pas de continuer au cas o&ugrave; vous n'auriez pas s&eacute;lectionn&eacute; de collaborateur &agrave; r&eacute;viser.

msscr.Info16-3= Cliquez sur l'&eacute;chelon/fourchette/zone du collaborateur pour acc&eacute;der &agrave; une fen&ecirc;tre d'information pr&eacute;sentant les donn&eacute;es suivantes&nbsp;: code et libell&eacute; de la structure de r&eacute;mun&eacute;ration du collaborateur, code et libell&eacute; de l'&eacute;chelon/fourchette/zone du collaborateur, r&eacute;mun&eacute;ration maximale, r&eacute;mun&eacute;ration minimale et point moyen de l'&eacute;chelon/fourchette/zone, ratio comparatif et degr&eacute; de p&eacute;n&eacute;tration du collaborateur &agrave; l'int&eacute;rieur de son &eacute;chelon/fourchette/zone, quartiles inf&eacute;rieur (25%) et sup&eacute;rieur (75%) de l'ensemble des membres de l'unit&eacute; de travail s&eacute;lectionn&eacute;e appartenant au m&ecirc;me &eacute;chelon/fourchette/zone et &agrave; la m&ecirc;me structure de r&eacute;mun&eacute;ration que le collaborateur.

msscr.ID15-3= R&eacute;mun&eacute;ration de base

msscr.Info17-3= Ce champ vous indique la r&eacute;mun&eacute;ration de base actuelle du collaborateur. G&eacute;n&eacute;ralement, celle-ci est la m&ecirc;me que la valeur &eacute;tablie lors de la derni&egrave;re r&eacute;vision de la r&eacute;mun&eacute;ration de base du collaborateur. N&eacute;anmoins, des modifications peuvent avoir &eacute;t&eacute; apport&eacute;es depuis la derni&egrave;re r&eacute;vision&nbsp;: c'est la raison pour laquelle la valeur actuellement utilis&eacute;e comme r&eacute;mun&eacute;ration de base pour le calcul de la paie vous est donn&eacute;e. Dans tous les cas et &agrave; tous les effets, cette valeur est celle qui est utilis&eacute;e pour effectuer les r&eacute;visions de r&eacute;mun&eacute;ration puisqu'elle correspond &agrave; la valeur r&eacute;elle de la r&eacute;mun&eacute;ration de base du collaborateur.

msscr.ID16-3= Plan de r&eacute;mun&eacute;ration

msscr.NOHTML_ID16-3= Plan de rémunération

msscr.ID17-3= Lien - Liste de valeurs

msscr.Info18-3= Ce champ affiche tous les plans de r&eacute;mun&eacute;ration affect&eacute;s au collaborateur s&eacute;lectionn&eacute;. Chaque valeur se compose du code et du nom du plan. Cliquez sur le plan de votre choix pour ouvrir une fen&ecirc;tre affichant les d&eacute;tails de celui-ci&nbsp;: code, libell&eacute;, type, description, devise et p&eacute;riodicit&eacute; du plan ainsi que la m&eacute;thodologie utilis&eacute;e pour proposer des augmentations de r&eacute;mun&eacute;ration. En outre, il indique quelle est la table pr&eacute;cise qui contient les valeurs propos&eacute;es pour les augmentations de r&eacute;mun&eacute;ration des collaborateurs dans le cadre du plan tout en en fournissant une description et les valeurs. Enfin, lorsque le plan est de type R&eacute;mun&eacute;ration de base, certaines propri&eacute;t&eacute;s compl&eacute;mentaires sont &eacute;galement pr&eacute;sent&eacute;es, telles que la performance et l'anciennet&eacute; minimales exig&eacute;es pour entrer dans le plan, l'augmentation maximale permise par rapport &agrave; la r&eacute;mun&eacute;ration de base du collaborateur et si ce dernier d&eacute;pend directement ou non du plan associ&eacute; de type R&eacute;mun&eacute;ration de base.

msscr.ID18-3= Type

msscr.Info19-3= Ce champ affiche le type de chacun des plans de r&eacute;mun&eacute;ration du collaborateur s&eacute;lectionn&eacute;. Il peut avoir pour valeur &quot;&nbsp;Valeur de base&nbsp;&quot;, &quot;&nbsp;Valeur variable&nbsp;&quot;, etc.

msscr.ID19-3= Montant derni&egrave;re r&eacute;vision

msscr.Info20-3= Ce champ affiche la valeur mon&eacute;taire actuelle de chacun des plans de r&eacute;mun&eacute;ration du collaborateur s&eacute;lectionn&eacute;. Le montant mon&eacute;taire est accompagn&eacute; de la devise correspondante. Toutes les valeurs affich&eacute;es &agrave; l'&eacute;cran sont exprim&eacute;es en une seule devise car elles sont converties &agrave; la devise de calcul de la paie du collaborateur. Les cas particulier suivants peuvent se pr&eacute;senter</br><b>1.- </b>Dans les cas o&ugrave; la valeur actuelle d'un plan donn&eacute; n'existe pas, le message &quot;&nbsp;Non disponible&nbsp;&quot; appara&icirc;t.</br><b>2.- </b>Dans les cas o&ugrave; la valeur du plan est en cours de r&eacute;vision, c'est-&agrave;-dire qu'une proposition d'augmentation, en attente d'approbation, a &eacute;t&eacute; faite pour le plan, le message &quot;&nbsp;En cours d'approbation&nbsp;&quot; appara&icirc;t.</br><b>3.-</b> Dans les cas o&ugrave; il existe une restriction emp&ecirc;chant la r&eacute;vision du plan pour le collaborateur, et bien que le plan ait &eacute;t&eacute; affect&eacute; au collaborateur, le message &quot;&nbsp;Plan non r&eacute;visable&nbsp;&quot; appara&icirc;t.

msscr.ID20-3= Date de r&eacute;vision

msscr.Info21-3= Ce champ affiche la date de r&eacute;vision de chaque plan de r&eacute;mun&eacute;ration du collaborateur &agrave; laquelle la valeur mon&eacute;taire affich&eacute;e &agrave; l'&eacute;cran a &eacute;t&eacute; &eacute;tablie (&agrave; condition que le plan ait une valeur actuelle).

msscr.ID21-3= R&eacute;viser

msscr.Info22-3= Lorsqu'il est activ&eacute;, ce champ permet de s&eacute;lectionner le plan de de r&eacute;mun&eacute;ration du collaborateur que vous souhaitez r&eacute;viser. Vous pouvez s&eacute;lectionner un ou plusieurs plans. Pour pouvoir poursuivre le processus de r&eacute;vision en cours (pour ce collaborateur), vous devez s&eacute;lectionner au moins un plan de r&eacute;mun&eacute;ration. Si vous choisissez un plan de r&eacute;mun&eacute;ration d&eacute;pendant du plan de r&eacute;mun&eacute;ration de type R&eacute;mun&eacute;ration de base, ce dernier est automatiquement s&eacute;lectionn&eacute; en vertu de l'obligation de r&eacute;viser en m&ecirc;me temps des plans li&eacute;s entre eux. En d'autres termes, les plans de r&eacute;mun&eacute;ration servant &agrave; la r&eacute;vision de la r&eacute;mun&eacute;ration de base d'un collaborateur peuvent &ecirc;tre r&eacute;vis&eacute;s &agrave; tout moment, de mani&egrave;re individuelle. Toutefois, les plans de r&eacute;mun&eacute;ration utilis&eacute;s lors de la r&eacute;vision du variable d'un collaborateur, peuvent &ecirc;tre conditionn&eacute;s par les facteurs suivants&nbsp;:<br/>1.- Le plan est li&eacute; au plan servant &agrave; la r&eacute;vision de la r&eacute;mun&eacute;ration de base. Dans ce cas, &agrave; l'heure de r&eacute;viser un plan de r&eacute;mun&eacute;ration variable, vous devez s&eacute;lectionner le plan de de r&eacute;mun&eacute;ration de base correspondant afin de r&eacute;viser les deux plans en m&ecirc;me temps. <br/>2.- Le plan ne d&eacute;pend pas du plan servant &agrave; la r&eacute;vision de la r&eacute;mun&eacute;ration de base. Dans ce cas, vous pouvez r&eacute;viser le plan variable sans aucune contrainte, &agrave; n'importe quel moment. <br/>. Comme vu pr&eacute;c&eacute;demment, des situations peuvent se pr&eacute;senter dans lesquelles plusieurs plans de r&eacute;mun&eacute;ration doivent &ecirc;tre r&eacute;vis&eacute;s au m&ecirc;me moment. Une exception existe cependant&nbsp;: il s'agit de la situation dans laquelle un plan de r&eacute;mun&eacute;ration variable a &eacute;t&eacute; r&eacute;vis&eacute; conjointement au plan de r&eacute;mun&eacute;ration de base correspondant et que les deux r&eacute;visions ont &eacute;t&eacute; envoy&eacute;es au d&eacute;partement des RH. Aussi se peut-il que la r&eacute;vision recommand&eacute;e par vous ait &eacute;t&eacute; approuv&eacute;e pour la r&eacute;mun&eacute;ration de base et rejet&eacute;e pour la r&eacute;mun&eacute;ration variable. Dans ce cas, vous pouvez, en revenant &agrave; cet &eacute;cran pour le collaborateur concern&eacute;, ne r&eacute;viser que la r&eacute;mun&eacute;ration variable de façon s&eacute;par&eacute;e, sans avoir &agrave; r&eacute;viser de nouveau la r&eacute;mun&eacute;ration de base associ&eacute;e. Pour ce faire, vous n'avez qu'&agrave; marquer le plan de r&eacute;mun&eacute;ration variable &agrave; r&eacute;viser. Un message vous informant de la situation appara&icirc;tra &agrave; ce moment-l&agrave; ; il vous aidera &agrave; prendre une d&eacute;cision. 

msscr.ID22-3= &Eacute;valuation des comp&eacute;tences et des performances

msscr.ID23-3= Liste des valeurs possibles

msscr.Info23-3= Les m&eacute;thodologies d'augmentation utilis&eacute;es pour proposer une augmentation de la r&eacute;mun&eacute;ration d'un collaborateur d&eacute;pendent de la performance atteinte par ce dernier. Pour cette raison, vous devez s&eacute;lectionner le niveau de performance que le syst&egrave;me utilisera pour proposer dans les &eacute;crans suivants des augmentations pour le collaborateur. Attribuer un niveau de performance est n&eacute;cessaire &agrave; chaque fois qu'un plan marqu&eacute; pour r&eacute;vision est index&eacute; sur l'&eacute;valuation des comp&eacute;tences et des performances. Si, au moment de cliquer sur Continuer, vous ne l'avez pas fait alors qu'il est obligatoire de le faire, un message vous demandera de s&eacute;lectionner un niveau de performance.

msscr.Info24-3= Cliquez sur ce bouton pour retourner &agrave; l'&eacute;cran de s&eacute;lection du collaborateur. Si vous le faites, toutes les r&eacute;visions qui n'ont pas encore &eacute;t&eacute; envoy&eacute;es au d&eacute;partement des RH seront perdues. &Agrave; tous les effets, ex&eacute;cuter ce bouton revient &agrave; recommencer depuis le d&eacute;but le processus de r&eacute;vision de r&eacute;mun&eacute;ration en cours.

msscr.Info25-3= Cliquez sur ce bouton pour poursuivre le processus de r&eacute;vision de la r&eacute;mun&eacute;ration du collaborateur en cours. Vous ne pouvez pas poursuivre le processus si vous n'avez pas s&eacute;lectionn&eacute; au moins un plan dans la liste des plans de r&eacute;mun&eacute;ration du collaborateur.

msscr.Info26-3= Cliquez sur ce bouton pour omettre le collaborateur en cours de r&eacute;vision et le supprimer du processus de r&eacute;vision. Au cas o&ugrave; d'autres collaborateurs pr&eacute;c&eacute;demment s&eacute;lectionn&eacute;s resteraient &agrave; r&eacute;viser, le syst&egrave;me afficherait &agrave; l'&eacute;cran les donn&eacute;es du collaborateur suivant. Dans les cas o&ugrave; aucun autre collaborateur ne reste &agrave; r&eacute;viser alors que des r&eacute;visions effectu&eacute;es n'ont pas encore &eacute;t&eacute; envoy&eacute;es au d&eacute;partement des RH, le syst&egrave;me vous m&egrave;nera &agrave; l'&eacute;cran qui vous permettra d'envoyer vos recommandations d'augmentation au d&eacute;partement des RH. S'il ne reste aucun collaborateur &agrave; r&eacute;viser ni de r&eacute;vision &agrave; envoyer, vous acc&eacute;dez de nouveau &agrave; la fen&ecirc;tre qui contient la liste des collaborateurs de l'unit&eacute; de travail s&eacute;lectionn&eacute;e au d&eacute;but du processus de r&eacute;vision.

msscr.Info27-3= Ce bouton est analogue au bouton pr&eacute;c&eacute;dent &agrave; la diff&eacute;rence qu'il ne passe pas au collaborateur &agrave; r&eacute;viser suivant (lorsqu'il en existe un) mais qu'il saute tous les collaborateurs restant &agrave; r&eacute;viser pour vous mener directement &agrave; la fen&ecirc;tre permettant d'envoyer au d&eacute;partement des RH vos recommandations d'augmentation.

msscr.ID24-3= R&eacute;vision de la r&eacute;mun&eacute;ration de base

msscr.ID25-3= Bloc de donn&eacute;es

msscr.Info28-3= Ce bloc contient l'ensemble des informations n&eacute;cessaires &agrave; la r&eacute;vision de la r&eacute;mun&eacute;ration de base du collaborateur affich&eacute; &agrave; l'&eacute;cran. Les champs contenus dans le bloc de donn&eacute;es sont&nbsp;:

msscr.ID26-3= Derni&egrave;re r&eacute;vision (montant)

msscr.ID27-3= Champ d'information

msscr.Info29-3= Ce champ indique la valeur &eacute;tablie lors de la derni&egrave;re r&eacute;vision de la r&eacute;mun&eacute;ration de base du collaborateur. Lorsque cette valeur n'est pas disponible pour cause d'absence de r&eacute;vision pr&eacute;alable, ce champ affiche un z&eacute;ro (0).

msscr.ID28-3= Derni&egrave;re r&eacute;vision (% d'augmentation)

msscr.ID29-3= Champ d'information

msscr.Info30-3= Ce champ indique le pourcentage d'augmentation &eacute;tabli lors de la derni&egrave;re r&eacute;vision de la r&eacute;mun&eacute;ration de base du collaborateur. Lorsque cette valeur n'est pas disponible pour cause d'absence de r&eacute;vision pr&eacute;alable, ce champ affiche un z&eacute;ro (0).

msscr.ID30-3= Derni&egrave;re r&eacute;vision (position)

msscr.Info31-3= Ce champ indique la position prise, &agrave; l'int&eacute;rieur de l'&eacute;chelon/fourchette/zone, par la valeur &eacute;tablie comme r&eacute;mun&eacute;ration de base lors de la derni&egrave;re r&eacute;vision du collaborateur. La position repr&eacute;sente le degr&eacute; de p&eacute;n&eacute;tration de la r&eacute;mun&eacute;ration de base du collaborateur &agrave; l'int&eacute;rieur de l'&eacute;chelon / la fourchette / la zone de sa structure de r&eacute;mun&eacute;ration. Pour le calcul de la position, 0% de p&eacute;n&eacute;tration correspond &agrave; la r&eacute;mun&eacute;ration minimale dans l'&eacute;chelon/fourchette/zone tandis que 100% de p&eacute;n&eacute;tration correspond &agrave; la r&eacute;mun&eacute;ration maximale dans l'&eacute;chelon/fourchette/zone. Aussi les r&eacute;mun&eacute;rations inf&eacute;rieures &agrave; la r&eacute;mun&eacute;ration minimale donneront un pourcentage de p&eacute;n&eacute;tration n&eacute;gatif alors que les r&eacute;mun&eacute;rations sup&eacute;rieures &agrave; la r&eacute;mun&eacute;ration maximale donneront un pourcentage de p&eacute;n&eacute;tration positif.

msscr.ID31-3= Derni&egrave;re r&eacute;vision (ratio comparatif)

msscr.Info32-3= &Agrave; la diff&eacute;rence du degr&eacute; de p&eacute;n&eacute;tration, ou position, de la r&eacute;mun&eacute;ration du collaborateur &agrave; l'int&eacute;rieur de l'&eacute;chelon/fourchette/zone, expliqu&eacute; pr&eacute;c&eacute;demment, le ratio comparatif vous informe du degr&eacute; de p&eacute;n&eacute;tration d'une r&eacute;mun&eacute;ration en prenant cette fois en compte quel point moyen de l'&eacute;chelon/fourchette/zone correspond &agrave; un ratio de 100%. Aussi, les r&eacute;mun&eacute;rations inf&eacute;rieures au point moyen donneront comme r&eacute;sultat un ratio comparatif inf&eacute;rieur &agrave; 100% tandis que les r&eacute;mun&eacute;rations sup&eacute;rieures au point moyen donneront un ratio comparatif sup&eacute;rieur &agrave; 100%.

msscr.ID32-3= Augmentation propos&eacute;e (montant)

msscr.Info33-3= La fonction de ce champ est analogue &agrave; celle du champ d'information Derni&egrave;re r&eacute;vision d&eacute;crit pr&eacute;c&eacute;demment, &agrave; la diff&eacute;rence que celui-ci tient compte, pour la pr&eacute;sentation des valeurs &agrave; l'&eacute;cran, de la r&eacute;mun&eacute;ration de base du collaborateur et des pourcentages d'augmentation produits par application du niveau de performance du collaborateur &agrave; la m&eacute;thodologie d'augmentation utilis&eacute;e pour le plan de r&eacute;mun&eacute;ration.

msscr.ID33-3= Augmentation propos&eacute;e (% d'augmentation)

msscr.Info34-3= La fonction de ce champ est analogue &agrave; celle du champ d'information Derni&egrave;re r&eacute;vision d&eacute;crit pr&eacute;c&eacute;demment, &agrave; la diff&eacute;rence que celui-ci tient compte, pour la pr&eacute;sentation des valeurs &agrave; l'&eacute;cran, de la r&eacute;mun&eacute;ration de base du collaborateur et des pourcentages d'augmentation produits par application du niveau de performance du collaborateur &agrave; la m&eacute;thodologie d'augmentation utilis&eacute;e pour le plan de r&eacute;mun&eacute;ration.

msscr.ID34-3= Augmentation propos&eacute;e (position)

msscr.ID35-3= Augmentation recommand&eacute;e (montant)

msscr.ID36-3= Champ &eacute;ditable

msscr.Info35-3 La fonction de ce champ est analogue &agrave; celle du champ Augmentation propos&eacute;e d&eacute;crit pr&eacute;c&eacute;demment, &agrave; la diff&eacute;rence que celui-ci tient compte, pour la pr&eacute;sentation des valeurs &agrave; l'&eacute;cran, de l'augmentation par rapport &agrave; la r&eacute;mun&eacute;ration de base actuelle d&eacute;cid&eacute;e par le responsable sur la base des champs pr&eacute;c&eacute;dents pr&eacute;sentant la proposition faite par le syst&egrave;me. <u><b>Notez que, lorsque la r&eacute;mun&eacute;ration de base actuelle n'est pas disponible pour le collaborateur, la valeur obtenue dans ce champ n'est pas consid&eacute;r&eacute;e comme une augmentation par rapport &agrave; la r&eacute;mun&eacute;ration de base (non disponible), mais comme nouvelle r&eacute;mun&eacute;ration de base totale recommand&eacute;e par le responsable.</b></u>

msscr.ID37-3= Augmentation recommand&eacute;e (% d'augmentation)

msscr.Info36-3 La fonction de ce champ est analogue &agrave; celle du champ Augmentation propos&eacute;e d&eacute;crit pr&eacute;c&eacute;demment, &agrave; la diff&eacute;rence que celui-ci tient compte, pour la pr&eacute;sentation des valeurs &agrave; l'&eacute;cran, de l'augmentation par rapport &agrave; la r&eacute;mun&eacute;ration de base actuelle d&eacute;cid&eacute;e par le responsable sur la base des champs pr&eacute;c&eacute;dents pr&eacute;sentant la proposition faite par le syst&egrave;me. Dans les cas o&ugrave; la r&eacute;mun&eacute;ration de base actuelle du collaborateur n'est pas disponible, ce champ n'est pas modifiable, en raison de l'impossibilit&eacute; de consigner des pourcentages d'augmentation par rapport &agrave; une valeur qui n'existe pas.

msscr.ID38-3= Augmentation recommand&eacute;e (position)

msscr.Info37-3= La fonction de ce champ est analogue &agrave; celle du champ d'information Augmentation propos&eacute;e d&eacute;crit pr&eacute;c&eacute;demment, &agrave; la diff&eacute;rence que celui-ci tient compte, pour la pr&eacute;sentation des valeurs &agrave; l'&eacute;cran, de la nouvelle r&eacute;mun&eacute;ration de base r&eacute;sultant de l'application de la r&eacute;mun&eacute;ration de base actuelle &agrave; l'augmentation recommand&eacute;e par le responsable.

msscr.ID39-3= Augmentation recommand&eacute;e (ratio comparatif)

msscr.ID40-3= R&eacute;mun&eacute;ration de base totale (montant)

msscr.Info38-3= Prenant en compte les recommandations du responsable, ce champ affiche la valeur totale de la nouvelle r&eacute;mun&eacute;ration de base du collaborateur.

msscr.ID41-3= Plans de r&eacute;mun&eacute;ration variable

msscr.ID42-3= Augmentation actuelle

msscr.ID43-3= Variable propos&eacute; (montant total)

msscr.ID44-3= Variable propos&eacute; (% fixe)

msscr.ID45-3= Variable propos&eacute; (montant d'augmentation)

msscr.ID46-3= Variable propos&eacute; (% d'augmentation)

msscr.ID47-3= Variable recommand&eacute; (montant total)

msscr.ID48-3= Variable recommand&eacute; (% fixe)

msscr.ID49-3= Variable recommand&eacute; (montant d'augmentation)

msscr.ID50-3= Variable recommand&eacute; (% d'augmentation)

msscr.ID51-3=  Totaux

msscr.ID52-3=  Augmentation totale recommand&eacute;e

msscr.ID53-3=  Diff&eacute;rentiel

msscr.ID54-3=  Pourcentage de variation

msscr.ID55-3= Processus d'&eacute;valuation

msscr.Info39-3= Ce bloc contient l'ensemble des informations n&eacute;cessaires &agrave; la r&eacute;vision des plans de r&eacute;mun&eacute;ration variable s&eacute;lectionn&eacute;s pour le collaborateur. Un bloc de donn&eacute;es existe pour chaque plan. Au d&eacute;part, chaque plan est identifi&eacute; &agrave; l'aide de son libell&eacute;, de son montant actuel et du pourcentage d'augmentation correspondant &agrave; sa derni&egrave;re r&eacute;vision. Ces deux derni&egrave;res valeurs sont montr&eacute;es &agrave; l'&eacute;cran lorsqu'elles sont disponibles. En effet, il est possible qu'aucune r&eacute;vision ant&eacute;rieure n'ait eu lieu pour le collaborateur en cours dans le plan concern&eacute;. Dans le cas contraire, un commentaire vous informant de cette circonstance est activ&eacute;. Les champs contenus dans le bloc de donn&eacute;es sont&nbsp;:

msscr.Info40-3= Ce montant est exprim&eacute; dans la devise du collaborateur. Il repr&eacute;sente le montant mon&eacute;taire propos&eacute; comme augmentation de r&eacute;mun&eacute;ration pour le collaborateur objet de l'analyse, &agrave; l'int&eacute;rieur du plan de r&eacute;mun&eacute;ration correspondant. Il est calcul&eacute; par application des pourcentages d'augmentation recommand&eacute;s selon la m&eacute;thodologie associ&eacute;e au plan de r&eacute;mun&eacute;ration de base du collaborateur.

msscr.Info41-3= Le montant correspondant &agrave; ce plan repr&eacute;sente un pourcentage de la r&eacute;mun&eacute;ration fixe du collaborateur. Cette colonne montre le pourcentage que repr&eacute;sente la r&eacute;mun&eacute;ration pour le plan de r&eacute;mun&eacute;ration objet de l'analyse dans la r&eacute;mun&eacute;ration du collaborateur.

msscr.Info42-3= Ce champ stocke un montant mon&eacute;taire exprim&eacute; dans la devise du collaborateur. Ce champ permet d'afficher le montant d'augmentation pour ce plan de r&eacute;mun&eacute;ration, par rapport &agrave; la derni&egrave;re r&eacute;vision du plan et pour le collaborateur objet de la r&eacute;vision.

msscr.Info43-3= Ce champ stocke le pourcentage d'augmentation par rapport &agrave; la derni&egrave;re r&eacute;vision effectu&eacute;e pour ce collaborateur dans le plan de r&eacute;mun&eacute;ration objet de l'analyse.

msscr.Info44-3= Ce champ est &eacute;ditable ou bien recalcul&eacute; en fonction des donn&eacute;es saisies par le responsable. Il doit &ecirc;tre renseign&eacute; &agrave; l'aide d'un montant mon&eacute;taire exprim&eacute; dans la devise du collaborateur (indiqu&eacute;e). Le responsable peut indiquer dans ce champ la valeur correspondant &agrave; la nouvelle r&eacute;mun&eacute;ration, pour le collaborateur objet de la r&eacute;vision. Le montant indiqu&eacute; dans ce champ est consid&eacute;r&eacute; comme r&eacute;mun&eacute;ration totale (correspondant au plan de r&eacute;mun&eacute;ration objet de l'analyse).

msscr.Info45-3= Ce champ est &eacute;ditable ou bien recalcul&eacute; en fonction des donn&eacute;es saisies par le responsable. Le responsable peut affecter, directement, un pourcentage de la r&eacute;mun&eacute;ration de base afin de fixer la nouvelle r&eacute;mun&eacute;ration correspondant au plan de r&eacute;mun&eacute;ration objet de l'analyse. Lorsque le responsable indique un pourcentage dans cette colonne, les autres champs de la ligne sont automatiquement recalcul&eacute;s en fonction du nouveau pourcentage.

msscr.Info46-3= Ce champ est &eacute;ditable ou bien recalcul&eacute; en fonction des donn&eacute;es saisies par le responsable. Le responsable peut affecter, directement, un montant d'augmentation exprim&eacute; dans la devise du collaborateur (indiqu&eacute;e). Ce montant est calcul&eacute; par rapport &agrave; la r&eacute;mun&eacute;ration actuelle correspondant au plan de r&eacute;mun&eacute;ration objet de l'analyse. Lorsque le responsable indique un montant mon&eacute;taire dans cette colonne, les autres champs de la ligne sont automatiquement recalcul&eacute;s en fonction du nouveau montant.

msscr.Info47-3= Ce champ est &eacute;ditable ou bien recalcul&eacute; en fonction des donn&eacute;es saisies par le responsable. Le responsable peut affecter, directement, un pourcentage d'augmentation par rapport &agrave; la derni&egrave;re r&eacute;vision ou &agrave; la valeur actuelle pour le plan, afin de fixer la nouvelle r&eacute;mun&eacute;ration correspondant au plan de r&eacute;mun&eacute;ration objet de l'analyse. Lorsque le responsable indique un pourcentage dans cette colonne, les autres champs de la ligne sont automatiquement recalcul&eacute;s en fonction du nouveau pourcentage. <b>Note importante&nbsp;:</b> Les plans de r&eacute;mun&eacute;ration en cours de r&eacute;vision dont la m&eacute;thodologie d'augmentation n'est pas r&eacute;gie par des r&egrave;gles prenant l'&eacute;valuation de performance en compte ignoreront cette donn&eacute;e &egrave; l'heure de proposer une augmentation.

msscr.Info48-3= Dans cette section des donn&eacute;es mon&eacute;taires et des pourcentages sont saisis et / ou calcul&eacute;s. Ils r&eacute;sultent des indications du responsable lors de la r&eacute;vision des plans de r&eacute;mun&eacute;ration pour le collaborateur. Toutes les donn&eacute;es de tous les plans de r&eacute;mun&eacute;ration r&eacute;vis&eacute;s pour le collaborateur y sont regroup&eacute;es. Les champs compris dans ce bloc sont d&eacute;crits ci-apr&egrave;s.

msscr.Info49-3= Cette colonne contient la somme des montants mon&eacute;taires d'augmentation proposeacute;s par le responsable. Chacun des plans contient, dans l'une des cases d&eacute;crites plus haut, le montant final de l'augmentation correspondant &agrave; ce plan de r&eacute;mun&eacute;ration. Cette colonne totalise l'ensemble des montants partiels de mani&egrave;re &agrave; fournir une information agr&eacute;g&eacute;e, r&eacute;sultant de la somme de chacun des plans de r&eacute;mun&eacute;ration.

msscr.Info50-3= Cette colonne stocke un montant mon&eacute;taire exprim&eacute; dans la devise du collaborateur mais, au lieu de contenir la somme des augmentations recommand&eacute;es par le responsable, elle comprend la somme des augmentations propos&eacute;es par la m&eacute;thodologie correspondant &egrave; chaque plan de r&eacute;mun&eacute;ration r&eacute;vis&eacute; pour le collaborateur objet de l'analyse.

msscr.Info51-3= Cette colonne contient un montant mon&eacute;taire exprim&eacute; dans la devise du collaborateur, r&eacute;sultant de la diff&eacute;rence entre le montant total propos&eacute; par les m&eacute;thodologies d'augmentation et le montant total recommand&eacute; par le responsable. Il s'agit d'une valeur indicative qui permet de conna&icirc;tre l'&eacute;cart entre les augmentations totales propos&eacute;es par le responsable et par les m&eacute;thodologies d'augmentation.

msscr.Info52-3= Cette colonne exprime, sous forme de pourcentage, l'&eacute;cart existant entre le montant total d'augmentation recommand&eacute; par le responsable et celui propos&eacute; par les m&eacute;thodologies d'augmentation.

msscr.Info53-3= Cliquez sur ce bouton pour revenir &agrave; la page pr&eacute;c&eacute;dente vous permettant de s&eacute;lectionner les plans de r&eacute;mun&eacute;ration que vous souhaitez r&eacute;viser pour ce collaborateur. Utilisez-le lorsque vous souhaitez modifier votre s&eacute;lection de plans de r&eacute;mun&eacute;ration. Toute action r&eacute;alis&eacute;e dans cet &eacute;cran sera perdue.

msscr.Info54-3= Cliquez sur ce bouton pour vous rendre &agrave; la page suivante. L'&eacute;cran suivant peut diff&eacute;rer en fonction du stade dans lequel vous vous trouvez &agrave; l'int&eacute;rieur du processus d'ex&eacute;cution. Il peut correspondre &agrave;&nbsp;:<br><b>1.- </b>L'&eacute;cran permettant de r&eacute;viser le collaborateur suivant, &agrave; condition qu'il reste un collaborateur &agrave; r&eacute;viser.<br><b>2.- </b>L'&eacute;cran r&eacute;sum&eacute; de toutes les r&eacute;visions effectu&eacute;es jusqu'&agrave; pr&eacute;sent, lorsque des r&eacute;visions ont &eacute;t&eacute; effectu&eacute;es pour un ou plusieurs collaborateurs (y compris le collaborateur en cours). <br><b>3.- </b>L'&eacute;cran contenant la liste des collaborateurs appartenant &agrave; l'unit&eacute; de travail en cours de r&eacute;vision, &agrave; condition qu'aucun collaborateur n'ait encore &eacute;t&eacute; r&eacute;vis&eacute;.

msscr.Info55-3= Cet &eacute;cran affiche, sous forme de r&eacute;sum&eacute;, toutes les d&eacute;cisions prises lors du processus de r&eacute;vision pour tous les collaborateurs r&eacute;vis&eacute;s. Vous pouvez v&eacute;rifier dans cet &eacute;cran, pour chaque collaborateur, l'augmentation totale correspondant &agrave; sa r&eacute;mun&eacute;ration fixe et &agrave; sa r&eacute;mun&eacute;ration variable. Il vous permet &eacute;galement de s&eacute;lectionner, parmi tous les collaborateurs r&eacute;vis&eacute;s, ceux pour qui vous souhaitez envoyer vos recommandations d'augmentation au d&eacute;partement des RH, pour validation et approbation.

msscr.Info56-3 = Cette colonne contient les nom et pr&eacute;nom des collaborateurs pour lesquels le processus de r&eacute;vision est achev&eacute;.

msscr.Info57-3 = Cette colonne pr&eacute;sente le niveau de performance enregistr&eacute; pour chaque collaborateur, lorsqu'il existe. Le niveau de performance est indiqu&eacute; dans le cas des collaborateurs r&eacute;vis&eacute;s pour des plans de r&eacute;mun&eacute;ration utilisant cette donn&eacute;e pour les augmentations propos&eacute;es (plans dont la m&eacute;thodologie d'augmentation associ&eacute;e n'est pas budg&eacute;taire). Le niveau de performance appara&icirc;t &agrave; chaque fois que cette donn&eacute;e s'est av&eacute;r&eacute;e n&eacute;cessaire, dans des &eacute;crans pr&eacute;c&eacute;dents, &agrave; la r&agrave;vision de plans de r&agrave;mun&agrave;ration du collaborateur.

msscr.Info58-3 = Cette colonne montre deux valeurs&nbsp;: la r&eacute;mun&eacute;ration fixe du collaborateur propos&eacute;e par la m&eacute;thodologie d'augmentation correspondante et celle recommand&eacute;e par le responsable. Elle permet de visualiser, de fa&ccedil;on simple et avant de transmettre les donn&eacute;es au d&eacute;partement des RH, les &eacute;carts entre les valeurs propos&eacute;es et les valeurs recommand&eacute;es.

msscr.Info59-3 = Cette colonne montre deux valeurs&nbsp;: la r&eacute;mun&eacute;ration variable du collaborateur propos&eacute;e par la m&eacute;thodologie d'augmentation correspondante et celle recommand&eacute;e par le responsable. Elle permet de visualiser, de fa&ccedil;on simple et avant de transmettre les donn&eacute;es au d&eacute;partement des RH, les &eacute;carts entre les valeurs propos&eacute;es et les valeurs recommand&eacute;es.

msscr.Info60-3 = Cette colonne montre deux valeurs&nbsp;: la r&eacute;mun&eacute;ration totale (fixe &#43; variable) du collaborateur propos&eacute;e par les m&eacute;thodologies d'augmentation correspondantes et celle recommand&eacute;e par le responsable.

msscr.Info61-3 = Cette colonne vous rappelle quelle est la position actuelle de la r&eacute;mun&eacute;ration du collaborateur &agrave; l'int&eacute;rieur de l'amplitude de r&eacute;mun&eacute;ration correspondant &agrave; l'&eacute;chelon / la fourchette / la zone d'appartenance du collaborateur. Rappelez-vous que le ratio comparatif repr&eacute;sente la position &agrave; l'int&eacute;rieur d'une amplitude de r&eacute;mun&eacute;ration, pour un point moyen correspondant &agrave; 100%.

msscr.Info62-3 = Cette colonne vous permet de s&eacute;lectionner les collaborateurs pour qui vous souhaitez envoyer vos recommandations d'augmentation (et les donn&eacute;es de r&eacute;vision correspondantes) au d&eacute;partement des RH. Les recommandations relatives aux collaborateurs non s&eacute;lectionn&eacute;s ne seront pas envoy&eacute;es et les r&eacute;visions correspondantes seront perdues.

msscr.Info63-3 = Ce bouton permet d'envoyer au d&eacute;partement des RH les recommandations d'augmentation pour tous les collaborateurs s&eacute;lectionn&eacute;s, ainsi que les donn&eacute;es de r&eacute;vision correspondantes.)

msscr.Info64-3 = FIXE

msscr.Info65-3 = Cet &eacute;cran affiche l'&eacute;tat des demandes d'augmentation transmises au d&eacute;partement des RH. Pour chaque collaborateur pour qui une demande a &eacute;t&eacute; envoy&eacute;e, appara&icirc;t un bloc contenant des informations sur chaque r&eacute;vision effectu&eacute;e dans chaque plan de r&eacute;mun&eacute;ration. Une r&eacutevision peut se trouver dans trois &eacutetats possibles&nbsp;: <br/>1.- <b>En attente&nbsp;:<b/> le d&eacute;partement des RH n'a pas pris de d&eacute;cision concernant la r&eacute;vision.<br/>2.-<b>Accept&eacute;e&nbsp;:<b/> le d&eacute;partement des RH a accept&eacute; la recommandation formul&eacute;e par le responsable quant &agrave; la r&eacute;vision de la r&eacute;mun&eacute;ration du collaborateur, pour un plan de r&eacute;mun&eacute;ration donn&eacute;. <br/>3.-<b>Rejet&eacute;e&nbsp;:<b/> le d&eacute;partement des RH a rejet&eacute; la recommandation formul&eacute;e par le responsable quant &agrave; la r&eacute;vision de la r&eacute;mun&eacute;ration du collaborateur, pour un plan de r&eacute;mun&eacute;ration donn&eacute;.

msscr.Info66-3 = Cette colonne pr&eacute;sente des informations relatives au collaborateur. Chaque bloc qui appara&icirc;t &agrave; l'&eacute;cran correspond &agrave; une recommandation transmise au d&eacute;partement des RH pour un collaborateur. Le nom, le pr&eacute;nom et le libell&eacute; du r&ocirc;le du collaborateur sont indiqu&eacute;s dans la colonne.

msscr.Info67-3 = Cette colonne contient des informations (libell&eacute; et type) relatives &agrave; chacun des plans de r&eacute;mun&eacute;ration affich&eacute;s pour le collaborateur.

msscr.Info68-3 = Cette colonne contient un montant mon&eacute;taire exprim&eacute; dans la devise du collaborateur. Ce montant correspond &agrave; la valeur totale de l'augmentation recommand&eacute;e par le responsable pour le plan de r&eacute;mun&eacute;ration en cours.

msscr.Info69-3 = Cette colonne contient un montant mon&eacute;taire exprim&eacute; dans la devise du collaborateur. Ce montant correspond &agrave; la valeur totale pr&eacute;c&eacute;dente qui correspondait au collaborateur pour le plan de r&eacute;mun&eacute;ration en cours.

msscr.Info70-3 = Cette colonne contient un montant mon&eacute;taire exprim&eacute; dans la devise du collaborateur. Ce montant correspond &agrave; la diff&eacute;rence entre les deux colonnes pr&eacute;c&eacute;dentes, c'est-&agrave;-dire &agrave; la valeur r&eacute;elle de l'augmentation recommand&eacute;e par le responsable, calcul&eacute;e par diff&eacute;rence entre le montant total recommand&eacute; et le montant ant&eacute;rieur &agrave; la r&eacute;vision.

msscr.Info71-3 = Cette colonne contient la m&ecirc;me valeur que la colonne pr&eacute;c&eacute;dente, exprim&eacute;e en pourcentage.

msscr.Info72-3 = Ce lien permet d'acc&eacute;der &agrave; un &eacute;cran qui affiche tous les messages g&eacute;n&eacute;r&eacute;s lors du processus de r&eacute;vision. Les messages peuvent provenir de deux sources diff&eacute;rentes agissant de mani&egrave;re interactive&nbsp;: de la part du responsable s'adressant au d&eacute;partement des RH (notes explicatives de ses recommandations) et de la part du d&eacute;partement des RH r&eacute;pondant au responsable ou motivant ses d&eacute;cisions.

msscr.Info73-3= Cet &eacute;tat permet de g&eacute;n&eacute;rer les r&eacute;sultats globaux des processus de r&eacute;vision approuv&eacute;s. Les donn&eacute;es pr&eacute;sent&eacute;es dans l'&eacute;tat appartiennent aux processus de r&eacute;vision effectu&eacute;s au cours de la p&eacute;riode comprise entre les dates s&eacute;lectionn&eacute;es. Aucun filtre n'est obligatoire&nbsp;: lorsqu'aucun crit&egrave;re de s&eacute;lection n'est pr&eacute;cis&eacute;, l'&eacute;tat pr&eacute;sente alors l'ensemble des donn&eacute;es disponibles.

msscr.Info74-3= Date de fin

msscr.Info75-3= Date de d&eacute;but du plan

msscr.Info76-3= Date de fin du plan

msscr.Info77-3= Ce filtre permet de s&eacute;lectionner dans une liste le format de date pour les dates de d&eacute;but et de fin du plan de r&eacute;mun&eacute;ration.

msscr.Info78-3= Cette colonne permet de s&eacute;lectionner le format de l'&eacute;tat qui sera g&eacute;n&eacute;r&eacute; pour le plan de r&eacute;mun&eacute;ration.

msscr.Info79-3= Cet &eacute;tat permet d'analyser les r&eacute;sultats globaux des processus de r&eacute;vision approuv&eacute;s.<br> <b>Groupes</b><br>Les donn&eacute;es sont pr&eacute;sent&eacute;es selon l'ordre et les trois niveaux de regroupement suivants&nbsp;:<br> * Plan de r&eacute;mun&eacute;ration<br> * Unit&eacute; de travail<br> * Responsable de la r&eacute;vision<br> <b>Totaux</b><br> De la m&ecirc;me mani&egrave;re, les r&eacute;sultats pr&eacute;sent&eacute;es sont totalis&eacute;s par&nbsp;: * Responsable de la r&eacute;vision<br> * Unit&eacute; de travail<br>* Plan de r&eacute;mun&eacute;ration<br> * Total &eacute;tat (en euros)<br> <b>En-t&ecirc;te</b><br> Les informations figurant dans l'en-t&ecirc;te pr&eacute;sentent en outre le type de m&eacute;thodologie et la table d'augmentation associ&eacute;s &agrave; chaque plan.<br> <b>Filtres d'ex&eacute;cution</b><br> Avant ex&eacute;cution de l'&eacute;tat, vous pouvez d&eacute;finir un filtre &agrave; l'aide des conditions suivantes&nbsp;:<br> * Date de r&eacute;vision. Les donn&eacute;es pr&eacute;sent&eacute;es dans l'&eacute;tat correspondent aux r&eacute;visions effectu&eacute;es au cours de la p&eacute;riode comprise entre les dates s&eacute;lectionn&eacute;es.<br> * Date de d&eacute;but / Date de fin du plan.<br> * Responsable de la r&eacute;vision<br> * Unit&eacute; de travail<br> * Devise (euro par d&eacute;faut)<br> <b>Colonnes de l'&eacute;tat</b><br> * Code de la ressource<br> * Nom de la ressource<br> * R&eacute;mun&eacute;ration pr&eacute;c&eacute;dente<br> * R&eacute;mun&eacute;ration r&eacute;vis&eacute;e (nouvelle r&eacute;mun&eacute;ration approuv&eacute;e)<br> * % d'augmentation<br> * % m&eacute;thodologie (augmentation moyenne propos&eacute;e dans le plan de r&eacute;mun&eacute;ration)

msscr.Info80-3= Cette liste de valeurs possibles pr&eacute;sente le code et le nom des collaborateurs pour lesquels vous &ecirc;tes en train de consulter l'&eacute;tat actuel de vos demandes. Cette liste permet de s&eacute;lectionner un collaborateur comme filtre. Aussi, lorsque vous s&eacute;lectionnez un collaborateur dans la liste et que vous cliquez sur le bouton de filtre, seul l'&eacute;tat des r&eacute;visions correspondant au collaborateur s&eacute;lectionn&eacute; est affich&eacute; &agrave; l'&eacute;cran. Cliquez sur le bouton de suppression du filtre pour revenir &agrave; l'affichage de la liste compl&egrave;te de l'&eacute;tat de vos r&eacute;visions.

