msscr.Resumen-14= R&eacute;sum&eacute; de la r&eacute;vision de la r&eacute;mun&eacute;ration de vos collaborateurs&nbsp;: Dans cet &eacute;cran, vous marquez, pour transmission au d&eacute;partement des RH, les r&eacute;visions effectu&eacute;es jusqu'&agrave; pr&eacute;sent que vous consid&eacute;rez valides. &Agrave; ce stade, vous ne pouvez revenir &agrave; aucune des phases ant&eacute;rieures du processus car cela supposerait perdre les donn&eacute;es des r&eacute;visions effectu&eacute;es jusqu'&agrave; pr&eacute;sent. Si toutefois vous souhaitiez modifier certaines r&eacute;visions effectu&eacute;es, vous devriez d&eacute;buter &agrave; nouveau le processus pour celles-ci tout en envoyant les autres r&eacute;visions que vous jugez correctes.

