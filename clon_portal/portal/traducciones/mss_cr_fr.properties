msscr.Info3_bis = Analysez les collaborateurs dont vous, personnellement ou par d&eacute;l&eacute;gation, avez r&eacute;vis&eacute; la r&eacute;mun&eacute;ration. Vous pouvez consulter les donn&eacute;es totalis&eacute;es par plan de r&eacute;mun&eacute;ration et regroup&eacute;es pour chacune des unit&eacute;s de travail sous votre responsabilit&eacute;.

