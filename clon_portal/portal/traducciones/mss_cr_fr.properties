msscr.Info1= Ici, vous proc&eacute;dez &agrave; la r&eacute;vision de la r&eacute;mun&eacute;ration de vos collaborateurs lorsque vous &ecirc;tes responsable de celle-ci. Vous pouvez afficher l'ensemble des plans de r&eacute;mun&eacute;ration de chaque collaborateur, puis s&eacute;lectionner ceux que vous souhaitez r&eacute;viser. Le syst&egrave;me vous informe &eacute;galement de l'&eacute;tat d'approbation des augmentations recommand&eacute;es par vous et trait&eacute;es &agrave; votre demande par le d&eacute;partement des RH.

