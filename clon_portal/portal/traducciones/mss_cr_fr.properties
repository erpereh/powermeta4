msscr.Confirm_ad16a= Retourner &agrave; la liste des plans de r&eacute;mun&eacute;ration

msscr.Info1-4= Cette fonctionnalit&eacute; permet de r&eacute;viser les r&eacute;mun&eacute;rations une &agrave; une (i.e. collaborateur &agrave; collaborateur), directement en connectant &agrave; l'application.
msscr.Info1-5= Cette fonctionnalit&eacute; permet de r&eacute;viser toutes les r&eacute;mun&eacute;rations (i.e. de tous les collaborateurs), au moyen d'une feuille de calcul &eacute;vitant, dans un premier temps, d'avoir &agrave; se connecter &agrave; l'application.

msscr.Info8m-1 = Cette fen&ecirc;tre pr&eacute;sente la liste des plans de r&eacute;mun&eacute;ration associ&eacute;s &agrave; l'unit&eacute; de travail s&eacute;lectionn&eacute;e. Pour chaque plan de r&eacute;mun&eacute;ration, vous pouvez exporter les donn&eacute;es salariales des collaborateurs vers une feuille de calcul qui vous permettra de proc&eacute;der &agrave; la r&eacute;vision, puis de r&eacute;exporter en masse dans le syst&egrave;me les donn&eacute;es r&eacute;vis&eacute;es et actualis&eacute;es. Les salari&eacute;s de l'unit&eacute; de travail dont la r&eacute;vision ne peut pas &ecirc;tre effectu&eacute;e sont list&eacute;s, le cas &eacute;ch&eacute;ant, au-devant de la liste des plans de r&eacute;mun&eacute;ration.
msscr.Info8m-2 = Cette fonctionnalit&eacute; permet d'afficher la liste des collaborateurs qui appartiennent &agrave; l'unit&eacute; de travail s&eacute;lectionn&eacute;e. Chaque &eacute;l&eacute;ment de la liste est compos&eacute; du code et du nom du collaborateur. Il constitue en outre un lien permettant de prendre connaissance des r&eacute;visions successives de la r&eacute;mun&eacute;ration du collaborateur. Cliquez sur le lien pour ouvrir une fen&ecirc;tre pr&eacute;sentant l'ensemble des r&eacute;visions de la r&eacute;mun&eacute;ration du collaborateur, approuv&eacute;es &agrave; ce jour pour chacun de ses plans de r&eacute;mun&eacute;ration.
msscr.Info8m-3 = Une fois s&eacute;lectionn&eacute;e l'unit&eacute; de travail que vous souhaitez r&eacute;viser, le processus affiche l'ensemble des plans de r&eacute;mun&eacute;ration &agrave; r&eacute;viser dans l'unit&eacute;. Toutefois, il peut arriver que certains salari&eacute;s de l'unit&eacute; de travail ne puissent pas &ecirc;tre r&eacute;vis&eacute;s pour une raison donn&eacute;e. Dans ces cas-l&agrave;, si, lors du processus de chargement des collaborateurs, des incoh&eacute;rences ou encore l'absence de donn&eacute;es n&eacute;cessaires &agrave; la r&eacute;vision ont &eacute;t&eacute; d&eacute;tect&eacute;es, un point d'exclamation appara&icirc;t. Cliquer sur celui-ci permet de conna&icirc;tre le motif pour lequel le collaborateur ne peut pas &ecirc;tre vis&eacute;. Parmi les motifs possibles, citons&nbsp;:<br>1.- Le collaborateur n'a pas un type de r&eacute;mun&eacute;ration appropri&eacute;.<br>2.- Aucune devise n'est associ&eacute;e au collaborateur.<br>3.- Aucune structure de r&eacute;mun&eacute;ration n'est associ&eacute;e au collaborateur.<br>4.- Aucun plan de r&eacute;mun&eacute;ration de base n'est associ&eacute; au collaborateur.
msscr.Info8m-4 = Cet &eacute;l&eacute;ment affiche le libell&eacute; du r&ocirc;le occup&eacute; par chaque collaborateur au sein de l'unit&eacute; de travail s&eacute;lectionn&eacute;e. Dans les cas o&ugrave; le libell&eacute; n'est pas disponible, la valeur &quot;&nbsp;Non disponible&nbsp;&quot; appara&icirc;t &agrave; sa place.
msscr.Info8m-5 = Cette zone affiche le code et le libell&eacute; du r&ocirc;le occup&eacute; par chaque collaborateur au sein de l'unit&eacute; de travail. Dans les cas o&ugrave; le libell&eacute; de l'emploi n'est pas disponible, le message &quot;&nbsp;Non disponible&nbsp;&quot; appara&icirc;t.
msscr.Info8m-6 = Cette partie affiche le code de l'&eacute;chelon/la fourchette/la zone de r&eacute;mun&eacute;ration de chaque collaborateur &agrave; l'int&eacute;rieur de sa structure de r&eacute;mun&eacute;ration. La structure de r&eacute;mun&eacute;ration est d&eacute;termin&eacute;e en fonction de l'entit&eacute; juridique &agrave; laquelle le collaborateur appartient et du groupe d'emplois auquel l'emploi du collaborateur appartient. Ensuite, &agrave; l'int&eacute;rieur de la structure de r&eacute;mun&eacute;ration, l'&eacute;chelon/fourchette/zone correspondant est d&eacute;termin&eacute; en fonction de l'emploi occup&eacute; par le collaborateur au sein de l'unit&eacute; de travail s&eacute;lectionn&eacute;e.
msscr.Info8m-7 = Pour chaque collaborateur, sont affich&eacute;es la valeur et la devise correspondant &agrave; la derni&egrave;re r&eacute;vision de r&eacute;mun&eacute;ration Dans les cas o&ugrave; la r&eacute;vision a lieu pour la premi&egrave;re fois, cette valeur n'est pas disponible. Dans les cas o&ugrave; la r&eacute;vision se trouve en attente d'approbation de la part du d&eacute;partement des RH, le message &quot;&nbsp;En attente d'approbation&nbsp;&quot; appara&icirc;t.
msscr.Info8m-8 = Liste des groupes de plans de r&eacute;mun&eacute;ration associ&eacute;s &agrave; l'unit&eacute; de travail s&eacute;lectionn&eacute;e. Chaque groupe est pr&eacute;sent&eacute; sur une ligne. Les plans variables d&eacute;pendant d'autres plans de r&eacute;mun&eacute;ration sont int&eacute;gr&eacute;s &agrave; la ligne du plan principal. Chaque groupe peut donc &ecirc;tre constitu&eacute; par&nbsp;: un plan de base avec tous les plans variables d&eacute;pendant de lui&nbsp;; un plan de base seul (sans plans variables d&eacute;pendants)&nbsp;; un plan variable seul (non d&eacute;pendant d'un plan de base).
msscr.Info8m-9 = En cliquant sur ce bouton, vous g&eacute;n&eacute;rez, pour chaque groupe de plans de r&eacute;mun&eacute;ration, un fichier Excel contenant tous les salari&eacute;s concern&eacute;s par le groupe. Dans la feuille Excel, vous disposez, pour chaque collaborateur, des informations suivantes pour vous aider dans votre r&eacute;vision&nbsp;: derni&egrave;re r&eacute;vision individuelle, augmentation propos&eacute;e, augmentation recommand&eacute;e, etc.<br>Indiquez, dans la colonne R&eacute;vision, le montant de l'augmentation. La nouvelle r&eacute;mun&eacute;ration est alors automatiquement calcul&eacute;e, ainsi que les champs regroup&eacute;s sous Augmentation recommand&eacute;e et les totaux correspondant au plan (r&eacute;mun&eacute;ration actuelle totale, r&eacute;mun&eacute;ration totale après r&eacute;vision, augmentation totale).<br>Lorsque le groupe comporte plusieurs plans, la feuille pr&eacute;sente les salari&eacute;s pour chacun des plans correspondants.<br>Lorsque vous avez termin&eacute; toutes les r&eacute;visions, vous pouvez enregistrer les donn&eacute;es, puis importer dans l'application les nouvelles donn&eacute;es correspondant &agrave; vos r&eacute;visions.
msscr.Info8m-10 = Ce bouton vous permet de transf&eacute;rer de mani&egrave;re automatique vos r&eacute;visions depuis la feuille de calcul vers l'application. Le syst&egrave;me v&eacute;rifie la coh&eacute;rence des donn&eacute;es renvoy&eacute;es avec le plan de r&eacute;mun&eacute;ration que vous avec choisi de r&eacute;viser. En cas d'erreur, un message vous avertit.<br>La page R&eacute;visez la r&eacute;mun&eacute;ration de vos collaborateurs vous pr&eacute;sente un r&eacute;sum&eacute; de toutes les r&eacute;visions compl&egrave;tes, vous permettant d'envoyer &agrave; votre d&eacute;partement RH les r&eacute;visions effectu&eacute;es &agrave; ce jour que vous consid&eacute;rez valides.
msscr.Info8m-11 = Cliquez sur ce bouton pour revenir &agrave; la page pr&eacute;c&eacute;dente qui affiche la liste des unit&eacute;s de travail dont vous &ecirc;tes le responsable (direct ou par d&eacute;l&eacute;gation) de r&eacute;vision de r&eacute;mun&eacute;ration.


