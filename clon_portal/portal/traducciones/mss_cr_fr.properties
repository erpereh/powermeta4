msscr.Mens-11= Message d'information

msscr.Aviso-11= La valeur r&eacute;elle pr&eacute;c&eacute;dente de ce plan n'est pas disponible&nbsp;: vous ne pouvez donc pas lui appliquer un montant ni un pourcentage d'augmentation. Dans ce cas, toute augmentation indiqu&eacute;e sera consid&eacute;r&eacute;e comme valeur totale. Les pourcentages associ&eacute;s ne pourront &ecirc;tre affich&eacute;s que si les valeurs de rémunération de base actuelle et pr&eacute;c&eacute;dente (r&eacute;elle) pour le plan sont disponibles. Dans le cas contraire, ces donn&eacute;es ne seront pas affich&eacute;es.

msscr.Aviso2-11= Tous les plans de r&eacute;mun&eacute;ration s&eacute;lectionn&eacute;s &agrave; un m&ecirc;me moment pour &ecirc;tre r&eacute;vis&eacute;s auront la m&ecirc;me p&eacute;riode d'effet. Rappelez-vous en &agrave; l'heure d'indiquer la p&eacute;riode d'effet de la r&eacute;vision. Par d&eacute;faut, la p&eacute;riode d'effet correspond &agrave; une ann&eacute;e naturelle &agrave; compter d'aujourd'hui. Modifiez-la si vous le souhaitez.

msscr.Aviso3-11= Le plan de r&eacute;mun&eacute;ration ne peut pas &ecirc;tre r&eacute;vis&eacute;. Consultez le message qui appara&icirc;t au-dessous de la liste des plans de r&eacute;mun&eacute;ration du collaborateur afin d'en savoir plus sur le plan et sur les raisons pour lesquelles il ne peut pas &ecirc;tre r&eacute;vis&eacute;.

msscr.Aviso4-11= Les plans de r&eacute;mun&eacute;ration suivants ne peuvent pas &ecirc;tre r&eacute;vis&eacute;s pour le collaborateur s&eacute;lectionn&eacute; car ce dernier ne remplit pas toutes les conditions du plan. Consultez l'information suivante afin d'en savoir plus.

msscr.Aviso5-11= La base de r&eacute;mun&eacute;ration dans laquelle les montants de la structure de r&eacute;mun&eacute;ration sont exprim&eacute;s est diff&eacute;rente du type de r&eacute;mun&eacute;ration du collaborateur. Les donn&eacute;es n&eacute;cessaires &agrave; la conversion des valeurs de la r&eacute;mun&eacute;ration du collaborateur dans la base de r&eacute;mun&eacute;ration de la structure de r&eacute;mun&eacute;ration n'ont pas &eacute;t&eacute; trouv&eacute;es. Pour cette raison, le ratio comparatif et la position du collaborateur &agrave; l'int&eacute;rieur de l'&eacute;chelon auquel il appartient ne peuvent pas &ecirc;tre calcul&eacute;s.

