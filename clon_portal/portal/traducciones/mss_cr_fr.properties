msscr.Link12= Unit&eacute;s de travail autoris&eacute;es

msscr.Info1-12= Cochez la cases correspondant aux unit&eacute;s de travail avec lesquelles vous souhaitez travailler. Changer de type de responsabilit&eacute; peut entra&icirc;ner une alt&eacute;ration de votre s&eacute;lection, c'est-&agrave;-dire de votre population de travail.</br>Vous affichez la liste des membres d'une unit&eacute; en cliquant sur le code de celle-ci.</br>En cliquant sur son libell&eacute;, vous affichez les d&eacute;tails de l'unit&eacute;. Ces op&eacute;rations vous permettent d'afficher les collaborateurs et les responsables de chaque unit&eacute; de travail.</br>L'option de sélection récursive vous permet aussi de s&eacute;lectionner (ou d&eacute;s&eacute;lectionner) des unit&eacute;s de travail avec toutes leurs unit&eacute;s filles.<br>

