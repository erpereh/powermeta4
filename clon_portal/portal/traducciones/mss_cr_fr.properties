msscr.Info4= Examinez ici les r&eacute;sultats des r&eacute;visions qui d&eacute;pendent de vous. Cet &eacute;tat pr&eacute;sente tous les collaborateurs dont vous, personnellement ou par d&eacute;l&eacute;gation, avez r&eacute;vis&eacute; la r&eacute;mun&eacute;ration. Vous pouvez consulter les donn&eacute;es totalis&eacute;es par plan de r&eacute;mun&eacute;ration et regroup&eacute;es pour chacune des unit&eacute;s de travail sous votre responsabilit&eacute;.

