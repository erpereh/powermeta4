msscr.Info79-3= Use this report to analyse the overall results of the approved compensation review processes.<br> <b>Groups</b><br>The information is displayed at three grouping levels in the following order:<br> * Compensation Plan<br> * Work Unit<br> * Compensation Review Manager<br> <b>Totals</b><br> Likewise, the report results are totalled by: * Compensation Review Manager<br> * Work Unit<br>* Compensation Plan<br> * Report Total (in euros)<br> <b>Header</b><br> In addition to this information, the header data displays the increase method type and the increase table associated with each of the compensation plans.<br> <b>Runtime Filters</b><br> When running this report, the user can filter based on the following criteria:<br> * Review Date. The report data displayed belongs to the review processes done during the period defined by the selected dates.<br> * Compensation Plan Start Date / End Date.<br> * Compensation Review Manager<br> * Work Unit<br> * Currency (euro by default)<br> <b>Report Columns</b><br> * HR ID<br> * HR Name<br> * Previous Salary<br> * Revised Salary<br> * % Increase<br> * % Methodology (average increase proposed in the compensation plan)

