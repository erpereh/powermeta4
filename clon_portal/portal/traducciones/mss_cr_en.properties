msscr.Info1= Use this module to review the salaries of the employees for whom you are manager. You can view all of the compensation plans for each of your employees and select the ones you want to review. Likewise, you can get information on the status of the pay increases that you have recommended and that the HR Department processes by your request.

msscr.Titulo2= Review the Salary of Your Employees

msscr.Info2= Use this section to select the employees and compensation plans that you want to review, as well as to send your salary increase recommendations to the HR Department.

msscr.Link1= Review the Salary of Your Employees

msscr.Pop1= Review the Salary of Your Employees

msscr.Titulo3= Status of Your Salary Increase Recommendations

msscr.Info3= Use this section to check whether or not the HR Department has validated your salary increase recommendations. You will find a list of all the employees whose compensation plans you have reviewed and the recommendations you have made.

msscr.Info3_bis = Analyse the employees who have been reviewed by you or by any of your delegated review managers. You can view the information totalled by Compensation Plan and grouped by each of the Work Units that you manage.

msscr.Link2= Status of Your Salary Increase Recommendations

msscr.Pop2= Status of Your Salary Increase Recommendations

msscr.Titulo4= Analyse Your Salary Reviews

msscr.Titulo5= Use this module to review the compensation for your employees. To do so, select both the employees who you want to review and their corresponding compensation plans. Likewise, you can consult the decisions made by the HR Department regarding your most-recent salary increase recommendations.

msscr.Info4= Use this section to analyse the results of your salary reviews. This report lists all of the employees who have been reviewed by you or by any of your delegated review managers. You can view the information totalled by Compensation Plan and grouped by each of the Work Units that you manage.

msscr.Link4= Analyse Your Salary Reviews

msscr.Pop4= Analyse Your Salary Reviews

