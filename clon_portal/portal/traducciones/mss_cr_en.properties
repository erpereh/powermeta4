msscr.Info8m-1 = Use this window to view the list of compensation plans associated to the selected work unit. For each salary plan, you can export salary data from employees to the calculation sheet to proceed to the revision and later importing them to update massively data in the application If there are employees that belongs to a work unit whose revision can not be performed for several reasons, they are related before than the plan list.
msscr.Info8m-2 = Here you can view the list of employees who belong to the selected work unit. Each value on the list is made up of the ID and name of the employee. Each of these values represents a link that allows you to view the employee&#39;s salary review history. When you click the link, a small window is displayed with all of the salary reviews that the employee has had approved for each compensation plan.
msscr.Info8m-3 = Once you have selected the Work Unit that you want to review, the review process allows you to view all of the compensation plans you must review. However, it is possible that some of the employees that belong to the work unit cannot be reviewed for a number of reasons. If the employee load process detects any data inconsistency or that data required for the salary review process is missing, an exclamation mark is displayed. Click it to see the reason why the employee cannot be reviewed. Some of the reasons can be:<br/>1.- The employee does not have an adequate salary type that can be reviewed.<br/>2.- The employee does not have an process currency associated.<br/>3.- The employee does not have any salary structure assigned.<br/>4.- The employee does not have any base compensation plan associated.<br/>
msscr.Info8m-4 = This item indicates the name of the role of each employee in the selected work unit. The 'Unavailable' value indicates that this name is not available.
msscr.Info8m-5 = The ID and name of the job held by each employee in the work unit is displayed. If the name of the job is not available, this is indicated with the value 'Unavailable'.
msscr.Info8m-6 For each employee, the ID of the grade/band/zone within the salary structure to which they belong is displayed. The salary structure of the employee is determined by the country of the legal entity to which the employee belongs and by the job group to which the job of the employee belongs. Within this salary structure, the corresponding grade/band/zone is set based on the job held by the employee in the selected work unit.
msscr.Info8m-7 = For each employee, the value and the currency of the last FIXED salary review carried out. If this is the first time that the employee's salary is reviewed, the value will be unavailable. Additionally, if the review is pending approval by the HR Department, the 'Pending Approval' message is displayed.
msscr.Info8m-8 = List of compensation plan groups associated to the Work Unit with which you are working. One line is displayed by group, unifying those variable plans that depend on others (the plan linbe to which they depend on). It is, groups can be formed by: a base plan and all variable plans depending on it, a base salary plan without dependacies or a varable plan without dependance on any base plan.
msscr.Info8m-9 = Clicking in this button is generated, for each compensation plan group, a excell file with all employees affected by that group. The excel sheet shows for each employee information that will help you to make decisions on the salary revisions: last salary revision carried out to an employee, proposed incerase, recommended increase, etc.<br>Indicate the increase in the Revision column. The new salary is automatically calculated when reporting this data; fields grouped in Recommended Increase and and the plan totals (current salary total, salary total after revision, increase total).<br>If the plan group has several plans, in the calculation sheet are displayed the employees grouped in each one of the plans.<br>Once concluded all revisions you can save the data and then carry out the import the salary revisions to the applications.
msscr.Info8m-10 = Cliking thsi button you can automatically transfer the salary revisions carried out from the calculation sheet to the application. The application verifies the calculation sheet indicated contains all correct data of the compensation plan to review. If any mistake occurs, the application will warn you on this situation.<br>After the indication of the excel sheet containing the revisions,the application shows you the Employee Salary Revision page with the whole summary of reported revisions. You can send to HHRR those revisions performed until the momement you consider them valid.
msscr.Info8m-11 = Click this button to go back to the previous page, which contained the list of work units of which you are responsible (directly or delegated) for salary reviews.


