msscr.Titulo1-3= Salary Review Process

msscr.Auxiliar= Proposed Increase (Compa-Ratio)

msscr.help1-3= Help

msscr.Titulo2-3= General Description:

msscr.Info1-3= Click the Individual or Mass icon of the work unit with which you want to work.</br>Click the name of the work unit to view detailed information on it. The latter option also allows you to delegate salary review responsibility for the selected work unit.

msscr.Info2-3= Use this window to view the list of employees who belong to the selected work unit and whose ID is highlighted. You may select as many available employees as you wish for salary review.

msscr.Info3-3= Use this window to view the list of compensation plans for each of the selected employees. The windows included in the salary review process are repeated for each of the employees selected for review, but each time they display the information for the corresponding employee only. You can select the compensation plans that you want to review for each employee.

msscr.Info4-3= Use this window to carry out the salary review for all of the plans selected in the previous step for the employee currently displayed. The window consists of a series of data blocks. The first block contains the data required to review the BASE salary of the employee. If you selected one or more variable compensation plans in the previous step, a functional block is displayed with the data required to review each plan. Finally, the third block contains all of the information on the decisions that you have made in this window.

msscr.Tabla1-3= Item

msscr.Tabla2-3= Item Description

msscr.Tabla3-3= Item Type

msscr.Tabla4-3= Description

msscr.ID1-3= Work Unit ID

msscr.ID2-3= Link

msscr.ID2-4= Informational Message

msscr.Info5-3= This column displays all of the work units for which you are responsible for salary reviews. Note that the work units are related hierarchically. This relationship is represented visually in tree format. All of the work units for which you are directly responsible for salary reviews are shown, as are those that depend on them hierarchically and do not have a salary review manager associated with them directly. Likewise, when appropriate, the work unit list also displays the units for which the salary review responsibilities have been delegated to you (see the <b>Manager Type</b> item for more information).).<br>When clicking on the specific work unit a window opens with the following basic information: ID, name, type, and description of the work unit, and a list of all managers, of any type, assigned to the work unit. Use the list of managers to select one to whom to delegate the responsibility of reviewing the salaries of the employees in the work unit whose information you are viewing. This option is available if you are directly responsible for salary reviews in that work unit. If you are the person delegated, you cannot, in turn, delegate the responsibility to another person. Once you have selected the person to whom you want to delegate responsibility, click Continue to send an e-mail to this person informing him or her of the decision.

msscr.ID3-3= Work Unit Name

msscr.Info6-3= Click the name of a specific work unit to open a window with the following basic information: ID, name, type, and description of the work unit, and a list of all managers, of any type, assigned to the work unit. Use the list of managers to select one to whom to delegate the responsibility of reviewing the salaries of the employees in the work unit whose information you are viewing. This option is available if you are directly responsible for salary reviews in that work unit. If you are the person delegated, you cannot, in turn, delegate the responsibility to another person. Once you have selected the person to whom you want to delegate responsibility, click Continue to send an e-mail to this person informing him or her of the decision.

msscr.ID4-3= Manager Type

msscr.ID5-3= Value List

msscr.Info7-3= The type of manager that you are for salary review purposes is indicated beside each of the work units on the list. The two possible values in this field are 'Manager for Salary Review' and 'Delegated Manager for Salary Review'. In the former case, you are directly responsible for salary reviews for the employees who belong to the corresponding work unit and you can delegate that responsibility, if you wish, to another manager in that work unit (see the

msscr.Info7-2-3=  item for more details). However, this option is not available if you are the manager to whom responsibility for the salary review is delegated.

msscr.ID6-3= Employee

msscr.ID7-3= Value List

msscr.Info8-3= Here you can view the list of employees who belong to the selected work unit. Each value on the list is made up of the ID and name of the employee. Each of these values represents a link that allows you to view the employee&#39;s salary review history. When you click the link, a small window is displayed with all of the salary reviews that the employee has had approved for each compensation plan.

msscr.Info8-4 = Once you have selected the work unit that you want to review, the review process allows you to view all of the employees who you must review. However, it is possible that some of them cannot be reviewed for a number of reasons. If the employee load process detects any data inconsistency or that data required for the salary review process is missing, an exclamation mark is displayed. Click it to see the reason why the employee cannot be reviewed. Some of the reasons include:<br/>1.- The employee does not have a salary type that can be reviewed.<br/>2.- The employee does not have an associated process currency.<br/>3.- The employee does not have a salary structure assigned.<br/>4.- The employee does not have a base compensation plan associated.<br/>

msscr.Info8-2-3= beside the ID of the employee. Click it to open an informational window that describes the errors that have occurred.

msscr.ID8-3= HR Role

msscr.Info9-3= This item indicates the name of the role performed by each employee in the selected work unit. The 'Unavailable' value indicates that this name is not available.

msscr.ID9-3= Job

msscr.Info10-3= The ID and name of the job held by each employee in the work unit is displayed. If the name of the job is not available, this is indicated with the value 'Unavailable'.

msscr.ID10-3= Grade

msscr.Info11-3= For each employee, the ID of the grade/band/zone within the salary structure to which they belong is displayed. The salary structure of the employee is determined by the country of the legal entity to which the employee belongs and by the job group to which the job of the employee belongs. Within this salary structure, the corresponding grade/band/zone is set based on the job held by the employee in the selected work unit.

msscr.ID11-3= Reviewed Fixed

msscr.Info12-3= For each employee, the value and the currency of the last salary review

msscr.Info12-2-3= are displayed. If this is the first time that the employee's salary is reviewed, the value will be unavailable. Additionally, if the review is pending approval by the HR Department, the 'Pending Approval' message is displayed.

msscr.ID12-3= Review

msscr.ID13-3= Selection Field

msscr.Info13-3= Use this field to select the employees who you want to review. It is unavailable if there is an error or if employee data is missing. Controlled data, required to run the review process, includes the following:</br><b>1.-</b> No currency associated with the employee. The process uses the same currency as the one used to calculate the employee's pay. </br><b>2.-</b> No employee salary structure</br><b>3.-</b> No grade/band/zone within the employee salary structure</br><b>4.-</b> No compensation plans assigned to the employee</br>When any of these errors occur, the symbol

msscr.Info13-2-3= is displayed beside the employee ID (see the 'Employee' item for more information).

msscr.ID14-3= Process Button

msscr.Info14-3= Click this button to go back to the previous page, which contained the list of work units for which you are responsible (directly or delegated) for salary reviews.

msscr.Info15-3= Click this button to continue on to the remaining windows in the salary review process. These windows are repeated once for each employee selected for review. You cannot continue unless you have selected at least one employee for review.

msscr.Info16-3= Click the grade/band/zone of the employee to open an informational window with the following data: ID and name of the salary structure and the grade/band/zone within that structure to which the employee belongs; maximum, minimum, and midpoint salary in the grade/band/zone; compa-ratio and degree of penetration of the employee in the grade/band/zone; and the 25th and 75th percentiles of all of the employees who belong to the selected work unit and who are in the same grade/band/zone and in same salary structure as the employee.

msscr.ID15-3= Base Salary

msscr.Info17-3= This field indicates the current base salary of the employee. Normally, this value is the same as that set the last time the employee's base salary was reviewed. However, it is possible that changes were made to this value since the last review, so the value indicated is the value currently used as the base salary to calculate the employee's pay. This is the value used for salary reviews, since it is the real value of the employee's base salary.

msscr.ID16-3= Compensation Plan

msscr.NOHTML_ID16-3= Compensation Plan

msscr.ID17-3= Link-Value List

msscr.Info18-3= This field displays all of the compensation plans assigned to the selected employee. Each value consists of the ID and name of the compensation plan. Click a compensation plan to open a window in which you can see the details of the plan: ID, name, type, description, currency, and periodicity of the plan, and the increase method used to propose salary increases. It also indicates the specific table that contains the values proposed for the salary increases of the employees with this plan and provides a description and specific values of the table. Finally, if the compensation plan is not a BASE type plan, additional properties are provided for it, such as minimum performance and minimum seniority required to participate in the plan, as well as the maximum increase percentage with respect to the employee's base salary, and whether or not it depends directly on the associated BASE-type compensation plan.

msscr.ID18-3= Type

msscr.Info19-3= This field displays all of the compensation plans for the selected employee. The value may be 'Base Value', 'Variable Value', and so on.

msscr.ID19-3= Last Revision Amount

msscr.Info20-3= This field displays the current monetary value of each of the compensation plans of the selected employee. The monetary value comes together with the corresponding currency. All of the values in the window are converted to the currency used to calculate the employee's pay, so all values are always displayed in a single currency. The following special cases may arise:</br><b>1.- </b>If there is no current value for a specific plan, the message 'Unavailable' is displayed.</br><b>2.- </b>If the value for the compensation plan is being reviewed (in other words, an increase was proposed for this plan and is pending approval), the message 'Pending Approval' is displayed.</br><b>3.-</b> If a compensation plan has been assigned to the employee, but there is some restriction that does not allow you to review it for this employee, the message 'Non-Revisable Plan' is displayed.

msscr.ID20-3= Review Date

msscr.Info21-3= For each of the compensation plans of the selected employee with a current value, this field displays the date on which the plan was reviewed and, therefore, the monetary value displayed was fixed.

msscr.ID21-3= Review

msscr.Info22-3= When it is enabled, this field allows you to select the compensation plan to be reviewed for the selected employee. You can select one or several plans. To continue the salary review process for this employee, you must select at least one compensation plan. If you select a compensation plan that depends on a BASE-type compensation plan, the latter is selected automatically, since you are required to review related compensation plans at the same time. In other words, the compensation plans used to review the employee's base salary may be reviewed individually at any time. However, the compensation plans used to review the employee's variable salary plan may have the following conditioning factors:<br/>1.- The compensation plan used to review a particular variable is linked to the compensation plan for reviewing the base salary. This means that when you want to review a variable compensation plan, you must also select the base compensation plan and review them at the same time. <br/>2.- The compensation plan used to review the variable salary plan of the employee does not depend on the base. This means that it may be reviewed for the employee at any time, without restrictions. <br/>. As you have seen, it is possible to find compensation plans that you must review simultaneously. However, there is an exception to this. This occurs when a variable compensation plan has been reviewed together with the corresponding base compensation plan and both reviews were sent to the HR Department. HR might have approved the review you proposed for the base, but rejected the review proposed for the variable. In this case, when you return to this window for the employee in question, you can review the dependent variable salary individually; that is, without having to review the associated base again. To do so, simply select the check box to review the variable compensation plan. A message will be displayed informing you of the situation, allowing you to decide what action to take. 

msscr.ID22-3= Performance Appraisal

msscr.ID23-3= List of Available Values

msscr.Info23-3= The increase methods used to propose salary increases for an employee depend on employee performance. For this reason, you must select a performance rating for the employee, which is used by the system to propose salary increases in the windows that follow. The performance appraisal must be selected whenever the compensation plans selected for review require it. However, when you click the button to continue the process, you will be required to select a performance appraisal when this is required and you have not done so previously.

msscr.Info24-3= Click this button to return to the employee selection window. If you run this process, you will lose all of the reviews that have not yet been sent to the HR Department. For all intents and purposes, this button restarts the salary review process.

msscr.Info25-3= Click this button to continue the review process for the employee displayed in the window. You cannot continue the process if you have not selected at least one compensation plan from the list of compensation plans for the employee.

msscr.Info26-3= Click this button to skip the employee who you are reviewing and exclude him or her from the review process. If there are still employees selected in the previous steps pending review, the process displays information on the next employee to be reviewed. If there are no more employees pending review, but there were reviews done beforehand that were not sent to the HR Department, the process opens the window that allows you to send salary increase recommendations to HR. If there are no more employees to review and none to be sent, the process goes directly to the window with the list of employees who belong to the work unit selected at the beginning of the review process.

msscr.Info27-3= This button is similar to the previous one, but it does not skip to the next employee to be reviewed (if there is one), rather it skips all of the remaining employees and opens the window used to send increase recommendations to the HR Department.

msscr.ID24-3= Base Salary Review

msscr.ID25-3= Data Block

msscr.Info28-3= This block contains all of the information required to review the base salary of the employee currently displayed. All of the fields in the data block are listed below.

msscr.ID26-3= Last Review (Amount)

msscr.ID27-3= Informational Field

msscr.Info29-3= This field indicates the value set the last time the employee's base salary was reviewed. If this value is not available because there was no previous review, the value is zero (0).

msscr.ID28-3= Last Review (% Increase)

msscr.ID29-3= Informational Field

msscr.Info30-3= This field indicates the percentage increase of the last review of the employee's base salary. If this value is not available because there was no previous review, the value is zero (0).

msscr.ID30-3= Last Review (Position)

msscr.Info31-3= This field indicates the position within the salary grade/band/zone with the base salary value set during the employee's last review. The position within the range indicates the employee's degree of penetration in the salary grade/band/zone in the corresponding salary structure. Calculating this position takes the minimum salary of the grade/band/zone as 0% penetration and the maximum salary of the grade/band/zone as 100% penetration. Salaries below the minimum salary will return a negative penetration percentage and salaries above the maximum salary will return a penetration percentage greater than 100%.

msscr.ID31-3= Last Review (Compa-Ratio)

msscr.Info32-3= Unlike the degree of salary penetration of the employee in the grade/band/zone, or position, explained above, the compa-ratio indicates the ratio of salary penetration based on the midpoint of the grade/band/zone indicating a ratio of 100%. Thus, salaries below the midpoint return a compa-ratio less than 100% and those above the midpoint return a value greater than 100%.

msscr.ID32-3= Proposed Increase (Amount)

msscr.Info33-3= This is the same as the informational field for the last review, described above, but it takes into account, when displaying values on-screen, the base salary of the employee and the increase percentages that result from comparing the employee's degree of performance with the increase method used in the compensation plan.

msscr.ID33-3= Proposed Increase (% Increase)

msscr.Info34-3= This is the same as the informational field for the last review, described above, but it takes into account, when displaying values on-screen, the base salary of the employee and the increase percentages that result from comparing the employee's degree of performance with the increase method used in the compensation plan.

msscr.ID34-3= Proposed Increase (Position)

msscr.ID35-3= Recommended Increase (Amount)

msscr.ID36-3= Modifiable Field

msscr.Info35-3= This is the same as the informational field for the proposed increase, explained above, but it takes into account, when displaying values on-screen, the base salary increase selected by the manager, who uses the information in the previous fields (with the proposal made by the system itself) as a decision-making tool. <u><b>It is important to point out that, if the current base salary is unavailable for the employee, the value in this field is not considered an increase of the base salary, rather it is considered the total new base salary recommended by the manager.</b></u>

msscr.ID37-3= Recommended Increase (% Increase)

msscr.Info36-3= This is the same as the informational field for the proposed increase, explained above, but it takes into account, when displaying values on-screen, the base salary increase selected by the manager, who uses the information in the previous fields (with the proposal made by the system itself) as a decision-making tool. If the value of the current base salary of the employee is not available, you cannot modify this field, since you cannot indicate increase percentages for a value that does not exist.

msscr.ID38-3= Recommended Increase (Position)

msscr.Info37-3= This is the same as the informational field for the proposed increase, explained above, but it takes into account, when displaying values on-screen, the new base salary that results from applying the increase recommended by the manager to the current base salary.

msscr.ID39-3= Recommended Increase (Compa-Ratio)

msscr.ID40-3= Total Base Salary (Amount)

msscr.Info38-3= Taking into account the recommendations made by the manager, this field displays the total value of the employee's new base salary.

msscr.ID41-3= Variable Compensation Plans

msscr.ID42-3= Current Increase

msscr.ID43-3= Proposed Variable (Total Amount)

msscr.ID44-3= Proposed Variable (% Fixed)

msscr.ID45-3= Proposed Variable (Increase Amount)

msscr.ID46-3= Proposed Variable (% Increase)

msscr.ID47-3= Recommended Variable (Total Amount)

msscr.ID48-3= Recommended Variable (% Fixed)

msscr.ID49-3= Recommended Variable (Increase Amount)

msscr.ID50-3= Recommended Variable (% Increase)

msscr.ID51-3= Totals

msscr.ID52-3= Total Recommended Increase

msscr.ID53-3= Amount Above/Below

msscr.ID54-3= Percentage Change

msscr.ID55-3= Performance Appraisal

msscr.Info39-3= This block contains all of the information required to review all of the variable compensation plans selected for the employee currently displayed. There is a separate data block for each of these compensation plans. When one of the plans is initially identified by the name of the plan, the current amount corresponds to the plan and the increase percentage of this amount over the last review. These two values are displayed only when they are available, since it is possible that no previous review exists for the employee in this plan. When this is the case, a comment is displayed that alerts you to this situation. All of the fields in this data block are listed below.

msscr.Info40-3= This amount is expressed in the currency of the employee. It represents the monetary amount proposed as the salary increase for the employee being studied, within the corresponding compensation plan. This amount is calculated by applying the recommended increase percentages for the method associated with the compensation plan to the employee's current base salary.

msscr.Info41-3= The amount corresponding to this compensation plan represents a certain percentage of the employee's fixed salary. This column displays the percentage of the employee's salary represented by the salary for the compensation plan being studied.

msscr.Info42-3= This field stores a monetary amount expressed in the currency of the employee. It displays the increase amount for this compensation plan with respect to the last review done for the employee being reviewed.

msscr.Info43-3= This field stores the increase percentage with respect to the previous review done for the employee in the compensation plan being studied.

msscr.Info44-3= This field may be edited or calculated, depending on the manager's actions. You must enter a monetary amount expressed in the currency of the employee, which is specified along with the amount. In this field, the manager can enter the new salary value for this compensation plan, for the employee being reviewed. The amount entered in this field is the total salary (the salary corresponding to the compensation plan being studied).

msscr.Info45-3= This field may be edited or calculated, depending on the manager's actions. The manager may directly assign a percentage of the base salary, thus setting the new salary for the compensation plan being studied. If the manager enters a percentage in this column, the rest of the fields on this row are recalculated, based on the percentage that was just entered.

msscr.Info46-3= This field may be edited or calculated, depending on the manager's actions. The manager may directly assign an increase amount, expressed in the currency of the employee, which appears along with the amount. This is the amount with respect to the current salary in the compensation plan being studied. If the manager enters a monetary amount in this column, the rest of the fields on this row are recalculated, based on the amount that was just entered.

msscr.Info47-3= This field may be edited or calculated, depending on the manager's actions. The manager may directly assign an increase percentage over the last review or current value for this compensation plan, thus setting the new salary for the compensation plan being studied. If the manager enters a percentage in this column, the rest of the fields on this row are recalculated, based on the percentage that was just entered. <b>Important:</b> Those compensation plans being reviewed whose increase methodologies are ruled by rules that take into account the performance appraisal will not take this data into account when proposing a salary increase.

msscr.Info48-3= Use this section to specify and calculate a series of monetary data and total percentages, which are the result of the actions taken by the manager while reviewing the employee's compensation plan and all of the information provided for each of the compensation plans in which the employee has been reviewed. The block contains the following fields.

msscr.Info49-3= This column contains the sum of all of the monetary increase amounts proposed by the manager. Each of the compensation plans shows, in one of the boxes described above, the final increase amount for that plan. This column totals each of these partial amounts by adding each of the compensation plans.

msscr.Info50-3= This column stores a monetary amount expressed in the currency of the employee, but, instead of indicating the sum of all of the increases proposed by the manager, it contains the sum of the increase method proposals of each of the compensation plans in which the employee being studied has been reviewed.

msscr.Info51-3= This column contains a monetary amount, expressed in the currency of the employee, which is the result of subtracting the total amount proposed by the increase methods and the total amount proposed by the manager. It is a comparative amount that lets the manager know how far off he or she is from the total increase method proposals.

msscr.Info52-3= This column expresses, as a percentage, the deviation between the total increase amount proposed by the increase methods and the total increase amount proposed by the manager.

msscr.Info53-3= Click this button to access the previous page; that is, the page on which you can select the compensation plans that you want to review for the employee. This is useful when you want to correct the compensation plans selected at this time. Any actions taken in this window will be lost.

msscr.Info54-3= Click this button to access the next window. The next window may vary depending on the current stage within the workflow. The next window can be one of the following:<br><b>1.- </b>The window that allows you to review the next employee, if there are more to review.<br><b>2.- </b>The summary window with all of the salary reviews done up to the moment, if salary reviews have been done on one or more employees (including the employee who you are currently reviewing). <br><b>3.- </b>The window that contains the list of employees in the work unit for which you are running the salary review process, if you have not done a salary review on any of the employees.

msscr.Info55-3= This window provides a summary of all of the actions taken in the salary review process for all of the employees reviewed. Here you can check the increase totals for each of the employees, both fixed salary and variable salary. You can also use this window to select the employees who have been reviewed for whom you want to send notification to the HR Department so that, when appropriate, the salary increase recommendations made can be validated and approved.

msscr.Info56-3 = This column displays the first names and last names of all of the employees for whom salary reviews have been completed.

msscr.Info57-3 = This column displays the performance rating assigned to each employee whenever entering this data was required. Remember that this data is required whenever the employee has been reviewed in one or more compensation plans that use this information to propose salary increases. This is the case, for example, with all compensation plans whose increase method is anything other than Budget. The performance appraisal will appear whenever it has been necessary in previous windows to select this data to review the employee's compensation plans.

msscr.Info58-3 = This column displays two amounts: the employee's fixed salary proposed by the corresponding increase method and the one recommended by the manager. It is a simple way of seeing the deviations between the proposals and the recommendations before sending the data to the HR Department.

msscr.Info59-3 = This column displays two amounts: the employee's variable salary proposed by the corresponding increase method and the one recommended by the manager. It is a simple way of seeing the deviations between the proposals and the recommendations before sending the data to the HR Department.

msscr.Info60-3 = This column displays two amounts: the total salary (fixed plus variable) proposed by the increase methods and the total salary (fixed plus variable) recommended by the manager.

msscr.Info61-3 = This column reminds the manager of the employee's current position within the salary range corresponding to the grade/band/zone to which the employee belongs. Remember that the compa-ratio is the position within the salary range, taking into account that the range midpoint represents 100%.

msscr.Info62-3 = This column allows you to select the employees to be sent directly to the HR Department with their salary review information. Employees who are not selected will not be sent and their salary reviews will be lost.

msscr.Info63-3 = Click this button to send all of the selected employees, with their salary reviews, to the HR Department.

msscr.Info64-3 = FIXED

msscr.Info65-3 = Use this window to view the status of all of the salary increase requests that have been sent to the HR Department. For each employee sent, there is a block of information on the review done in each of the compensation plans. The three possible statuses for a salary review are: <br/>1.- <b>Pending:</b> The HR Department has not yet made a decision on the salary review in question.<br/>2.-<b>Approved:</b> The HR Department has approved the manager's salary review recommendation for a particular employee within a compensation plan. <br/>3.-<b>Rejected:</b> The HR Department has rejected the manager's salary review recommendation for a particular employee within a compensation plan.

msscr.Info66-3 = This column displays information on the employee. Each of the blocks in the window corresponds with the salary reviews for an employee sent to the HR Department. This column contains the first name, last name, and HR role name of the employee.

msscr.Info67-3 = This column contains information (compensation plan name and type) on each of the compensation plans of the employee you are viewing.

msscr.Info68-3 = This column contains a monetary amount expressed in the currency of the employee. This amount is the total increase amount recommended by the manager for the compensation plan being studied.

msscr.Info69-3 = This column contains a monetary amount expressed in the currency of the employee. This amount is the total previous amount that the employee had for the compensation plan being studied.

msscr.Info70-3 = This column contains a monetary amount expressed in the currency of the employee. The amount in this column corresponds with the difference between the two previous columns; that is, it contains the real value of the increase proposed by the manager, calculated as the difference between the total value proposed and the value prior to the salary review.

msscr.Info71-3 = This column contains the same value described in the previous column, but expressed as a percentage instead of as a monetary amount.

msscr.Info72-3 = Click this link to access a window in which you can view all of the messages generated in the salary review process. The messages can come from one of two sources. On the one hand, the manager, upon completing the salary review, can enter messages for the HR Department, which are notes for clarifying the reasons for the salary increase recommendations. On the other hand, when the HR Department interacts with the requests sent by the manager, it can also enter messages, either in response to those entered by the manager or to introduce new relevant information to explain its decisions.

msscr.Info73-3= Use this report to analyse the overall results of the approved compensation review processes. The report data displayed belongs to review processes done during the period defined by the selected dates. None of the filters are required. If no selection criterion is applied, the report will display all available information.

