msscr.Confirm_ad16a= Volte &agrave; lista de planos de compensa&ccedil;&atilde;o

msscr.Info1-4= Permite rever os sal&aacute;rios, empregado por empregado e directamente a partir da conex&atilde;o &agrave; aplica&ccedil;&atilde;o.
msscr.Info1-5= Permite rever os sal&aacute;rios de todos os empregados atrav&eacute;s de uma folha de c&aacute;lculo, n&atilde;o requerendo, num primeiro momento, conex&atilde;o &agrave; aplica&ccedil;&atilde;o.

msscr.Info8m-1 = Neste ecr&atilde; pode ver a lista de planos de compensa&ccedil;&atilde;o associados &agrave; unidade organizativa seleccionada. Para cada plano salarial, pode exportar os dados salariais dos empregados a uma folha de c&aacute;lculo para proceder a sua revis&atilde;o e posteriormente import&aacute;-los para actualizar os dados na aplica&ccedil;&atilde;o de forma maasiva. Se existem empregados pertencentes &agrave; unidade organizativa cuja revisão salarial não pode levar-se a cabo por diferentes motivos, relacionam-se antes que a lista de planos.
msscr.Info8m-2 = Permite ver a lista dos empregados pertencentes &agrave; unidade organizativa seleccionada. Cada valor da lista &eacute; composto pelo identificador e pelo nome do empregado. Cada valor representa por sua vez uma hiperliga&ccedil;&atilde;o que lhe permite visualizar o hist&oacute;rico das revis&otilde;es salariais do empregado. Quando clicar na hiperliga&ccedil;&atilde;o aparecer&aacute; uma pequena janela contendo todas as revis&otilde;es salariais pr&eacute;vias do empregado para cada plano de sal&aacute;rio e que tenham sido aprovadas.
msscr.Info8m-3 = Ap&oacute;s seleccionar a unidade organizativa que pretende rever, o processo de revis&atilde;o permite visualizar todos os planos de compensa&ccedil;&atilde;o que tem de rever. Entretanto, &eacute; poss&iacute;vel que, algum dos empregados pertencentes &agrave; unidade organizativa, n&atilde;o possam ser revistos por diferentes motivos. Se, durante o processo de carregamento de empregados detectar uma incoer&ecirc;ncia ou falta de dados necess&aacute;rios para o processo de revis&atilde;o salarial, surgir&aacute; um ponto de exclama&ccedil;&atilde;o. Prima-o para ver o motivo pelo qual o empregado n&atilde;o pode ser aprovado. Algumas causas poss&iacute;veis s&atilde;o:<br/>1.- O empregado n&atilde;o tem um tipo de sal&aacute;rio pass&iacute;vel de revis&atilde;o <br/>2.- O empregado n&atilde;o tem uma moeda de processamento associada<br/>3.- O empregado n&atilde;o tem uma estrutura de sal&aacute;rio atribuída<br/>4.- O empregado n&atilde;o tem um plano de revis&atilde;o base associado<br/>
msscr.Info8m-4= Este elemento mostra o nome do role desempenhado por cada empregado na unidade organizativa seleccionada. Caso o referido nome n&atilde;o esteja dispon&iacute;vel, ver&aacute; a indica&ccedil;&atilde;o ''N&atilde;o dispon&iacute;vel''.
msscr.Info8m-5= Mostra o identificador e o nome do posto ocupado por cada empregado na unidade organizativa. Se o nome do posto n&atilde;o estiver dispon&iacute;vel, surgir&aacute; a mensagem ''N&atilde;o dispon&iacute;vel''.
msscr.Info8m-6= Mostra o identificador do grau/intervalo/zona de cada empregado na respectiva estrutura salarial. A estrutura salarial do empregado &eacute; determinada em fun&ccedil;&atilde;o do pa&iacute;s da entidade jur&iacute;dica a que pertence e do grupo de postos em que se insere. Esta estrutura salarial especifica o grau/intervalo/zona correspondente, em fun&ccedil;&atilde;o do cargo desempenhado pelo empregado na unidade organizativa seleccionada.
msscr.Info8m-7= Apresenta-se para cada empregado o valor e a moeda correspondente &agrave; &uacute;ltima revis&atilde;o salarial FIXO realizada Se for a primeira vez que o sal&aacute;rio do empregado &eacute; revisto, o valor n&atilde;o estar&aacute; dispon&iacute;vel. Al&eacute;m disso, se a revis&atilde;o estiver a aguardar aprova&ccedil;&atilde;o pelo departamento de RH, ver&aacute; a mensagem ''Aprova&ccedil;&atilde;o pendente''.
msscr.Info8m-8 = Lista de grupos de planos de compensa&ccedil;&atilde;o associados &agrave; Unidade Organizativa com a qual trabalha. Apresenta-se uma linha por cada grupo, unificando aqueles planos vari&aacute;veis que dependem de outros (na linha do plano do qual dependem). Isto &eacute;, os grupos podem formar-se por: um plano base e todos os planos vari&aacute;veis que dependem dele, um plano salarial base sem depend&ecirc;ncias ou um plano vari&aacute;vel que n&atilde;o depende de nenhum plano base.
msscr.Info8m-9 = Ao clicar neste bot&atilde;o, para cada grupo de planos de compensa&ccedil;&atilde;o, cria-se um ficheiro excel com todos os empregados afectados por esse grupo. A folha excel apresenta para cada empregado informa&ccedil;&atilde;o que lhe ajudar&aacute; a tomar uma decis&atilde;o sobre a revis&atilde;o salarial: &uacute;ltima revis&atilde;o salarial practicada ao empregado, aumento proposto, aumento recomendado, etc&eacute;tera.<br>Indique na coluna Revis&atilde;o o valor de incremento. Ao informar este dado calcula-se automaticamente o novo sal&aacute;rio, os campos agrupados em Aumento recomendado e os totais do plano (total de sal&aacute;rio actual, total de sal&aacute;rio ap&oacute;s a revis&atilde;o, total do aumento).<br>Se o grupo de planos, tem vários planos, na folha de c&aacute;lculo mostram-se os empregados agrupados em cada um dos seus planos.<br>Quando foram conclu&iacute;das todas as revis&otilde;es pode guardar os dados e a seguir proceder a importar as revis&otilde;es salariais na aplica&ccedil;&atilde;o.
msscr.Info8m-10 = Ao clicar neste bot&atilde;o, pode trasladar as revis&otilde;es salariais practicadas a partir da folha de c&aacute;lculo &agrave aplica&ccedil;&atilde;o, de forma autom&aacute;tica. A aplica&ccedil;&atilde;o verifica que a folha de c&aacute;lculo indicada cont&eacute;m os dados correctos do plano de compensa&ccedil;&atilde;o que vai rever. Se existir algum erro, a aplica&ccedil;&atilde;o lhe advertira desta situa&ccedil;&atilde;o.<br>Ap&oacute;s a indica&ccedil;atilde;o da folha excel que cont&eacute;m as revis&otilde;es, a aplica&ccedil;&atilde;o mostra a p&aacute;gina Revis&atilde;o salarial dos empregados, com o resumo de todas as revis&otilde;es informadas podendo enviar a RH aquelas revis&otilde;es realizadas at&eacute; o momento que considere v&aacute;lidas.
msscr.Info8m-11 = Clique neste bot&atilde;o para regressar &agrave; p&aacute;gina anterior, onde poder&aacute; visualizar a lista das unidades organizativas por cuja revis&atilde;o salarial &eacute; respons&aacute;vel (directo ou delegado).


