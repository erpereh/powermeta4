msscr.Aviso-11= O valor real anterior deste plano n&atilde;o est&aacute; dispon&iacute;vel, por isso n&atilde;o lhe pode aplicar um valor ou percentagem de aumento. Neste caso, qualquer aumento que atribuir ser&aacute; assumido como o valor total. S&oacute; ver&aacute; no ecr&atilde; as percentagens associadas se estiver dispon&iacute;vel o sal&aacute;rio base actual e o valor anterior real do plano. Caso contr&aacute;rio, estes dados n&atilde;o ser&atilde;o apresentados.

msscr.Aviso2-11= Todos os planos de compensa&ccedil;&atilde;o seleccionados para revis&atilde;o ter&atilde;o, neste momento, o mesmo per&iacute;odo de validade. Tenha presente este pormenor quando seleccionar o per&iacute;odo de validade da revis&atilde;o. Por defeito, este per&iacute;odo corresponde ao ano normal de calend&aacute;rio contado a partir do presente dia, mas pode modific&aacute;-lo como desejar.

msscr.Aviso3-11= Este plano de compensa&ccedil;&atilde;o n&atilde;o pode ser revisto. Consulte a mensagem por baixo da lista de planos de compensa&ccedil;&atilde;o do empregado para obter mais informa&ccedil;&otilde;es sobre o plano de compensa&ccedil;&atilde;o, sobre o empregado e sobre o motivo pelo qual n&atilde;o pode ser revisto.

msscr.Aviso4-11= Os planos de compensa&ccedil;&atilde;o a seguir apresentados n&atilde;o podem ser revistos, porque o empregado n&atilde;o satisfaz todos os requisitos impostos pelos referidos planos. Consulte a seguinte informa&ccedil;&atilde;o para obter informa&ccedil;&atilde;o detalhada.

msscr.Aviso5-11= A base de compensa&ccedil;&atilde;o na qual s&atilde;o expressos os valores monet&aacute;rios da estrutura do sal&aacute;rio refere-se ao tipo de sal&aacute;rio do empregado. N&atilde;o foram encontrados os dados necess&aacute;rios para converter os valores do sal&aacute;rio do empregado para a base de compensa&ccedil;&atilde;o da estrutura do sal&aacute;rio. Por este motivo, n&atilde;o &eacute; poss&iacute;vel calcular o compa-ratio nem a posi&ccedil;&atilde;o do empregado no grau em que se insere.

