msscr.Titulo1= Compensa&ccedil;&atilde;o salarial

msscr.Info1= Este m&oacute;dulo permite efectuar as revis&otilde;es salariais dos empregados por cujos sal&aacute;rios &eacute; respons&aacute;vel. Pode visualizar os planos de compensa&ccedil;&atilde;o de cada empregado e seleccionar os que pretende rever. Da mesma forma, pode obter informa&ccedil;&otilde;es sobre a situa&ccedil;&atilde;o dos aumentos salariais que recomendou e que foram processados pelo departamento de RH a seu pedido.

msscr.Titulo2= Reveja o sal&aacute;rio dos seus empregados

msscr.Info2= Esta sec&ccedil;&atilde;o permite seleccionar os empregados e os planos de compensa&ccedil;&atilde;o que deseja rever e, em seguida, enviar as suas recomenda&ccedil;&otilde;es de aumentos salariais para o departamento de RH.

msscr.Link1= Revis&atilde;o salarial dos empregados

msscr.Pop1= Revis&atilde;o salarial dos empregados

msscr.Titulo3= Estado das suas recomenda&ccedil;&otilde;es de aumento salarial

msscr.Info3= Esta sec&ccedil;&atilde;o permite-lhe verificar se o departamento de RH validou as suas recomenda&ccedil;&otilde;es de aumentos salariais. S&atilde;o mostrados os empregados, cujos planos de compensa&ccedil;&atilde;o foram revistos por si, bem como as recomenda&ccedil;&otilde;es efectuadas.

msscr.Info3_bis = Analise os empregados revistos por si ou por um respons&aacute;vel nomeado para o efeito. Pode consultar a informa&ccedil;&atilde;o resumida por planos de compensa&ccedil;&atilde;o e classificada por cada unidade organizativa a seu cargo.

msscr.Link2= Estado das suas recomenda&ccedil;&otilde;es de aumento salarial

msscr.Pop2= Estado das suas recomenda&ccedil;&otilde;es de aumento salarial

msscr.Titulo4= Analise as suas revis&otilde;es salariais

msscr.Titulo5= Este m&oacute;dulo permite rever as remunera&ccedil;&otilde;es dos empregados a seu cargo. Para tal, seleccione os empregados que deseja rever e os planos de remunera&ccedil;&atilde;o correspondentes. Desta forma, poder&aacute; consultar as decis&otilde;es tomadas pelo departamento de RH relativamente &agrave;s suas &uacute;ltimas recomenda&ccedil;&otilde;es de aumentos salariais.

msscr.Info4= Nesta sec&ccedil;&atilde;o pode analisar os resultados das revis&otilde;es salariais. Este relat&oacute;rio mostra os empregados revistos por si ou por um respons&aacute;vel nomeado para o efeito. Pode consultar a informa&ccedil;&atilde;o resumida por planos de compensa&ccedil;&atilde;o e classificada por cada unidade organizativa a seu cargo.

msscr.Link4= Analise as suas revis&otilde;es salariais

msscr.Pop4= Analise as suas revis&otilde;es salariais

