msscr.Info77-3=Este filtro permite seleccionar numa lista o formato da data de fim e de in&iacute;cio do plano de remunera&ccedil;&atilde;o.

msscr.Info78-3=Esta coluna permite seleccionar o formato do relat&oacute;rio do plano de remunera&ccedil;&atilde;o

msscr.Info79-3= Este relat&oacute;rio permite analisar os resultados globais dos Compensation Review Process aprovados.<br> <b>Grupos</b><br>A informa&ccedil;&atilde;o apresentada inclui tr&ecirc;s n&iacute;veis de grupos, de acordo com a seguinte ordem:<br> * Compensation Plan<br> * Unidade organizativa<br> * Gestor(Compensation Review Responsible)<br> <b>Totais</b><br> Desta forma, os resultados do relat&oacute;rio apresentam os valores totais de: * Gestor (Compensation Review Responsible)<br> * Unidade organizativa<br>* Compensation Plan<br> * Total report (em euros)<br> <b>Cabe&ccedil;alho</b><br> Al&eacute;m desta informa&ccedil;&atilde;o, os dados do cabe&ccedil;alho incluem ainda o Increase Methodology Type e a Increase Table associada a cada um dos Compensation Plans.<br> <b>Filtros activos</b><br> Para a execu&ccedil;&atilde;o deste relat&oacute;rio, o utilizador pode elaborar um filtro de acordo com os seguintes crit&eacute;rios:<br> * Data de Revis&atilde;o. Os dados do relat&oacute;rio dizem respeito aos Processos de Revis&atilde;o realizados no per&iacute;odo compreendido entre as datas seleccionadas.<br> * Data de in&iacute;cio / Data de fim do plano de compensa&ccedil;&atilde;o.<br> * Gestor (Compensation Review Responsible)<br> * Unidade organizativa<br> * Currency (euro, por predefini&ccedil;&atilde;o)<br> <b>Colunas do relat&oacute;rio</b><br> * HR ID<br> * HR Name<br> * Previous Salary<br> * Revised Salary (novo sal&aacute;rio aprovado)<br> * % Raised (percentagem de aumento)<br> * % Methodology (aumento m&eacute;dio proposto no Compensation Plan)

msscr.Info80-3= Esta lista de valores poss&iacute;veis apresenta o identificador e o nome dos empregados para os quais est&aacute; a visualizar o estado dos seus pedidos. Esta lista permite seleccionar um empregado para utilizar no filtro. Desta forma, ao seleccionar um empregado na lista, premindo o bot&atilde;o do filtro, apenas visualizar&aacute; no ecr&atilde; o estado das revis&otilde;es salariais para o empregado seleccionado. Prima o bot&atilde;o de anula&ccedil;&atilde;o do filtro para regressar &agrave; visualiza&ccedil;&atilde;o da lista completa de estado de revis&atilde;o para os empregados revistos.

