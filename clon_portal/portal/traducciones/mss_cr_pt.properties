msscr.Titulo2-3= Explica&ccedil;&atilde;o gen&eacute;rica:

msscr.Info1-3= Clique no ícone individual ou massivo da unidade organizacional com a que pretende trabalhar.</br>Para ver os detalhes da unidade organizativa, clique no respectivo nome. Esta op&ccedil;&atilde;o tamb&eacute;m permite delegar a responsabilidade pela revis&atilde;o dos sal&aacute;rios da unidade organizativa seleccionada.

msscr.Info2-3= Esta janela permite-lhe ver uma lista dos empregados pertencentes &agrave; unidade organizativa seleccionada, com o respectivo identificador destacado. Pode seleccionar todos os empregados cujo sal&aacute;rio pretende rever (caso estejam dispon&iacute;veis).

msscr.Info3-3= Esta janela permite ver uma lista dos planos de compensa&ccedil;&atilde;o em vigor para cada empregado seleccionado. Abrir-se-&atilde;o tantos ecr&atilde;s do processo de revis&atilde;o salarial quantos os empregados seleccionados para revis&atilde;o. No entanto, cada ecr&atilde; s&oacute; apresenta a informa&ccedil;&atilde;o relativa ao empregado em quest&atilde;o. Pode seleccionar os planos de compensa&ccedil;&atilde;o de cada empregado que pretende rever.

msscr.Info4-3= Esta janela permite efectuar a revis&atilde;o salarial de todos os planos do empregado seleccionados no passo anterior. A janela apresenta v&aacute;rios grupos de dados. O primeiro grupo cont&eacute;m os dados necess&aacute;rios para a revis&atilde;o do sal&aacute;rio BASE do empregado. Se no passo anterior tiver seleccionado um ou mais planos de compensa&ccedil;&atilde;o de tipo vari&aacute;vel, ser&aacute; apresentado um grupo funcional contendo todos os dados necess&aacute;rios para a revis&atilde;o de cada plano. O terceiro e &uacute;ltimo grupo cont&eacute;m toda a informa&ccedil;&atilde;o relativa &agrave;s decis&otilde;es que tomou nesta janela.

msscr.Tabla1-3= Elemento

msscr.Tabla2-3= Descri&ccedil;&atilde;o do elemento

msscr.Tabla3-3= Tipo de elemento

msscr.Tabla4-3= Descri&ccedil;&atilde;o

msscr.ID1-3= ID Unidade organizativa

msscr.ID2-3= Liga&ccedil;&atilde;o

msscr.ID2-4= Mensagem informativa

msscr.Info5-3= Esta coluna apresenta todas as unidades organizativas cuja revis&atilde;o salarial est&aacute; a seu cargo. Note que as unidades organizativas apresentam uma rela&ccedil;&atilde;o hier&aacute;rquica entre si, representada em &aacute;rvore. Mostra-se as unidades organizativas cujas revis&otilde;es salariais est&atilde;o a seu cargo, bem como as unidades organizativas hierarquicamente dependentes das mesmas e &agrave;s quais n&atilde;o esteja adstrito qualquer respons&aacute;vel directo pelas revis&otilde;es salariais. Da mesma forma, e só se for o caso, a lista de unidades organizativas tamb&eacute;m incluir&aacute; as unidades cuja responsabilidade pelas revis&otilde;es salariais lhe tenham sido delegadas (consulte o elemento <b>Tipo de respons&aacute;vel</b> para obter informa&ccedil;&otilde;es adicionais).).<br>Ao clicar na unidade organizativa concreta, abre-se uma janela com a seguinte informa&ccedil;&atilde;o b&aacute;sica: identificador, nome, tipo e descri&ccedil;&atilde;o da unidade organizativa e a lista de todos os respons&aacute;veis, de qualquer tipo, que estejam atribu&iacute;dos. Na lista de respons&aacute;veis pode seleccionar a pessoa a quem deseja delegar a responsabilidade pela revis&atilde;o dos sal&aacute;rios dos empregados da unidade organizativa cujos detalhes aparecem no ecr&atilde;. Poder&aacute; faz&ecirc;-lo se for o respons&aacute;vel directo pela revis&atilde;o salarial dessa unidade organizativa. Se for o respons&aacute;vel delegado, n&atilde;o poder&aacute; delegar essa responsabilidade numa outra pessoa. Ap&oacute;s seleccionar o respons&aacute;vel para delega&ccedil;&atilde;o, clique no bot&atilde;o Continuar para enviar a essa pessoa uma mensagem de correio electr&oacute;nico a avis&aacute;-la das suas inten&ccedil;&otilde;es.

msscr.ID3-3= Nome unidade organizativa

msscr.Info6-3= Clique no nome de uma unidade organizativa espec&iacute;fica para abrir uma janela com a seguinte informa&ccedil;&atilde;o b&aacute;sica: identificador, nome, tipo e descri&ccedil;&atilde;o da unidade organizativa e a lista de todos os respons&aacute;veis, de qualquer tipo, que estejam atribu&iacute;dos. Na lista de respons&aacute;veis pode seleccionar a pessoa a quem deseja delegar a responsabilidade pela revis&atilde;o dos sal&aacute;rios dos empregados da unidade organizativa cujos detalhes aparecem no ecr&atilde;. Poder&aacute; faz&ecirc;-lo se for o respons&aacute;vel directo pela revis&atilde;o salarial dessa unidade organizativa. Se for o respons&aacute;vel delegado, n&atilde;o poder&aacute; delegar essa responsabilidade numa outra pessoa. Ap&oacute;s seleccionar o respons&aacute;vel para delega&ccedil;&atilde;o, clique no bot&atilde;o Continuar para enviar a essa pessoa uma mensagem de correio electr&oacute;nico a avis&aacute;-la das suas inten&ccedil;&otilde;es.

msscr.ID4-3= Tipo de respons&aacute;vel

msscr.ID5-3= Lista de valores

msscr.Info7-3= Junto a cada unidade organizativa da lista est&aacute; indicado qual &eacute; a sua responsabilidade pelas revis&otilde;es salariais dos seus empregados. Os dois valores poss&iacute;veis para este campo s&atilde;o 'Respons&aacute;vel pela revis&atilde;o salarial' e 'Respons&aacute;vel delegado pela revis&atilde;o salarial'. No primeiro caso, &eacute; o respons&aacute;vel directo pela revis&atilde;o salarial dos empregados pertencentes &agrave; unidade organizativa em quest&atilde;o, tendo a possibilidade de delegar, se desejar, essa responsabilidade em qualquer outro respons&aacute;vel da unidade organizativa (consulte o elemento

msscr.Info7-2-3=  para obter informa&ccedil;&atilde;o mais detalhada). No entanto, se for o respons&aacute;vel delegado pela revis&atilde;o salarial n&atilde;o ter&aacute; essa possibilidade

msscr.ID6-3= Empregado

msscr.ID7-3= Lista de valores

msscr.Info8-3= Permite ver a lista dos empregados pertencentes &agrave; unidade organizativa seleccionada. Cada valor da lista &eacute; composto pelo identificador e pelo nome do empregado. Cada valor representa por sua vez uma hiperliga&ccedil;&atilde;o que lhe permite visualizar o hist&oacute;rico das revis&otilde;es salariais do empregado. Quando clicar na hiperliga&ccedil;&atilde;o aparecer&aacute; uma pequena janela contendo todas as revis&otilde;es salariais pr&eacute;vias do empregado para cada plano de sal&aacute;rio e que tenham sido aprovadas.

msscr.Info8-4 = Ap&oacute;s seleccionar a unidade organizativa que pretende rever, o processo de revis&atilde;o permite visualizar todos os empregados que tem de rever. No entanto, &eacute; poss&iacute;vel que alguns n&atilde;o possam ser revistos por algum motivo. Se, durante o processo de carregamento de empregados detectar uma incoer&ecirc;ncia ou falta de dados necess&aacute;rios para o processo de revis&atilde;o salarial, surgir&aacute; um ponto de exclama&ccedil;&atilde;o. Prima-o para ver o motivo pelo qual o empregado n&atilde;o pode ser aprovado. Algumas causas poss&iacute;veis s&atilde;o:<br/>1.- O empregado n&atilde;o tem um tipo de sal&aacute;rio pass&iacute;vel de revis&atilde;o <br/>2.- O empregado n&atilde;o tem uma moeda de processamento associada<br/>3.- O empregado n&atilde;o tem uma estrutura de sal&aacute;rio associada<br/>4.- O empregado n&atilde;o tem uma plano de revis&atilde;o base associado<br/>

msscr.Info8-2-3= junto do identificador do empregado. Clique no mesmo para abrir uma janela informativa com uma descri&ccedil;&atilde;o dos erros ocorridos.

msscr.ID8-3= Role

msscr.Info9-3= Este elemento mostra o nome do role desempenhado por cada empregado na unidade organizativa seleccionada. Caso o referido nome n&atilde;o esteja dispon&iacute;vel, ver&aacute; a indica&ccedil;&atilde;o ''N&atilde;o dispon&iacute;vel''.

msscr.ID9-3= Posto

msscr.Info10-3= Mostra o identificador e o nome do posto ocupado por cada empregado na unidade organizativa. Se o nome do posto n&atilde;o estiver dispon&iacute;vel, surgir&aacute; a mensagem ''N&atilde;o dispon&iacute;vel''.

msscr.ID10-3= Grau

msscr.Info11-3= Mostra o identificador do grau/intervalo/zona de cada empregado na respectiva estrutura salarial. A estrutura salarial do empregado &eacute; determinada em fun&ccedil;&atilde;o do pa&iacute;s da entidade jur&iacute;dica a que pertence e do grupo de postos em que se insere. Esta estrutura salarial especifica o grau/intervalo/zona correspondente, em fun&ccedil;&atilde;o do cargo desempenhado pelo empregado na unidade organizativa seleccionada.

msscr.ID11-3= Fixo revisto

msscr.Info12-3= &Eacute; apresentado para cada empregado o valor e a moeda correspondente &agrave; &uacute;ltima revis&atilde;o salarial

msscr.Info12-2-3= realizada. Se for a primeira vez que o sal&aacute;rio do empregado &eacute; revisto, o valor n&atilde;o estar&aacute; dispon&iacute;vel. Al&eacute;m disso, se a revis&atilde;o estiver a aguardar aprova&ccedil;&atilde;o pelo departamento de RH, ver&aacute; a mensagem ''Aprova&ccedil;&atilde;o pendente''.

msscr.ID12-3= Rever

msscr.ID13-3= Campo de selec&ccedil;&atilde;o

msscr.Info13-3= Este campo permite seleccionar os empregados que deseja rever. Estar&aacute; desactivado se houver algum erro ou se faltarem informa&ccedil;&otilde;es sobre o empregado. Os erros que impedem a correcta execu&ccedil;&atilde;o do processo de revis&atilde;o s&atilde;o os seguintes:</br><b>1.-</b> Nenhuma moeda associada ao empregado. A moeda utilizada no c&aacute;lculo equivale &agrave; moeda utilizada para o c&aacute;lculo do vencimento do empregado. </br><b>2.-</b> Nenhuma estrutura salarial definida para o empregado </br><b>3.-</b> Nenhum grau/intervalo/zona na estrutura salarial do empregado</br><b>4.-</b> Nenhum plano de compensa&ccedil;&atilde;o definido para o empregado.</br>Quando ocorre um destes erros, surge o seguinte s&iacute;mbolo

msscr.Info13-2-3= junto do identificador do empregado (consulte o elemento 'Empregado'' para obter mais informa&ccedil;&otilde;es).

msscr.ID14-3= Bot&atilde;o de processo

msscr.Info14-3= Clique neste bot&atilde;o para regressar &agrave; p&aacute;gina anterior, onde poder&aacute; visualizar a lista das unidades organizativas por cuja revis&atilde;o salarial &eacute; respons&aacute;vel (directo ou delegado).

msscr.Info15-3= Clique neste bot&atilde;o para iniciar a sequ&ecirc;ncia de janelas correspondentes ao processo de revis&atilde;o salarial. Esta sequ&ecirc;ncia de janelas ser&aacute; repetida tantas vezes quantos os empregados seleccionados para revis&atilde;o. O bot&atilde;o n&atilde;o permite avan&ccedil;ar enquanto n&atilde;o tiver seleccionado um empregado.

msscr.Info16-3= Clique no grau/intervalo/zona do empregado para abrir uma janela de informa&ccedil;&atilde;o com os seguintes dados: identificador e nome da estrutura salarial e do grau/intervalo/zona do empregado; sal&aacute;rio m&aacute;ximo, m&iacute;nimo e valor m&eacute;dio do grau/intervalo/zona; compa-ratio e grau de penetra&ccedil;&atilde;o do empregado no seu grau/intervalo/zona, bem como percentis 25% e 75% de todos os empregados da unidade organizativa seleccionada que se encontrem no mesmo grau/intervalo/zona e que tenham a mesma estrutura salarial do empregado.

msscr.ID15-3= Sal&aacute;rio base

msscr.Info17-3= Este campo indica o sal&aacute;rio base actual do empregado. Normalmente, equivale ao valor estabelecido na &uacute;ltima revis&atilde;o do sal&aacute;rio base do empregado. N&atilde;o obstante, &eacute; poss&iacute;vel que tenham ocorrido altera&ccedil;&otilde;es desde a &uacute;ltima revis&atilde;o, por isso &eacute; indicado o valor de sal&aacute;rio base actualmente em vigor para c&aacute;lculo do vencimento do empregado. Para todos os efeitos, este valor &eacute; o valor utilizado para as revis&otilde;es salariais, dado que corresponde ao valor real do sal&aacute;rio base do empregado.

msscr.ID16-3= Plano de compensa&ccedil;&atilde;o

msscr.NOHTML_ID16-3= Plano de compensação

msscr.ID17-3= Liga&ccedil;&atilde;o-Lista de valores

msscr.Info18-3= Este campo mostra todos os planos de compensa&ccedil;&atilde;o atribu&iacute;dos ao empregado seleccionado. Cada valor &eacute; composto pelo identificador e pelo nome do plano de compensa&ccedil;&atilde;o. Clique num plano de compensa&ccedil;&atilde;o para abrir uma janela com informa&ccedil;&atilde;o detalhada sobre o plano: identificador, nome, tipo, descri&ccedil;&atilde;o, moeda e frequ&ecirc;ncia do plano, com indica&ccedil;&atilde;o da metodologia utilizada para propor aumentos salariais. &Eacute; igualmente apresentada a tabela que cont&eacute;m os valores propostos para os aumentos salariais dos empregados com este plano e uma descri&ccedil;&atilde;o e valores concretos dessa tabela. Por &uacute;ltimo, caso o plano de compensa&ccedil;&atilde;o n&atilde;o seja do tipo BASE, apresentam-se as propriedades adicionais destes planos como o rendimento e a antiguidade m&iacute;nimos para poder participar neste plano, bem como a percentagem m&aacute;xima de aumento relativamente ao sal&aacute;rio base do empregado e se este depende ou n&atilde;o directamente do plano de compensa&ccedil;&atilde;o do tipo BASE associado.

msscr.ID18-3= Tipo

msscr.Info19-3= Este campo mostra o tipo de cada plano de compensa&ccedil;&atilde;o do empregado seleccionado. Pode conter valores como ''Valor Base'', ''Valor Vari&aacute;vel'', etc.

msscr.ID19-3= Quantidade &uacute;ltima revis&atilde;o

msscr.Info20-3= Este campo mostra o valor monet&aacute;rio actual de cada plano de compensa&ccedil;&atilde;o do empregado seleccionado. O valor monet&aacute;rio &eacute; mostrado com a moeda correspondente. Como todos os valores no ecr&atilde; foram convertidos para a moeda de c&aacute;lculo do vencimento do empregado, os valores s&atilde;o sempre visualizados numa &uacute;nica moeda. Existem as seguintes excep&ccedil;&otilde;es</br><b>1.- </b>Se n&atilde;o existir um valor actual para um plano espec&iacute;fico, aparecer&aacute; a mensagem ''N&atilde;o Dispon&iacute;vel''</br><b>2.- </b>Se o valor de um plano de compensa&ccedil;&atilde;o estiver a ser revisto, ou seja, se houver uma proposta de aumento para este plano com aprova&ccedil;&atilde;o pendente, aparecer&aacute; a mensagem ''Em fase de aprova&ccedil;&atilde;o''</br><b>3.-</b>No caso de ter sido definido um plano de compensa&ccedil;&atilde;o ao empregado e existir uma restri&ccedil;&atilde;o &agrave; revis&atilde;o do mesmo, aparecer&aacute; a mensagem ''Plano indispon&iacute;vel para revis&atilde;o''.

msscr.ID20-3= Data de revis&atilde;o

msscr.Info21-3= Este campo cont&eacute;m a data de revis&atilde;o dos planos de compensa&ccedil;&atilde;o do empregado e de defini&ccedil;&atilde;o do valor monet&aacute;rio visualizado no ecr&atilde; (sempre que um plano tenha um valor actualizado).

msscr.ID21-3= Rever

msscr.Info22-3= Se dispuser de autoriza&ccedil;&atilde;o para tal, este campo permite seleccionar o plano de compensa&ccedil;&atilde;o do empregado que vai ser revisto. Pode seleccionar um ou mais planos. Para poder avan&ccedil;ar no processo de revis&atilde;o salarial do empregado tem de seleccionar, pelo menos, um plano de compensa&ccedil;&atilde;o. Se seleccionar um plano de compensa&ccedil;&atilde;o que esteja dependente de um plano de compensa&ccedil;&atilde;o de tipo BASE, este &uacute;ltimo ser&aacute; automaticamente seleccionado devido &agrave; obrigatoriedade de rever simultaneamente os planos de compensa&ccedil;&atilde;o associados. Ou seja, os planos de compensa&ccedil;&atilde;o utilizados para rever o sal&aacute;rio base do empregado podem ser revistos em qualquer momento e de forma individual. No entanto, os planos de compensa&ccedil;&atilde;o utilizados para rever as vari&aacute;veis do empregado podem estar condicionados pelos seguintes aspectos<br/>1.- Um plano de compensa&ccedil;&otilde;es para rever uma determinada vari&aacute;vel est&aacute; associado ao plano de compensa&ccedil;&otilde;es para revis&atilde;o do sal&aacute;rio base. Isto implica que, durante a revis&atilde;o de um plano de compensa&ccedil;&otilde;es vari&aacute;vel, tenha de seleccionar o plano de compensa&ccedil;&atilde;o base para que sejam revistos simultaneamente. <br/>2.- O plano de compensa&ccedil;&atilde;o para a revis&atilde;o de um sal&aacute;rio vari&aacute;vel do empregado n&atilde;o est&aacute; dependente do sal&aacute;rio base, por isso poder&aacute; ser revisto sem qualquer tipo de restri&ccedil;&atilde;o do empregado e em qualquer momento. <br/>. Como atr&aacute;s referido, &eacute; poss&iacute;vel encontrar planos de compensa&ccedil;&atilde;o que necessitem de ser revistos em simult&acirc;neo. No entanto, existe uma excep&ccedil;&atilde;o. Esta condi&ccedil;&atilde;o verifica-se quando um plano de compensa&ccedil;&atilde;o vari&aacute;vel foi revisto em conjunto com o plano de compensa&ccedil;&atilde;o base correspondente e ambas as revis&otilde;es foram enviadas para o departamento de RH. &Eacute; poss&iacute;vel que os RH tenham aceitado a revis&atilde;o que prop&ocirc;s para o sal&aacute;rio base e recusado a revis&atilde;o proposta para o sal&aacute;rio vari&aacute;vel. Neste caso, quando regressar a este ecr&atilde;, poder&aacute; rever, para o empregado em quest&atilde;o, o sal&aacute;rio vari&aacute;vel dependente de forma individual, ou seja, sem ter que rever novamente o sal&aacute;rio base associado. Para tal, basta seleccionar a op&ccedil;&atilde;o de revis&atilde;o do plano de compensa&ccedil;&atilde;o vari&aacute;vel. Surgir&aacute; uma mensagem a avis&aacute;-lo da situa&ccedil;&atilde;o, para que possa tomar uma decis&atilde;o. 

msscr.ID22-3= Avalia&ccedil;&atilde;o do rendimento

msscr.ID23-3= Lista de valores poss&iacute;veis

msscr.Info23-3= As metodologias de aumento utilizadas para propor aumentos salariais para um empregado dependem do rendimento atingido pelo mesmo. Por isso, &eacute; necess&aacute;rio seleccionar o rendimento do empregado que o sistema dever&aacute; utilizar para propor aumentos salariais nas janelas seguintes. Ser&aacute; necess&aacute;rio seleccionar a avalia&ccedil;&atilde;o do rendimento sempre que um dos planos de compensa&ccedil;&atilde;o a rever necessitem desta selec&ccedil;&atilde;o. N&atilde;o obstante, quando premir o bot&atilde;o para avan&ccedil;ar no processo ser&aacute; informado que tem de seleccionar uma avalia&ccedil;&atilde;o do rendimento, sempre que esta seja necess&aacute;ria e n&atilde;o a tenha seleccionado previamente.

msscr.Info24-3= Clique neste bot&atilde;o para regressar &agrave; janela de selec&ccedil;&atilde;o de empregados. Se executar esta opera&ccedil;&atilde;o perder&aacute; todas as revis&otilde;es que n&atilde;o tenham sido enviadas at&eacute; ao momento pelo departamento de RH. Para todos os efeitos, se clicar neste bot&atilde;o o processo de revis&atilde;o salarial ser&aacute; reiniciado.

msscr.Info25-3= Este bot&atilde;o permite avan&ccedil;ar no processo de revis&atilde;o para o empregado visualizado no ecr&atilde;. N&atilde;o poder&aacute; avan&ccedil;ar no processo se n&atilde;o tiver seleccionado, pelo menos, um plano de compensa&ccedil;&atilde;o na lista de planos de compensa&ccedil;&atilde;o do empregado.

msscr.Info26-3= Este bot&atilde;o permite ignorar o empregado que est&aacute; a rever e elimin&aacute;-lo do processo de revis&atilde;o. Caso existam empregados com revis&atilde;o pendente que tenham sido seleccionados anteriormente, surgir&atilde;o no ecr&atilde; os dados do pr&oacute;ximo empregado a rever. Se n&atilde;o tiver mais empregados para rever, mas existirem revis&otilde;es anteriores que n&atilde;o tenham sido enviadas para o departamento de RH, o processo abrir&aacute; uma janela para envio das recomenda&ccedil;&otilde;es de aumentos salariais para os RH. Se n&atilde;o houver empregados para rever nem revis&otilde;es com envio pendente, o processo permitir&aacute; novamente o acesso directo &agrave; janela da lista de empregados da unidade organizativa seleccionada no in&iacute;cio da revis&atilde;o.

msscr.Info27-3= Este bot&atilde;o &eacute; semelhante ao anterior, com a excep&ccedil;&atilde;o de que n&atilde;o muda para o pr&oacute;ximo empregado a rever (se houver), ignorando todos os empregados com revis&atilde;o pendente e acedendo &agrave; janela que permite enviar recomenda&ccedil;&otilde;es de aumento para o departamento de RH.

msscr.ID24-3= Revis&atilde;o do sal&aacute;rio base

msscr.ID25-3= Grupo de dados

msscr.Info28-3= Este grupo cont&eacute;m toda a informa&ccedil;&atilde;o necess&aacute;ria &agrave; revis&atilde;o do sal&aacute;rio base para o empregado que aparece no ecr&atilde;. Em seguida, s&atilde;o indicados todos os campos deste grupo de dados.

msscr.ID26-3= &Uacute;ltima revis&atilde;o (valor)

msscr.ID27-3= Campo informativo

msscr.Info29-3= Este campo indica o valor estabelecido na &uacute;ltima revis&atilde;o do sal&aacute;rio base do empregado. Se o valor n&atilde;o estiver dispon&iacute;vel devido &agrave; aus&ecirc;ncia de uma revis&atilde;o pr&eacute;via, o campo ter&aacute; um valor zero (0).

msscr.ID28-3= &Uacute;ltima revis&atilde;o (% aumento)

msscr.ID29-3= Campo informativo

msscr.Info30-3= Este campo indica a percentagem de aumento da &uacute;ltima revis&atilde;o do sal&aacute;rio base do empregado. Caso este valor n&atilde;o esteja dispon&iacute;vel devido a uma revis&atilde;o pr&eacute;via, o campo ter&aacute; um valor zero (0).

msscr.ID30-3= &Uacute;ltima revis&atilde;o (posi&ccedil;&atilde;o)

msscr.Info31-3= Este campo indica a posi&ccedil;&atilde;o no grau/intervalo/zona salarial, conforme o valor estabelecido como sal&aacute;rio base na &uacute;ltima revis&atilde;o do empregado. A posi&ccedil;&atilde;o no intervalo indica o grau de penetra&ccedil;&atilde;o do sal&aacute;rio base do empregado no grau/intervalo/zona salarial da respectiva estrutura salarial. Para o c&aacute;lculo desta posi&ccedil;&atilde;o considera-se o sal&aacute;rio m&iacute;nimo do grau/intervalo/zona como 0% de penetra&ccedil;&atilde;o e o sal&aacute;rio m&aacute;ximo do grau/intervalo/zona como 100% de penetra&ccedil;&atilde;o. Os sal&aacute;rios inferiores ao sal&aacute;rio m&iacute;nimo resultar&atilde;o numa percentagem de penetra&ccedil;&atilde;o negativa, enquanto os sal&aacute;rios superiores ao sal&aacute;rio m&aacute;ximo resultar&atilde;o numa percentagem de penetra&ccedil;&atilde;o superior a 100%.

msscr.ID31-3= &Uacute;ltima revis&atilde;o (compa-ratio)

msscr.Info32-3= Ao contr&aacute;rio do grau de penetra&ccedil;&atilde;o do sal&aacute;rio do empregado no respectivo grau/intervalo/zona ou posi&ccedil;&atilde;o anteriormente descrito, a compa-ratio indica a taxa de penetra&ccedil;&atilde;o do sal&aacute;rio tendo em conta que o ponto m&eacute;dio do grau/intervalo/zona corresponde a uma taxa do 100%. Para tal, os sal&aacute;rios inferiores ao valor m&eacute;dio resultar&atilde;o numa compa-ratio inferior a 100% e superior a 100% no caso inverso.

msscr.ID32-3= Aumento proposto (valor)

msscr.Info33-3= Este campo &eacute; id&ecirc;ntico ao campo &Uacute;ltima revis&atilde;o, anteriormente descrito, com excep&ccedil;&atilde;o de que os valores apresentados no ecr&atilde; t&ecirc;m em conta o sal&aacute;rio base do empregado e as percentagens de aumento resultantes da aplica&ccedil;&atilde;o do grau de rendimento do empregado &agrave; metodologia de aumento utilizada pelo plano de compensa&ccedil;&atilde;o.

msscr.ID33-3= Aumento proposto (% aumento)

msscr.Info34-3= Id&ecirc;ntico ao campo &Uacute;ltima revis&atilde;o, anteriormente descrito, com a excep&ccedil;&atilde;o de que os valores apresentados no ecr&atilde; t&ecirc;m em conta o sal&aacute;rio base do empregado e as percentagens de aumento resultantes da aplica&ccedil;&atilde;o do grau de rendimento do empregado &agrave; metodologia de aumento utilizada pelo plano de compensa&ccedil;&atilde;o.

msscr.ID34-3= Aumento proposto (Posi&ccedil;&atilde;o)

msscr.ID35-3= Aumento recomendado (valor)

msscr.ID36-3= Campo edit&aacute;vel

msscr.Info35-3= Id&ecirc;ntico ao campo Aumento proposto, anteriormente descrito, com a excep&ccedil;&atilde;o de que os valores apresentados no ecr&atilde; t&ecirc;m em conta o aumento sobre o sal&aacute;rio base actual decidido pelo respons&aacute;vel com base nos campos anteriores correspondentes &agrave; proposta do pr&oacute;prio sistema. <u><b>Note que se o sal&aacute;rio base actual do empregado n&atilde;o estiver dispon&iacute;vel, o valor introduzido neste campo n&atilde;o ir&aacute; corresponder a um aumento sobre o sal&aacute;rio base, mas sim ao novo sal&aacute;rio base total recomendado pelo respons&aacute;vel.</b></u>

msscr.ID37-3= Aumento recomendado (% aumento)

msscr.Info36-3= Id&ecirc;ntico ao campo Aumento proposto, anteriormente descrito, com a excep&ccedil;&atilde;o de que os valores apresentados no ecr&atilde; t&ecirc;m em conta o aumento sobre o sal&aacute;rio base actual decidido pelo respons&aacute;vel com base nos campos anteriores correspondentes &agrave; proposta do pr&oacute;prio sistema. Se o sal&aacute;rio base actual do empregado n&atilde;o estiver dispon&iacute;vel, este campo n&atilde;o poder&aacute; ser alterado, dado n&atilde;o ser poss&iacute;vel introduzir percentagens de aumento sobre um valor que n&atilde;o existe.

msscr.ID38-3= Aumento recomendado (posi&ccedil;&atilde;o)

msscr.Info37-3= Id&ecirc;ntico ao campo Aumento proposto, anteriormente descrito, com a excep&ccedil;&atilde;o de que os valores apresentados no ecr&atilde; t&ecirc;m em conta o aumento sobre o novo sal&aacute;rio base resultante da aplica&ccedil;&atilde;o do aumento recomendado pelo respons&aacute;vel ao sal&aacute;rio base actual.

msscr.ID39-3= Aumento recomendado (Compa-ratio)

msscr.ID40-3= Sal&aacute;rio base total (valor)

msscr.Info38-3= Tendo em conta as recomenda&ccedil;&otilde;es feitas pelo respons&aacute;vel, este campo mostra o valor total correspondente ao novo sal&aacute;rio base do empregado.

msscr.ID41-3= Planos de compensa&ccedil;&atilde;o vari&atilde;veis

msscr.ID42-3= Aumento actual

msscr.ID43-3= Vari&aacute;vel proposto (valor total)

msscr.ID44-3= Vari&aacute;vel proposto (% do fixo)

msscr.ID45-3= Vari&aacute;vel proposto (valor do aumento)

msscr.ID46-3= Vari&aacute;vel proposto (% aumento)

msscr.ID47-3= Vari&aacute;vel recomendado (valor total)

msscr.ID48-3=  Vari&aacute;vel recomendado (% do fixo)

msscr.ID49-3=  Vari&aacute;vel recomendado (valor do aumento)

msscr.ID50-3=  Vari&aacute;vel recomendado (% aumento)

msscr.ID51-3=  Totais

msscr.ID52-3=  Aumento total recomendado

msscr.ID53-3=  Valor por excesso/por defeito

msscr.ID54-3=  Percentagem de altera&ccedil;&atilde;o

msscr.ID55-3=  Processo de avalia&ccedil;&atilde;o

msscr.Info39-3= Este grupo cont&eacute;m toda a informa&ccedil;&atilde;o necess&aacute;ria para rever os planos de compensa&ccedil;&atilde;o vari&aacute;veis seleccionados para o empregado. Para cada plano de compensa&ccedil;&atilde;o existe um grupo de dados diferente. Inicialmente, os planos s&atilde;o identificados pelo respectivo nome, valor actual e percentagem de aumento a que esse valor correspondeu na &uacute;ltima revis&atilde;o. Estes dois &uacute;ltimos valores ir&atilde;o surgir no ecr&atilde; sempre que estiverem dispon&iacute;veis, dada a possibilidade de n&atilde;o existir uma revis&atilde;o anterior para este empregado no referido plano. Nesse caso, estar&aacute; dispon&iacute;vel para consulta um coment&aacute;rio informativo. Em seguida, s&atilde;o apresentados todos os campos deste grupo de dados.

msscr.Info40-3= Este valor &eacute; expresso na moeda do empregado. Corresponde ao valor monet&aacute;rio proposto como aumento salarial para o empregado em fase de estudo, no &acirc;mbito do respectivo plano de compensa&ccedil;&atilde;o. Este valor &eacute; calculado atrav&eacute;s da aplica&ccedil;&atilde;o das percentagens de aumento recomendadas pela metodologia associada ao plano de compensa&ccedil;&atilde;o ao sal&aacute;rio base actual do empregado.

msscr.Info41-3= O valor correspondente a este plano de compensa&ccedil;&atilde;o representa uma determinada percentagem do sal&aacute;rio fixo do empregado. Nesta coluna &eacute; poss&iacute;vel verificar que percentagem do sal&aacute;rio do empregado representa o sal&aacute;rio para o plano de compensa&ccedil;&atilde;o em fase de estudo.

msscr.Info42-3= Este campo cont&eacute;m um valor monet&aacute;rio expresso na moeda do empregado. Este campo permite a visualiza&ccedil;&atilde;o do valor de aumento para este plano de compensa&ccedil;&atilde;o relativamente &agrave; &uacute;ltima revis&atilde;o do mesmo efectuada para o empregado que est&aacute; a rever.

msscr.Info43-3= Este campo cont&eacute;m a percentagem de aumento relativamente &agrave; revis&atilde;o anterior efectuada para o empregado no plano de compensa&ccedil;&atilde;o em fase de estudo.

msscr.Info44-3= Este campo pode ser edit&aacute;vel ou calculado, conforme as ac&ccedil;&otilde;es do gestor. Introduza um valor monet&aacute;rio expresso na moeda do empregado, indicada junto ao mesmo. O gestor pode introduzir neste campo o valor correspondente ao novo sal&aacute;rio para este plano de compensa&ccedil;&atilde;o e para o empregado que est&aacute; a rever. O valor introduzido neste campo corresponde ao sal&aacute;rio total (sal&aacute;rio correspondente ao plano de compensa&ccedil;&atilde;o em fase de estudo).

msscr.Info45-3= Este campo pode ser edit&aacute;vel ou calculado, conforme as ac&ccedil;&otilde;es do gestor. O gestor pode atribuir directamente uma percentagem do sal&aacute;rio base para definir o novo sal&aacute;rio para o plano de compensa&ccedil;&atilde;o em fase de estudo. Se o gestor introduzir uma percentagem nesta coluna, os restantes campos da mesma linha ser&atilde;o automaticamente recalculados tendo em conta a percentagem introduzida pelo gestor.

msscr.Info46-3= Este campo pode ser edit&aacute;vel ou calculado, conforme as ac&ccedil;&otilde;es do gestor. O gestor pode atribuir directamente o valor do aumento, expresso na moeda do empregado indicada junto ao mesmo. Este valor de aumento &eacute; relativo ao sal&aacute;rio actual correspondente ao plano de compensa&ccedil;&atilde;o em fase de estudo. Se o gestor introduzir um valor monet&aacute;rio nesta coluna, os restantes campos da mesma linha ser&atilde;o automaticamente recalculados tendo em conta o valor introduzido pelo gestor.

msscr.Info47-3= Este campo pode ser edit&aacute;vel ou calculado, conforme as ac&ccedil;&otilde;es do gestor. O gestor pode atribuir directamente uma percentagem de aumento sobre a &uacute;ltima revis&atilde;o ou sobre o valor actual para este plano salarial de forma a definir o novo sal&aacute;rio para o plano de compensa&ccedil;&atilde;o em fase de estudo. Se o gestor introduzir uma percentagem nesta coluna, os restantes campos da mesma linha ser&atilde;o automaticamente recalculados tendo em conta a percentagem introduzida pelo gestor. <b>Nota importante:</b> Os planos de compensa&ccedil;&atilde;o em fase de revis&atilde;o, cujas metodologias de aumento se rejam por regras que tenham em conta a avalia&ccedil;&atilde;o do desempenho, n&atilde;o ter&atilde;o em conta esta informa&ccedil;&atilde;o no momento de propor um aumento de sal&aacute;rio.

msscr.Info48-3= Esta sec&ccedil;&atilde;o especifica e calcula uma s&eacute;rie de dados monet&aacute;rios e percentagens totais resultantes das ac&ccedil;&otilde;es do gestor durante a revis&atilde;o do plano de compensa&ccedil;&atilde;o do empregado, agregando a informa&ccedil;&atilde;o dos diferentes planos de compensa&ccedil;&atilde;o revistos para o empregado. Iremos, em seguida, analisar os campos deste grupo.

msscr.Info49-3= Esta coluna cont&eacute;m a soma dos valores monet&aacute;rios de aumento propostos pelo gestor. Cada plano de compensa&ccedil;&atilde;o numa das op&ccedil;&otilde;es anteriormente descritas cont&eacute;m o valor final de aumento para esse plano de compensa&ccedil;&atilde;o. Esta coluna inclui o total dos valores parciais com uma informa&ccedil;&atilde;o final correspondente &agrave; soma de todos os planos de compensa&ccedil;&atilde;o.

msscr.Info50-3= Esta coluna cont&eacute;m um valor monet&aacute;rio, expresso na moeda do empregado, e apresenta a soma de todos os aumentos propostos pelo gestor com a soma de todos os aumentos propostos pelas metodologias de cada plano de compensa&ccedil;&atilde;o revistos para o empregado em fase de estudo.

msscr.Info51-3= Esta coluna cont&eacute;m um valor monet&aacute;rio expresso na moeda do empregado resultante da subtrac&ccedil;&atilde;o do valor total proposto pelas metodologias de aumento ao valor total proposto pelo gestor. &Eacute; um valor indicativo que permite ao gestor determinar o desvio relativamente &agrave;s propostas resultantes do valor total das metodologias de aumento.

msscr.Info52-3= Esta coluna indica a percentagem de desvio entre o valor total de aumento proposto pelas metodologias de aumento e o valor total de aumento proposto pelo gestor.

msscr.Info53-3= Prima este bot&atilde;o para voltar &agrave; p&aacute;gina anterior, ou seja, &agrave; p&aacute;gina que permite seleccionar os planos de compensa&ccedil;&atilde;o a rever para o empregado. Tal pode ser &uacute;til para rectificar os planos de compensa&ccedil;&atilde;o actualmente seleccionados. As opera&ccedil;&otilde;es realizadas neste ecr&atilde; ser&atilde;o perdidas.

msscr.Info54-3= Prima este bot&atilde;o para abrir o ecr&atilde; seguinte. O ecr&atilde; seguinte poder&aacute; ser diferente, conforme a sua situa&ccedil;&atilde;o no fluxo de trabalho. O ecr&atilde; seguinte pode corresponder a um dos seguintes:<br><b>1.- </b>Um ecr&atilde; que permite rever o empregado seguinte, se houver mais empregados para rever.<br><b>2.- </b>Um ecr&atilde; que resume todas as revis&otilde;es salariais realizadas at&eacute; ao momento, caso existam revis&otilde;es salariais efectuadas para um ou mais empregados (incluindo o empregado actualmente em revis&atilde;o). <br><b>3.- </b>Um ecr&atilde; com uma lista dos empregados pertencentes &agrave; unidade organizativa para a qual est&aacute; a ser realizado o processo de revis&atilde;o salarial, caso a revis&atilde;o salarial n&atilde;o tenha sido efectuada para qualquer um dos empregados.

msscr.Info55-3= Este ecr&atilde; apresenta, em formato resumido, todas as opera&ccedil;&otilde;es realizadas no &acirc;mbito do processo de revis&atilde;o salarial para todos os empregados revistos no processo. Este ecr&atilde; permite verificar os totais de aumentos para cada empregado, tanto no sal&aacute;rio fixo como no sal&aacute;rio vari&aacute;vel. Este ecr&atilde; tamb&eacute;m permite seleccionar, no conjunto dos empregados revistos, quais as pessoas que se pretende comunicar definitivamente ao departamento de RH para que o mesmo confirme e aprove as recomenda&ccedil;&otilde;es de aumento salarial apresentadas.

msscr.Info56-3 = Esta coluna apresenta os nomes e apelidos dos empregados para os quais foi conclu&iacute;do o processo de revis&atilde;o salarial.

msscr.Info57-3 = Esta coluna apresenta o n&iacute;vel de rendimento atribu&iacute;do a cada empregado, sempre que este dado tenha sido introduzido. Note-se que este dado deve ser introduzido sempre que o empregado tenha sido revisto no &acirc;mbito de um ou mais planos de compensa&ccedil;&atilde;o que exijam esta informa&ccedil;&atilde;o para propor aumentos salariais, como &eacute; o caso, por exemplo, de todos os planos de compensa&ccedil;&atilde;o que tenham associada uma metodologia de c&aacute;lculo de aumento diferente. A avalia&ccedil;&atilde;o do rendimento ser&aacute; apresentada nos casos em que tenha sido necess&aacute;rio, nos ecr&atilde;s anteriores, seleccionar este dado para rever os planos de compensa&ccedil;&atilde;o do empregado.

msscr.Info58-3 = Esta coluna apresenta dois valores: o sal&aacute;rio fixo do empregado proposto segundo a metodologia de aumento correspondente e o valor recomendado pelo gestor. Isto permite visualizar, de uma forma pr&aacute;tica e antes de enviar os dados para o departamento de RH, as diferen&ccedil;as entre os valores proposto e recomendado.

msscr.Info59-3 = Esta coluna apresenta dois valores: o sal&aacute;rio vari&aacute;vel do empregado proposto segundo a metodologia de aumento correspondente e o valor recomendado pelo gestor. Isto permite visualizar, de uma forma pr&aacute;tica e antes de enviar os dados para o departamento de RH, as diferen&ccedil;as entre os valores proposto e recomendado.

msscr.Info60-3 = Esta coluna apresenta dois valores: o sal&aacute;rio total (fixo + vari&aacute;vel) proposto segundo as metodologias de aumento e o sal&aacute;rio total (fixo + vari&aacute;vel) recomendado pelo gestor.

msscr.Info61-3 = Esta coluna indica ao gestor a posi&ccedil;&atilde;o actual do sal&aacute;rio do empregado no intervalo salarial correspondente ao grau/intervalo/zona do empregado. O valor compa-ratio corresponde &agrave; posi&ccedil;&atilde;o num intervalo salarial, tendo em conta que o valor m&eacute;dio do intervalo &eacute; de 100%.

msscr.Info62-3 = Esta coluna permite seleccionar os empregados que pretende enviar directamente para o departamento de RH juntamente com a informa&ccedil;&atilde;o relativa &agrave; sua revis&atilde;o salarial. Os empregados que n&atilde;o forem seleccionados n&atilde;o ser&atilde;o enviados para o departamento de RH e as respectivas revis&otilde;es salariais ser&atilde;o perdidas.

msscr.Info63-3 = Prima este bot&atilde;o para confirmar o envio dos empregados seleccionados, com as respectivas revis&otilde;es salariais, para o departamento de RH.

msscr.Info64-3 = FIXO

msscr.Info65-3 = Este ecr&atilde; apresenta o estado de todos os pedidos de aumento salarial enviados para o departamento de RH. Poder&aacute; visualizar, para cada empregado que tenha sido enviado, um grupo com informa&ccedil;&atilde;o sobre a revis&atilde;o efectuada em cada plano de compensa&ccedil;&atilde;o. Os tr&ecirc;s estados poss&iacute;veis da revis&atilde;o salarial s&atilde;o: <br/>1.- <b>Pendente:</b> O departamento de RH ainda n&atilde;o se pronunciou sobre a revis&atilde;o salarial em causa<br/>2.-<b>Aceite:</b> O Departamento de RH aceitou a recomenda&ccedil;&atilde;o do gestor relativamente &agrave; revis&atilde;o salarial de um determinado empregado para um determinado plano de compensa&ccedil;&atilde;o. <br/>3.-<b>Recusada:</b> O Departamento de RH recusou a recomenda&ccedil;&atilde;o do gestor relativamente &agrave; revis&atilde;o salarial de um determinado empregado para um determinado plano de compensa&ccedil;&atilde;o.

msscr.Info66-3 = Esta coluna permite pesquisar informa&ccedil;&otilde;es sobre o empregado. Os grupos no ecr&atilde; correspondem &agrave;s revis&otilde;es salariais enviadas para o departamento de RH para um determinado empregado. Esta coluna apresenta o nome, apelido e designa&ccedil;&atilde;o do role do empregado.

msscr.Info67-3 = Esta coluna cont&eacute;m a informa&ccedil;&atilde;o (nome e tipo de plano de compensa&ccedil;&atilde;o) para cada plano de compensa&ccedil;&atilde;o visualizado para o empregado.

msscr.Info68-3 = Esta coluna cont&eacute;m um valor monet&aacute;rio expresso na moeda do empregado. O valor nesta coluna corresponde ao valor total de aumento recomendado pelo gestor para o plano de compensa&ccedil;&atilde;o em estudo.

msscr.Info69-3 = Esta coluna cont&eacute;m um valor monet&aacute;rio expresso na moeda do empregado. O valor contido nesta coluna corresponde ao valor total anterior do empregado no plano de compensa&ccedil;&atilde;o em fase de estudo.

msscr.Info70-3 = Esta coluna cont&eacute;m um valor monet&aacute;rio expresso na moeda do empregado. O valor presente nesta coluna corresponde &agrave; diferen&ccedil;a entre as duas colunas anteriores, ou seja, cont&eacute;m o valor real do aumento proposto pelo gestor, calculado como a diferen&ccedil;a entre o valor total proposto e o valor anterior &agrave; revis&atilde;o salarial.

msscr.Info71-3 = Esta coluna cont&eacute;m o valor descrito para a coluna anterior, mas expresso em percentagem e n&atilde;o em valor monet&aacute;rio.

msscr.Info72-3 = Esta liga&ccedil;&atilde;o permite aceder a um ecr&atilde; onde se podem visualizar todas as mensagens geradas pelo processo de revis&atilde;o salarial. As mensagens podem ter origem em dois locais diferentes: o gestor respons&aacute;vel pela revis&atilde;o salarial, que est&aacute; autorizado a introduzir mensagens tendo como destinat&aacute;rio o departamento de RH, sob a forma de notas sobre os motivos das recomenda&ccedil;&otilde;es de aumento salarial. Paralelamente, ao processar os pedidos enviados pelo gestor, o departamento de RH est&aacute; autorizado a introduzir mensagens, quer em resposta aos pedidos introduzidos pelo gestor, quer para introduzir novas informa&ccedil;&otilde;es relevantes sobre o motivo das suas decis&otilde;es.

msscr.Info73-3= Este relat&oacute;rio permite obter os resultados globais dos Compensation Review aprovados. Os dados constantes do relat&oacute;rio dizem respeito a processos de revis&atilde;o realizados no per&iacute;odo compreendido entre as datas seleccionadas. Nenhum dos filtros &eacute; obrigat&oacute;rio. Por isso, caso n&atilde;o se aplique qualquer crit&eacute;rio de selec&ccedil;&atilde;o, o relat&oacute;rio apresentar&aacute; todos os dados dispon&iacute;veis.

