name: Verify hire integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Use repository line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Oxlint
        run: npx oxlint

      - name: Check formatting of direct hire modules
        run: >
          & .\node_modules\.bin\oxfmt.cmd --check
          src/app/actions/meta4-hire.ts
          src/components/tools/users/users-hire-form.tsx
          src/lib/meta4/hire/direct
          src/lib/meta4/hire/service.ts

      - name: Check pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check $env:BASE_SHA HEAD -- . ':(exclude,glob)**/*.pdf'

      - name: Check clean worktree
        run: |
          if (git status --porcelain) {
            git status --short
            exit 1
          }
